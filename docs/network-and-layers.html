ttention\"</span><span class=\"p\">,</span> <span class=\"s2\">\"attention\"</span><span class=\"p\">,</span> <span class=\"s2\">\"encoder decoder\"</span><span class=\"p\">,</span> <span class=\"s2\">\"context\"</span><span class=\"p\">,</span> <span class=\"s2\">\"multimodal\"</span><span class=\"p\">,</span> <span class=\"s2\">\"mha\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">context</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">q_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">k_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">v_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">out_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">q_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">k_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">v_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">out_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">mask</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">num_heads</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">4</span><span class=\"p\">,</span>\n        <span class=\"n\">dropout_p</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">0.0</span><span class=\"p\">,</span>\n        <span class=\"n\">seed</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">0</span><span class=\"p\">,</span>\n        <span class=\"n\">mode</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"n\">MODE_TRAIN</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span>\n            <span class=\"n\">_multi_head_attention</span><span class=\"p\">(</span>\n                <span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">context</span><span class=\"p\">,</span> <span class=\"n\">context</span><span class=\"p\">,</span>\n                <span class=\"n\">q_weight</span><span class=\"p\">,</span> <span class=\"n\">k_weight</span><span class=\"p\">,</span> <span class=\"n\">v_weight</span><span class=\"p\">,</span> <span class=\"n\">out_weight</span><span class=\"p\">,</span>\n                <span class=\"n\">q_bias</span><span class=\"o\">=</span><span class=\"n\">q_bias</span><span class=\"p\">,</span> <span class=\"n\">k_bias</span><span class=\"o\">=</span><span class=\"n\">k_bias</span><span class=\"p\">,</span> <span class=\"n\">v_bias</span><span class=\"o\">=</span><span class=\"n\">v_bias</span><span class=\"p\">,</span> <span class=\"n\">out_bias</span><span class=\"o\">=</span><span class=\"n\">out_bias</span><span class=\"p\">,</span>\n                <span class=\"n\">mask</span><span class=\"o\">=</span><span class=\"n\">mask</span><span class=\"p\">,</span> <span class=\"n\">num_heads</span><span class=\"o\">=</span><span class=\"n\">num_heads</span><span class=\"p\">,</span> <span class=\"n\">dropout_p</span><span class=\"o\">=</span><span class=\"n\">dropout_p</span><span class=\"p\">,</span>\n                <span class=\"n\">training</span><span class=\"o\">=</span><span class=\"n\">_normalize_mode</span><span class=\"p\">(</span><span class=\"n\">mode</span><span class=\"p\">)</span> <span class=\"o\">==</span> <span class=\"n\">MODE_TRAIN</span><span class=\"p\">,</span> <span class=\"n\">seed</span><span class=\"o\">=</span><span class=\"n\">seed</span><span class=\"p\">,</span>\n            <span class=\"p\">)</span>\n        <span class=\"p\">)</span>\n"}, "TransformerEncoderBlock": {"id": "TransformerEncoderBlock", "name": "Transformer Encoder Block", "cat": "Attention", "desc": "Post-LN Transformer encoder block: LayerNorm -> MHA -> Add -> LayerNorm -> FFN -> Add, all weights wired in.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TransformerEncoderBlock</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"One post-LN Transformer encoder block in a single node.</span>\n\n<span class=\"sd\">    What: ``LayerNorm -&gt; Multi-Head Attention -&gt; Add -&gt; LayerNorm -&gt; FFN -&gt; Add``</span>\n<span class=\"sd\">          assembled from the wired weights: the four attention projections, the</span>\n<span class=\"sd\">          two FFN matrices and the two LayerNorm affines all arrive through</span>\n<span class=\"sd\">          slots, so the block stays stateless and runs any checkpoint. It is the</span>\n<span class=\"sd\">          self-attention + feed-forward half of every Transformer encoder;</span>\n<span class=\"sd\">          stacking blocks (feed this node's output into the next one's</span>\n<span class=\"sd\">          ``tensor``) builds a full encoder. LayerNorm affines left unconnected</span>\n<span class=\"sd\">          give a non-affine ``F.layer_norm``; everything else is required.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - ``(..., L, E_in)``; the block's input and residual.</span>\n<span class=\"sd\">          q_weight, k_weight, v_weight (TENSOR) - ``(E, E_in)`` each;</span>\n<span class=\"sd\">          ``out_weight`` - ``(E, E)`` (square: the residual needs the same</span>\n<span class=\"sd\">          width); ``E`` must be divisible by ``num_heads``.</span>\n<span class=\"sd\">          ffn1_weight (TENSOR) - ``(ffn_dim, E)``; ``ffn2_weight`` -</span>\n<span class=\"sd\">          ``(E, ffn_dim)``.</span>\n<span class=\"sd\">          q_bias, k_bias, v_bias, out_bias, ffn1_bias, ffn2_bias (TENSOR,</span>\n<span class=\"sd\">          optional) - ``(E,)`` / ``(E,)`` / ``(E,)`` / ``(E,)`` / ``(ffn_dim,)``</span>\n<span class=\"sd\">          / ``(E,)``.</span>\n<span class=\"sd\">          ln1_weight, ln1_bias, ln2_weight, ln2_bias (TENSOR, optional) -</span>\n<span class=\"sd\">          ``(E,)`` each; unconnected = non-affine LayerNorm.</span>\n<span class=\"sd\">          mask (TENSOR, optional) - attention mask as in ``Multi-Head</span>\n<span class=\"sd\">          Attention``.</span>\n<span class=\"sd\">          num_heads (INT) - attention heads (default 4).</span>\n<span class=\"sd\">          dropout_p (FLOAT) - attention-weight dropout probability; train mode</span>\n<span class=\"sd\">          only, 0 disables.</span>\n<span class=\"sd\">          ffn_activation (COMBO) - activation between the FFN linear layers,</span>\n<span class=\"sd\">          ``relu`` (default) or ``gelu``.</span>\n<span class=\"sd\">          seed (INT) - seed of the dropout draw.</span>\n<span class=\"sd\">          mode (STRING, optional) - link the ``mode`` output of a Training Mode</span>\n<span class=\"sd\">          node; unconnected means ``train``.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - ``(..., L, E)``; dtype promotion as in</span>\n<span class=\"sd\">          ``BasicLinear``.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_attention_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"TransformerEncoderBlock\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Transformer Encoder Block\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Post-LN Transformer encoder block: LayerNorm -&gt; MHA -&gt; Add -&gt; LayerNorm -&gt; FFN -&gt; Add, all weights wired in.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Input sequence of shape (..., seq_len, width); it is both the attention source and the residual.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"q_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"k_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"v_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"out_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"ffn1_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"ffn_dim\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"ffn2_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"q_bias\"</span><span class=\"p\">,</span> <span class=\"s2\">\"width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"k_bias\"</span><span class=\"p\">,</span> <span class=\"s2\">\"width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"v_bias\"</span><span class=\"p\">,</span> <span class=\"s2\">\"width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"out_bias\"</span><span class=\"p\">,</span> <span class=\"s2\">\"width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"ffn1_bias\"</span><span class=\"p\">,</span> <span class=\"s2\">\"ffn_dim\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"ffn2_bias\"</span><span class=\"p\">,</span> <span class=\"s2\">\"width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"ln1_weight\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional LayerNorm scale of shape (width,) after the attention residual; unconnected = non-affine LayerNorm.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"ln1_bias\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional LayerNorm shift of shape (width,) after the attention residual; unconnected = none.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"ln2_weight\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional LayerNorm scale of shape (width,) after the FFN residual; unconnected = non-affine LayerNorm.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"ln2_bias\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional LayerNorm shift of shape (width,) after the FFN residual; unconnected = none.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">_mask_input</span><span class=\"p\">(),</span>\n                <span class=\"n\">_num_heads_input</span><span class=\"p\">(),</span>\n                <span class=\"n\">_dropout_p_input</span><span class=\"p\">(),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Combo</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"ffn_activation\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">options</span><span class=\"o\">=</span><span class=\"nb\">list</span><span class=\"p\">(</span><span class=\"n\">FFN_ACTIVATION_OPTIONS</span><span class=\"p\">),</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"relu\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Activation between the two FFN linear layers.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">_seed_input</span><span class=\"p\">(),</span>\n                <span class=\"n\">_attn_mode_input</span><span class=\"p\">(),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"transformer\"</span><span class=\"p\">,</span> <span class=\"s2\">\"encoder block\"</span><span class=\"p\">,</span> <span class=\"s2\">\"post ln\"</span><span class=\"p\">,</span> <span class=\"s2\">\"residual\"</span><span class=\"p\">,</span> <span class=\"s2\">\"self attention\"</span><span class=\"p\">,</span> <span class=\"s2\">\"ffn\"</span><span class=\"p\">,</span> <span class=\"s2\">\"feed forward\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">q_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">k_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">v_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">out_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">ffn1_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">ffn2_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">q_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">k_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">v_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">out_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">ffn1_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">ffn2_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">ln1_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">ln1_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">ln2_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">ln2_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">mask</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">num_heads</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">4</span><span class=\"p\">,</span>\n        <span class=\"n\">dropout_p</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">0.0</span><span class=\"p\">,</span>\n        <span class=\"n\">ffn_activation</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"s2\">\"relu\"</span><span class=\"p\">,</span>\n        <span class=\"n\">seed</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">0</span><span class=\"p\">,</span>\n        <span class=\"n\">mode</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"n\">MODE_TRAIN</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">training</span> <span class=\"o\">=</span> <span class=\"n\">_normalize_mode</span><span class=\"p\">(</span><span class=\"n\">mode</span><span class=\"p\">)</span> <span class=\"o\">==</span> <span class=\"n\">MODE_TRAIN</span>\n        <span class=\"n\">attn</span> <span class=\"o\">=</span> <span class=\"n\">_multi_head_attention</span><span class=\"p\">(</span>\n            <span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">,</span>\n            <span class=\"n\">q_weight</span><span class=\"p\">,</span> <span class=\"n\">k_weight</span><span class=\"p\">,</span> <span class=\"n\">v_weight</span><span class=\"p\">,</span> <span class=\"n\">out_weight</span><span class=\"p\">,</span>\n            <span class=\"n\">q_bias</span><span class=\"o\">=</span><span class=\"n\">q_bias</span><span class=\"p\">,</span> <span class=\"n\">k_bias</span><span class=\"o\">=</span><span class=\"n\">k_bias</span><span class=\"p\">,</span> <span class=\"n\">v_bias</span><span class=\"o\">=</span><span class=\"n\">v_bias</span><span class=\"p\">,</span> <span class=\"n\">out_bias</span><span class=\"o\">=</span><span class=\"n\">out_bias</span><span class=\"p\">,</span>\n            <span class=\"n\">mask</span><span class=\"o\">=</span><span class=\"n\">mask</span><span class=\"p\">,</span> <span class=\"n\">num_heads</span><span class=\"o\">=</span><span class=\"n\">num_heads</span><span class=\"p\">,</span> <span class=\"n\">dropout_p</span><span class=\"o\">=</span><span class=\"n\">dropout_p</span><span class=\"p\">,</span>\n            <span class=\"n\">training</span><span class=\"o\">=</span><span class=\"n\">training</span><span class=\"p\">,</span> <span class=\"n\">seed</span><span class=\"o\">=</span><span class=\"n\">seed</span><span class=\"p\">,</span>\n        <span class=\"p\">)</span>\n        <span class=\"n\">hidden</span> <span class=\"o\">=</span> <span class=\"n\">_block_layer_norm</span><span class=\"p\">(</span><span class=\"n\">tensor</span> <span class=\"o\">+</span> <span class=\"n\">attn</span><span class=\"p\">,</span> <span class=\"n\">ln1_weight</span><span class=\"p\">,</span> <span class=\"n\">ln1_bias</span><span class=\"p\">,</span> <span class=\"s2\">\"ln1\"</span><span class=\"p\">)</span>\n        <span class=\"n\">ffn</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">linear</span><span class=\"p\">(</span>\n            <span class=\"n\">_ffn_activation</span><span class=\"p\">(</span><span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">linear</span><span class=\"p\">(</span><span class=\"n\">hidden</span><span class=\"p\">,</span> <span class=\"n\">ffn1_weight</span><span class=\"p\">,</span> <span class=\"n\">ffn1_bias</span><span class=\"p\">),</span> <span class=\"n\">ffn_activation</span><span class=\"p\">),</span>\n            <span class=\"n\">ffn2_weight</span><span class=\"p\">,</span>\n            <span class=\"n\">ffn2_bias</span><span class=\"p\">,</span>\n        <span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">_block_layer_norm</span><span class=\"p\">(</span><span class=\"n\">hidden</span> <span class=\"o\">+</span> <span class=\"n\">ffn</span><span class=\"p\">,</span> <span class=\"n\">ln2_weight</span><span class=\"p\">,</span> <span class=\"n\">ln2_bias</span><span class=\"p\">,</span> <span class=\"s2\">\"ln2\"</span><span class=\"p\">))</span>\n"}, "TransformerDecoderBlock": {"id": "TransformerDecoderBlock", "name": "Transformer Decoder Block", "cat": "Attention", "desc": "Post-LN Transformer decoder block: Self-Attn -> Add -> LN -> Cross-Attn (k/v from context) -> Add -> LN -> FFN -> Add -> LN, all weights wired in.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TransformerDecoderBlock</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"One post-LN Transformer decoder block: self-attention, then cross.</span>\n\n<span class=\"sd\">    What: the decoder half of the original Transformer - a self-attention</span>\n<span class=\"sd\">          sub-block over ``tensor`` (typically with a causal ``self_mask`` so</span>\n<span class=\"sd\">          the decoder stays autoregressive), a cross-attention sub-block whose</span>\n<span class=\"sd\">          keys/values come from ``context`` (the encoder output, or any other</span>\n<span class=\"sd\">          modality to condition on), and the FFN sub-block:</span>\n<span class=\"sd\">          ``Self-Attn -&gt; Add -&gt; LN -&gt; Cross-Attn -&gt; Add -&gt; LN -&gt; FFN -&gt; Add -&gt;</span>\n<span class=\"sd\">          LN`` - the same post-LN shape as ``TransformerEncoderBlock``, one</span>\n<span class=\"sd\">          sub-block more. Both attention weight sets, the FFN matrices and the</span>\n<span class=\"sd\">          three LayerNorm affines arrive through slots, so the block is</span>\n<span class=\"sd\">          stateless and runs any checkpoint. Stacking works by feeding this</span>\n<span class=\"sd\">          node's output into the next node's ``tensor``; every stacked block</span>\n<span class=\"sd\">          usually attends to the same ``context``.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - ``(..., L, E_in)``; the decoder sequence and the</span>\n<span class=\"sd\">          residual of all three sub-blocks.</span>\n<span class=\"sd\">          context (TENSOR) - ``(..., S, E_kv)``; provides the cross-attention</span>\n<span class=\"sd\">          keys/values (the encoder output); shares the leading batch dims with</span>\n<span class=\"sd\">          ``tensor``.</span>\n<span class=\"sd\">          q_weight, k_weight, v_weight, out_weight (TENSOR) - the</span>\n<span class=\"sd\">          **self-attention** projections, ``(E, E_in)`` / ``(E, E_in)`` /</span>\n<span class=\"sd\">          ``(E, E_in)`` / ``(E, E)`` (square: the residual needs the same</span>\n<span class=\"sd\">          width); ``E`` must be divisible by ``num_heads``.</span>\n<span class=\"sd\">          cross_q_weight, cross_k_weight, cross_v_weight, cross_out_weight</span>\n<span class=\"sd\">          (TENSOR) - the **cross-attention** projections, ``(E, E)`` /</span>\n<span class=\"sd\">          ``(E, E_kv)`` / ``(E, E_kv)`` / ``(E, E)``.</span>\n<span class=\"sd\">          ffn1_weight (TENSOR) - ``(ffn_dim, E)``; ``ffn2_weight`` -</span>\n<span class=\"sd\">          ``(E, ffn_dim)``.</span>\n<span class=\"sd\">          q_bias, k_bias, v_bias, out_bias, cross_q_bias, cross_k_bias,</span>\n<span class=\"sd\">          cross_v_bias, cross_out_bias, ffn1_bias, ffn2_bias (TENSOR,</span>\n<span class=\"sd\">          optional) - ``(E,)`` / ``(E,)`` / ``(E,)`` / ``(E,)`` / ``(E,)`` /</span>\n<span class=\"sd\">          ``(E,)`` / ``(E,)`` / ``(E,)`` / ``(ffn_dim,)`` / ``(E,)``.</span>\n<span class=\"sd\">          ln1_weight, ln1_bias, ln2_weight, ln2_bias, ln3_weight, ln3_bias</span>\n<span class=\"sd\">          (TENSOR, optional) - ``(E,)`` each; unconnected = non-affine</span>\n<span class=\"sd\">          LayerNorm (after the self-attention, cross-attention and FFN</span>\n<span class=\"sd\">          residuals respectively).</span>\n<span class=\"sd\">          self_mask (TENSOR, optional) - attention mask of the self-attention</span>\n<span class=\"sd\">          sub-block, as in ``Multi-Head Attention``; wire a Causal Mask here</span>\n<span class=\"sd\">          for an autoregressive decoder.</span>\n<span class=\"sd\">          cross_mask (TENSOR, optional) - attention mask of the cross-attention</span>\n<span class=\"sd\">          sub-block (over the context positions), same convention.</span>\n<span class=\"sd\">          num_heads (INT) - attention heads (default 4).</span>\n<span class=\"sd\">          dropout_p (FLOAT) - attention-weight dropout probability (both</span>\n<span class=\"sd\">          sub-blocks); train mode only, 0 disables.</span>\n<span class=\"sd\">          ffn_activation (COMBO) - activation between the FFN linear layers,</span>\n<span class=\"sd\">          ``relu`` (default) or ``gelu``.</span>\n<span class=\"sd\">          seed (INT) - seed of the dropout draws.</span>\n<span class=\"sd\">          mode (STRING, optional) - link the ``mode`` output of a Training Mode</span>\n<span class=\"sd\">          node; unconnected means ``train``.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - ``(..., L, E)``; dtype promotion as in</span>\n<span class=\"sd\">          ``BasicLinear``.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_attention_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"TransformerDecoderBlock\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Transformer Decoder Block\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Post-LN Transformer decoder block: Self-Attn -&gt; Add -&gt; LN -&gt; Cross-Attn (k/v from context) -&gt; Add -&gt; LN -&gt; FFN -&gt; Add -&gt; LN, all weights wired in.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Decoder sequence of shape (..., seq_len, width); it is the query source of the self-attention and the residual of every sub-block.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"context\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Context of shape (..., context_len, context_width) providing the cross-attention keys/values (the encoder output); same leading batch dims as tensor.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"q_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"k_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"v_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weig >ln3_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">ln3_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">self_mask</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">cross_mask</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">num_heads</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">4</span><span class=\"p\">,</span>\n        <span class=\"n\">dropout_p</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">0.0</span><span class=\"p\">,</span>\n        <span class=\"n\">ffn_activation</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"s2\">\"relu\"</span><span class=\"p\">,</span>\n        <span class=\"n\">seed</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">0</span><span class=\"p\">,</span>\n        <span class=\"n\">mode</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"n\">MODE_TRAIN</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">training</span> <span class=\"o\">=</span> <span class=\"n\">_normalize_mode</span><span class=\"p\">(</span><span class=\"n\">mode</span><span class=\"p\">)</span> <span class=\"o\">==</span> <span class=\"n\">MODE_TRAIN</span>\n        <span class=\"c1\"># Sub-block 1: self-attention over the decoder sequence (causal when</span>\n        <span class=\"c1\"># self_mask is the Causal Mask), then the post-LN residual.</span>\n        <span class=\"n\">self_attn</span> <span class=\"o\">=</span> <span class=\"n\">_multi_head_attention</span><span class=\"p\">(</span>\n            <span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">,</span>\n            <span class=\"n\">q_weight</span><span class=\"p\">,</span> <span class=\"n\">k_weight</span><span class=\"p\">,</span> <span class=\"n\">v_weight</span><span class=\"p\">,</span> <span class=\"n\">out_weight</span><span class=\"p\">,</span>\n            <span class=\"n\">q_bias</span><span class=\"o\">=</span><span class=\"n\">q_bias</span><span class=\"p\">,</span> <span class=\"n\">k_bias</span><span class=\"o\">=</span><span class=\"n\">k_bias</span><span class=\"p\">,</span> <span class=\"n\">v_bias</span><span class=\"o\">=</span><span class=\"n\">v_bias</span><span class=\"p\">,</span> <span class=\"n\">out_bias</span><span class=\"o\">=</span><span class=\"n\">out_bias</span><span class=\"p\">,</span>\n            <span class=\"n\">mask</span><span class=\"o\">=</span><span class=\"n\">self_mask</span><span class=\"p\">,</span> <span class=\"n\">num_heads</span><span class=\"o\">=</span><span class=\"n\">num_heads</span><span class=\"p\">,</span> <span class=\"n\">dropout_p</span><span class=\"o\">=</span><span class=\"n\">dropout_p</span><span class=\"p\">,</span>\n            <span class=\"n\">training</span><span class=\"o\">=</span><span class=\"n\">training</span><span class=\"p\">,</span> <span class=\"n\">seed</span><span class=\"o\">=</span><span class=\"n\">seed</span><span class=\"p\">,</span>\n        <span class=\"p\">)</span>\n        <span class=\"n\">hidden</span> <span class=\"o\">=</span> <span class=\"n\">_block_layer_norm</span><span class=\"p\">(</span><span class=\"n\">tensor</span> <span class=\"o\">+</span> <span class=\"n\">self_attn</span><span class=\"p\">,</span> <span class=\"n\">ln1_weight</span><span class=\"p\">,</span> <span class=\"n\">ln1_bias</span><span class=\"p\">,</span> <span class=\"s2\">\"ln1\"</span><span class=\"p\">)</span>\n        <span class=\"c1\"># Sub-block 2: cross-attention - queries from the decoder, keys/values</span>\n        <span class=\"c1\"># from the context (the encoder output).</span>\n        <span class=\"n\">cross_attn</span> <span class=\"o\">=</span> <span class=\"n\">_multi_head_attention</span><span class=\"p\">(</span>\n            <span class=\"n\">hidden</span><span class=\"p\">,</span> <span class=\"n\">context</span><span class=\"p\">,</span> <span class=\"n\">context</span><span class=\"p\">,</span>\n            <span class=\"n\">cross_q_weight</span><span class=\"p\">,</span> <span class=\"n\">cross_k_weight</span><span class=\"p\">,</span> <span class=\"n\">cross_v_weight</span><span class=\"p\">,</span> <span class=\"n\">cross_out_weight</span><span class=\"p\">,</span>\n            <span class=\"n\">q_bias</span><span class=\"o\">=</span><span class=\"n\">cross_q_bias</span><span class=\"p\">,</span> <span class=\"n\">k_bias</span><span class=\"o\">=</span><span class=\"n\">cross_k_bias</span><span class=\"p\">,</span> <span class=\"n\">v_bias</span><span class=\"o\">=</span><span class=\"n\">cross_v_bias</span><span class=\"p\">,</span>\n            <span class=\"n\">out_bias</span><span class=\"o\">=</span><span class=\"n\">cross_out_bias</span><span class=\"p\">,</span>\n            <span class=\"n\">mask</span><span class=\"o\">=</span><span class=\"n\">cross_mask</span><span class=\"p\">,</span> <span class=\"n\">num_heads</span><span class=\"o\">=</span><span class=\"n\">num_heads</span><span class=\"p\">,</span> <span class=\"n\">dropout_p</span><span class=\"o\">=</span><span class=\"n\">dropout_p</span><span class=\"p\">,</span>\n            <span class=\"n\">training</span><span class=\"o\">=</span><span class=\"n\">training</span><span class=\"p\">,</span> <span class=\"n\">seed</span><span class=\"o\">=</span><span class=\"n\">seed</span><span class=\"p\">,</span>\n        <span class=\"p\">)</span>\n        <span class=\"n\">attended</span> <span class=\"o\">=</span> <span class=\"n\">_block_layer_norm</span><span class=\"p\">(</span><span class=\"n\">hidden</span> <span class=\"o\">+</span> <span class=\"n\">cross_attn</span><span class=\"p\">,</span> <span class=\"n\">ln2_weight</span><span class=\"p\">,</span> <span class=\"n\">ln2_bias</span><span class=\"p\">,</span> <span class=\"s2\">\"ln2\"</span><span class=\"p\">)</span>\n        <span class=\"c1\"># Sub-block 3: the position-wise FFN, then the post-LN residual.</span>\n        <span class=\"n\">ffn</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">linear</span><span class=\"p\">(</span>\n            <span class=\"n\">_ffn_activation</span><span class=\"p\">(</span><span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">linear</span><span class=\"p\">(</span><span class=\"n\">attended</span><span class=\"p\">,</span> <span class=\"n\">ffn1_weight</span><span class=\"p\">,</span> <span class=\"n\">ffn1_bias</span><span class=\"p\">),</span> <span class=\"n\">ffn_activation</span><span class=\"p\">),</span>\n            <span class=\"n\">ffn2_weight</span><span class=\"p\">,</span>\n            <span class=\"n\">ffn2_bias</span><span class=\"p\">,</span>\n        <span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span>\n            <span class=\"n\">_block_layer_norm</span><span class=\"p\">(</span><span class=\"n\">attended</span> <span class=\"o\">+</span> <span class=\"n\">ffn</span><span class=\"p\">,</span> <span class=\"n\">ln3_weight</span><span class=\"p\">,</span> <span class=\"n\">ln3_bias</span><span class=\"p\">,</span> <span class=\"s2\">\"ln3\"</span><span class=\"p\">)</span>\n        <span class=\"p\">)</span>\n"}, "AttentionCausalMask": {"id": "AttentionCausalMask", "name": "Causal Mask", "cat": "Attention", "desc": "Lower-triangular boolean attention mask (True = attend): position i may see positions <= i, the decoder / language-model mask.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">AttentionCausalMask</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"The lower-triangular boolean mask a decoder-style attention needs.</span>\n\n<span class=\"sd\">    What: builds the ``(seq_len, seq_len)`` boolean mask where position ``i``</span>\n<span class=\"sd\">          may attend to positions ``&lt;= i`` (lower triangle, diagonal included).</span>\n<span class=\"sd\">          The convention is ``True`` = attend / ``False`` = blocked - the</span>\n<span class=\"sd\">          SDPA-boolean semantics every attention node of this family documents -</span>\n<span class=\"sd\">          so the mask plugs straight into any ``mask`` slot without inversion.</span>\n<span class=\"sd\">          A causal mask is what makes a language model autoregressive: during</span>\n<span class=\"sd\">          training each position predicts its next token without peeking ahead.</span>\n<span class=\"sd\">    In:   seq_len (INT) - the sequence length of both axes (default 8).</span>\n<span class=\"sd\">    Out:  mask (TENSOR) - boolean ``(seq_len, seq_len)``; broadcasts against</span>\n<span class=\"sd\">          ``(batch, heads, query_len, key_len)`` inside the attention nodes.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_mask_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"AttentionCausalMask\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Causal Mask\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Lower-triangular boolean attention mask (True = attend): position i may see positions &lt;= i, the decoder / language-model mask.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"seq_len\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">8</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"n\">_MAX_LEN</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Sequence length of both mask axes.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"mask\"</span><span class=\"p\">)],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"causal\"</span><span class=\"p\">,</span> <span class=\"s2\">\"mask\"</span><span class=\"p\">,</span> <span class=\"s2\">\"lookahead\"</span><span class=\"p\">,</span> <span class=\"s2\">\"triangle\"</span><span class=\"p\">,</span> <span class=\"s2\">\"autoregressive\"</span><span class=\"p\">,</span> <span class=\"s2\">\"transformer\"</span><span class=\"p\">,</span> <span class=\"s2\">\"decoder\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">seq_len</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">8</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">length</span> <span class=\"o\">=</span> <span class=\"nb\">max</span><span class=\"p\">(</span><span class=\"mi\">1</span><span class=\"p\">,</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">seq_len</span><span class=\"p\">))</span>\n        <span class=\"k\">if</span> <span class=\"n\">length</span> <span class=\"o\">&gt;</span> <span class=\"n\">_MAX_LEN</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span><span class=\"sa\">f</span><span class=\"s2\">\"seq_len must be &lt;= </span><span class=\"si\">{</span><span class=\"n\">_MAX_LEN</span><span class=\"si\">}</span><span class=\"s2\">; got </span><span class=\"si\">{</span><span class=\"n\">length</span><span class=\"si\">}</span><span class=\"s2\">.\"</span><span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span>\n            <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">ones</span><span class=\"p\">(</span><span class=\"n\">length</span><span class=\"p\">,</span> <span class=\"n\">length</span><span class=\"p\">,</span> <span class=\"n\">dtype</span><span class=\"o\">=</span><span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">bool</span><span class=\"p\">)</span><span class=\"o\">.</span><span class=\"n\">tril</span><span class=\"p\">()</span>\n        <span class=\"p\">)</span>\n"}, "AttentionPaddingMask": {"id": "AttentionPaddingMask", "name": "Padding Mask", "cat": "Attention", "desc": "Boolean attention mask from per-sample sequence lengths: True = valid token, False = padding tail; broadcasts over heads and queries.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">AttentionPaddingMask</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"A per-sample validity mask built from sequence lengths.</span>\n\n<span class=\"sd\">    What: turns a vector of effective lengths into the boolean mask that blocks</span>\n<span class=\"sd\">          the padded tail of every sequence: sample ``i`` may attend to key</span>\n<span class=\"sd\">          positions ``&lt; lengths[i]``. The output is shaped</span>\n<span class=\"sd\">          ``(batch, 1, 1, max_len)`` so it broadcasts over heads and query</span>\n<span class=\"sd\">          positions inside the attention nodes (every query of sample ``i``</span>\n<span class=\"sd\">          sees the same valid keys - the standard encoder padding mask).</span>\n<span class=\"sd\">    In:   lengths (TENSOR) - integer ``(batch,)``; the effective length of each</span>\n<span class=\"sd\">          sample. Floats are truncated, negatives clamped to 0.</span>\n<span class=\"sd\">          max_len (INT) - the key length to build against; ``0`` (default)</span>\n<span class=\"sd\">          reads it from ``lengths.max()`` so the mask exactly covers the data.</span>\n<span class=\"sd\">    Out:  mask (TENSOR) - boolean ``(batch, 1, 1, max_len)``; ``True`` = valid</span>\n<span class=\"sd\">          (attend), ``False`` = padding (blocked), the SDPA-boolean convention.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_mask_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"AttentionPaddingMask\"</span><span class=\"p\">,</span>\n n><span class=\"n\">unsqueeze</span><span class=\"p\">(</span><span class=\"mi\">1</span><span class=\"p\">))</span>  <span class=\"c1\"># (batch, 1, 1, max_len)</span>\n"}, "AttentionPositionalEncoding": {"id": "AttentionPositionalEncoding", "name": "Positional Encoding", "cat": "Attention", "desc": "Fixed sinusoidal position table (length, width), optionally added onto a wired sequence: order information without learnable parameters.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">AttentionPositionalEncoding</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"The fixed sinusoidal position encoding, with optional additive inject.</span>\n\n<span class=\"sd\">    What: the classic \"Attention Is All You Need\" position table -</span>\n<span class=\"sd\">          ``PE(pos, 2i) = sin(pos / 10000^(2i/width))`` and</span>\n<span class=\"sd\">          ``PE(pos, 2i+1) = cos(...)`` - as a parameter-free ``(length, width)``</span>\n<span class=\"sd\">          tensor. Two modes: wire a ``tensor`` in and ``output`` returns the</span>\n<span class=\"sd\">          sequence with the encoding added (the additive-inject recipe used by</span>\n<span class=\"sd\">          d2l's ``PositionalEncoding``); leave ``tensor`` unconnected and the</span>\n<span class=\"sd\">          widgets alone define the table, for graphs that add it themselves.</span>\n<span class=\"sd\">          There are no learnable parameters - inject order information, not</span>\n<span class=\"sd\">          weights.</span>\n<span class=\"sd\">    In:   tensor (TENSOR, optional) - ``(..., length, width)`` sequence to</span>\n<span class=\"sd\">          inject the encoding into; its last two dims override the widgets.</span>\n<span class=\"sd\">          length (INT) - number of positions when ``tensor`` is unconnected</spa ooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional (..., length, width) sequence; when wired, output = tensor + encoding and the widgets are read from its shape.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"length\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">8</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"n\">_MAX_LEN</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Number of positions when tensor is unconnected.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"width\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">32</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">16384</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span adding; weight and bias are wired in.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">ConvolutionConv</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Convolution over 1, 2 or 3 spatial dimensions, with parameter sharing.</span>\n\n<span class=\"sd\">    What: ``torch.nn.functional.conv{1,2,3}d`` - slides the kernel across the</span>\n<span class=\"sd\">          spatial dimensions and computes a dot product at every position. The</span>\n<span class=\"sd\">          **same** kernel is reused everywhere, which is what \"parameter sharing\"</span>\n<span class=\"sd\">          means: the number of weights depends on the channel counts and the</span>\n<span class=\"sd\">          kernel size, never on the image size, so a 3x3 kernel needs 9 weights</span>\n<span class=\"sd\">          per input/output channel whether the image is 32x32 or 1024x1024.</span>\n<span class=\"sd\">          ``dims`` selects the rank; ``groups`` and ``dilation`` turn it into a</span>\n<span class=\"sd\">          grouped / depthwise / dilated convolution; ``padding_mode`` chooses what</span>\n<span class=\"sd\">          lies outside the image.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - input feature map, usually ``(N, C_in, H, W)``. A bare</span>\n<span class=\"sd\">          ``(C_in, H, W)`` or ``(H, W)`` tensor is accepted as well: missing</span>\n<span class=\"sd\">          leading dimensions are added internally and removed from the result.</span>\n<span class=\"sd\">          weight (TENSOR) - the kernel, ``(out_channels, in_channels/groups,</span>\n<span class=\"sd\">          kH, kW)`` (``k`` repeated ``dims`` times). ``in_channels`` must equal</span>\n<span class=\"sd\">          ``weight.shape[1] * groups``.</span>\n<span class=\"sd\">          bias (TENSOR, optional) - ``(out_channels,)``; leave unconnected for no bias.</span>\n<span class=\"sd\">          dims (COMBO) - 1, 2 or 3 (default 2): selects Conv1d/Conv2d/Conv3d.</span>\n<span class=\"sd\">          groups (INT) - default 1; ``C_in`` gives a depthwise convolution,</span>\n<span class=\"sd\">          anything in between a grouped convolution.</span>\n<span class=\"sd\">          stride (INT) - kernel step, default 1 (same spatial size when padding</span>\n<span class=\"sd\">          matches the kernel); values &gt; 1 downsample.</span>\n<span class=\"sd\">          padding (INT) - implicit padding per side, default 1, which pairs with a</span>\n<span class=\"sd\">          3x3 kernel to keep the spatial size unchanged.</span>\n<span class=\"sd\">          padding_mode (COMBO) - ``zeros`` (default), ``reflect``, ``replicate`` or</span>\n<span class=\"sd\">          ``circular``. Implemented with an explicit ``F.pad`` call followed by a</span>\n<span class=\"sd\">          zero-padding-free convolution, because the functional API has no such</span>\n<span class=\"sd\">          argument.</span>\n<span class=\"sd\">          dilation (INT) - spacing between kernel elements, default 1; &gt; 1 widens</span>\n<span class=\"sd\">          the receptive field without adding weights.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same rank as the input, ``out_channels`` channels and</span>\n<span class=\"sd\">          spatial size ``floor((size + 2 * padding - dilation * (k - 1) - 1) / stride + 1)``.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_conv_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"ConvolutionConv\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Conv\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Convolution over 1/2/3 spatial dims with grouped/dilated kernels and zeros/reflect/replicate/circular padding; weight and bias are wired in.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"o\">*</span><span class=\"n\">_weight_slots</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"Kernel of shape (out_channels, in_channels/groups, kH, kW) \"</span>\n                    <span class=\"s2\">\"(k repeated 'dims' times).\"</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">_dims_widget</span><span class=\"p\">(),</span>\n                <span class=\"n\">_groups_widget</span><span class=\"p\">(),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"stride\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">64</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Kernel step; &gt; 1 downsamples the spatial size.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"padding\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">64</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Implicit padding per side; 1 with a 3x3 kernel keeps the spatial size.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Combo</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"padding_mode\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">options</span><span class=\"o\">=</span><span class=\"n\">_PADDING_MODES</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"zeros\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"What lies outside the image: zeros, reflect, replicate or circular.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><sp ss=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">dims</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">2</span><span class=\"p\">,</span>\n        <span class=\"n\">groups</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">1</span><span class=\"p\">,</span>\n        <span class=\"n\">stride</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">1</span><span class=\"p\">,</span>\n        <span class=\"n\">padding</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">1</span><span class=\"p\">,</span>\n        <span class=\"n\">padding_mode</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"s2\">\"zeros\"</span><span class=\"p\">,</span>\n        <span class=\"n\">dilation</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">1</span><span class=\"p\">,</span>\n    <span c n class=\"mi\">1</span><span class=\"p\">:</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">conv1d</span><span class=\"p\">,</span> <span class=\"mi\">2</span><span class=\"p\">:</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">conv2d</span><span class=\"p\">,</span> <span class=\"mi\">3</span><span class=\"p\">:</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">conv3d</span><span class=\"p\">}[</span><span class=\"n\">rank</span><span class=\"p\">]</span>\n        <span class=\"k\">try</span><span class=\"p\">:</span>\n            <span class=\"n\">result</span> <span class=\"o\">=</span> <span class=\"n\">convolution</span><span class=\"p\">(</span>\n                <span class=\"n\">padded</span><span class=\"p\">,</span> <span class=\"n\">weight</span><span class=\"p\">,</span> <span class=\"n\">bias</span><span class=\"p\">,</span> <span class=\"n\">stride</span><span class=\"o\">=</span><span class=\"n\">step</span><span class=\"p\">,</span> <span class=\"n\">padding</span><span class=\"o\">=</span><span class=\"n\">remaining</span><span class=\"p\">,</span>\n                <span class=\"n\">dilation</span><span class=\"o\">=</span><span class=\"n\">dil</span><span class=\"p\">,</span> <span class=\"n\">groups</span><span class=\"o\">=</span><span class=\"n\">group_count</span><span class=\"p\">,</span>\n            <span class=\"p\">)</span>\n        <span class=\"k\">except</span> <span class=\"ne\">RuntimeError</span> <span class=\"k\">as</span> <span class=\"n\">exc</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">RuntimeError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"Conv: </span><span class=\"si\">{</span><span class=\"n\">rank</span><span class=\"si\">}</span><span class=\"s2\">d convolution failed for an input of shape \"</span>\n                <span class=\"sa\">f</s  class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Transposed convolution over 1, 2 or 3 spatial dimensions (upsampling).</span>\n\n<span class=\"sd\">    What: ``torch.nn.functional.conv_transpose{1,2,3}d`` - the gradient of a</span>\n<span class=\"sd\">          convolution with respect to its input, commonly (and loosely) called</span>\n<span class=\"sd\">          \"deconvolution\". It grows the spatial size instead of shrinking it, so</span>\n<span class=\"sd\">          it is what decoder / generator networks use to go from a small feature</span>\n<span class=\"sd\">          map back to a bigger one, in place of a plain upsample followed by a</span>\n<span class=\"sd\">          convolution. The weight shape is **transposed** relative to ``Conv``:</span>\n<span class=\"sd\">          ``(in_channels, out_channels/groups, k...)``.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - input feature map, usually ``(N, C_in, H, W)``. A bare</span>\n<span class=\"sd\">          ``(C_in, H, W)`` or ``(H, W)`` tensor is accepted as well: missing</span>\n<span class=\"sd\">          leading dimensions are added internally and removed from the result.</span>\n<span class=\"sd\">          weight (TENSOR) - ``(in_channels, out_channels/groups, kH, kW)``</span>\n<span class=\"sd\">          (``k`` repeated ``dims`` times); note that the channel order is the</span>\n<span class=\"sd\">          opposite of ``Conv``. ``in_channels`` must equal ``weight.shape[0]``.</span>\n<span class=\"sd\">          bias (TENSOR, optional) - ``(out_channels,)``; leave unconnected for no bias.</span>\n<span class=\"sd\">          dims (COMBO) - 1, 2 or 3 (default 2): selects ConvTranspose1d/2d/3d.</span>\n<span class=\"sd\">          groups (INT) - default 1; ``C_in`` gives a depthwise transposed convolution.</span>\n<span class=\"sd\">          stride (INT) - output step, default 2 (doubles the spatial size).</span>\n<span class=\"sd\">          padding (INT) - how much padding the matching forward convolution would</span>\n<span class=\"sd\">          have used; default 0.</span>\n<span class=\"sd\">          output_padding (INT) - extra size added on one side of the output,</span>\n<span class=\"sd\">          default 0; needed only when ``stride &gt; 1`` to reach an exact target size.</span>\n<span class=\"sd\">          dilation (INT) - spacing between kernel elements, default 1.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same rank as the input, with spatial size</span>\n<span class=\"sd\">          ``(size - 1) * stride - 2 * padding + dilation * (k - 1) + output_padding + 1``.</span>\n<span class=\"sd\">    Note: there is no ``padding_mode`` widget here: neither</span>\n<span class=\"sd\">          ``nn.ConvTranspose*d`` nor ``F.conv_transpose*d`` supports one.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_conv_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"ConvolutionConvTranspose\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"ConvTranspose\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Transposed convolution (upsampling) over 1/2/3 spatial dims with stride/padding/output_padding/groups; weight and bias are wired in.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"o\">*</span><span class=\"n\">_weight_slots</span><span class=\"p\">(</span>\n                    <span cla =\"n\">weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">dims</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">2</span><span class=\"p\">,</span>\n        <span class=\"n\">groups</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">1</span><span class=\"p\">,</span>\n        <span class=\"n\">stride</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">2</span><span class=\"p\">,</span>\n        <span class=\"n\">padding</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">0</span><span class=\"p\">,</span>\n        <span class=\"n\">output_padding</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">0</span><span class=\"p\">,</span>\n        <span class=\"n\">dilation</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">1</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">rank</span> <span class=\"o\">=</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">dims</span><span class=\"p\">)</span> <span class=\"k\">if</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">dims</span> an> <span class=\"mi\">1</span><span class=\"p\">)</span>\n        <span class=\"n\">out_channels</span> <span class=\"o\">=</span> <span class=\"n\">_check_weight</span><span class=\"p\">(</span><span class=\"n\">prepared</span><span class=\"p\">,</span> <span class=\"n\">weight</span><span class=\"p\">,</span> <span class=\"n\">rank</span><span class=\"p\">,</span> <span class=\"n\">group_count</span><span class=\"p\">,</span> <span class=\"kc\">True</span><span class=\"p\">,</span> <span class=\"s2\">\"ConvTranspose\"</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">bias</span> <span class=\"ow\">is</span> <span class=\"ow\">not</span> <span class=\"kc\">None</span> <span class=\"ow\">and</span> <span class=\"n\">bias</span><span class=\"o\">.</span><span class=\"n\">numel</span><span class=\"p\">()</span> <span class=\"o\">!=</span> <span class=\"n\">out_channels</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">RuntimeError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"ConvTranspose: bias has </span><span class=\"si\">{</span><span class=\"n\">bias</span><span class=\"o\">.</span><span class=\"n\">numel</span><span class=\"p\">()</span><span class=\"si\">}</span><span class=\"s2\"> element(s) but the weight \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"produces </span><span class=\"si\">{</span><span class=\"n\">out_channels</span><span class=\"si\">}</span><span class=\"s2\"> channel(s).\"</span>\n            <span class=\"p\">)</span>\n\n        <span class=\"n\">convolution</span> <span class=\"o\">=</span> <span class=\"p\">{</span>\n            <span class=\"mi\">1</span><span class=\"p\">:</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">conv_transpose1d</span><span class=\"p\">,</span>\n            <span class=\"mi\">2</span><span class=\"p\">:</span> <span class= an>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Upsample a feature map with interpolation - no weights, no learning.</span>\n\n<span class=\"sd\">    What: ``torch.nn.functional.interpolate`` - every spatial position is</span>\n<span class=\"sd\">          enlarged ``scale_factor`` times by copying (``nearest``) or by</span>\n<span class=\"sd\">          fitting a straight line / plane / hyperplane through the neighbours</span>\n<span class=\"sd\">          (``linear`` / ``bilinear`` / ``bicubic`` / ``trilinear``). It is the</span>\n<span class=\"sd\">          parameter-free counterpart of ``ConvTranspose``: growing a feature</span>\n<span class=\"sd\">          map costs zero weights here, while a learned enlargement needs the</span>\n<span class=\"sd\">          transposed convolution. The mode must match ``dims`` - linear for</span>\n<span class=\"sd\">          1-D, bilinear / bicubic for 2-D, trilinear for 3-D, nearest for any</span>\n<span class=\"sd\">          rank - exactly the contract ``nn.Upsample`` imposes.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - input feature map, e.g. ``(N, C, H, W)`` for</span>\n<span class=\"sd\">          ``dims=2``. A bare ``(C, H, W)`` (or one more leading dim missing)</span>\n<span class=\"sd\">          is accepted as well: missing leading dimensions are added internally</span>\n<span class=\"sd\">          and removed from the result.</span>\n<span class=\"sd\">          dims (COMBO) - 1, 2 or 3 (default 2): the spatial rank.</span>\n<span class=\"sd\">          mode (COMBO) - ``nearest`` (default), ``linear``, ``bilinear``,</span>\n<span class=\"sd\">          ``bicubic`` or ``trilinear``; must be legal for ``dims``.</span>\n<span class=\"sd\">          scale_factor (FLOAT) - spatial multiplier per axis (default 2.0);</span>\n<span class=\"sd\">          the output size is ``floor(input_size * scale_factor)``.</span>\n<span class=\"sd\">          align_corners (BOOLEAN) - if ``True``, the corner pix

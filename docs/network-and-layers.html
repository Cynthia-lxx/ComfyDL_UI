lass=\"p\">,</span>\n        <span class=\"n\">dims</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">2</span><span class=\"p\">,</span>\n        <span class=\"n\">mode</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"s2\">\"nearest\"</span><span class=\"p\">,</span>\n        <span class=\"n\">scale_factor</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">2.0</span><span class=\"p\">,</span>\n        <span class=\"n\">align_corners</span><span class=\"p\">:</span> <span class=\"nb\">bool</span> <span class=\"o\">=</span> <span class=\"kc\">False</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">rank</span> <span class=\"o\">=</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">dims</span><span class=\"p\">)</span> <span class=\"k\">if</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">dims</span><span class=\"p\">)</span> <span class=\"ow\">in</span> <span class=\"p\">(</span><span class=\"mi\">1</span><span class=\"p\">,</span> <span class=\"mi\">2</span><span class=\"p\">,</span> <span class=\"mi\">3</span><span class=\"p\">)</span> <span class=\"k\">else</span> <span class=\"mi\">2</span>\n        <span class=\"k\">if</span> <span class=\"n\">rank</span> <span class=\"o\">!=</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">dims</span><span class=\"p\">):</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"sa\">f</span><span class=\"s2\">\"Upsample: dims=</span><span class=\"si\">{</span><span class=\"n\">dims</span><span class=\"si\">}</span><span class=\"s2\"> is not 1/2/3; using 2.\"</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">mode</span> <span class=\"ow\">not</span> <span class=\"ow\">in</span> <span class=\"n\">_INTERP_MODES</span><span class=\"p\">:</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"sa\">f</span><span class=\"s2\">\"Upsample: mode=</span><span class=\"si\">{</span><span class=\"n\">mode</span><span class=\"si\">!r}</span><span class=\"s2\"> is not one of </span><span class=\"si\">{</span><span class=\"n\">_INTERP_MODES</span><span class=\"si\">}</span><span class=\"s2\">; using 'nearest'.\"</span><span class=\"p\">)</span>\n            <span class=\"n\">mode</span> <span class=\"o\">=</span> <span class=\"s2\">\"nearest\"</span>\n        <span class=\"n\">legal</span> <span class=\"o\">=</span> <span class=\"n\">_MODES_PER_RANK</span><span class=\"p\">[</span><span class=\"n\">rank</span><span class=\"p\">]</span>\n        <span class=\"k\">if</span> <span class=\"n\">mode</span> <span class=\"ow\">not</span> <span class=\"ow\">in</span> <span class=\"n\">legal</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"Upsample: mode=</span><span class=\"si\">{</span><span class=\"n\">mode</span><span class=\"si\">!r}</span><span class=\"s2\"> cannot run at dims=</span><span class=\"si\">{</span><span class=\"n\">rank</span><span class=\"si\">}</span><span class=\"s2\">; the legal modes are \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"nb\">list</span><span class=\"p\">(</span><span class=\"n\">legal</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\"> (1D = nearest/linear, 2D = nearest/bilinear/bicubic, \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"3D = nearest/trili n><span class=\"w\"> </span><span class=\"o\">+</span><span class=\"w\"> </span><span class=\"mi\">2</span><span class=\"si\">}</span><span class=\"s2\">-dimensional tensor (N, C, spatial...), \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"but the input has </span><span class=\"si\">{</span><span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">()</span><span class=\"si\">}</span><span class=\"s2\"> dimension(s) with shape </span><span class=\"si\">{</span><span class=\"nb\">tuple</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\">.\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">mode</span> <span class=\"o\">!=</span> <span class=\"s2\">\"nearest\"</span> <span class=\"ow\">and</span> <span class=\"ow\">not</span> <span class=\"n\">prepared</span><span class=\"o\">.</span><span class=\"n\">is_floating_point</span><span class=\"p\">():</span>\n            <span class=\"n\">prepared</span> <span class=\"o\">=</span> <span class=\"n\">prepared</span><span class=\"o\">.</span><span class=\"n\">to</span><span class=\"p\">(</span><span class=\"n\">dtype</span><span class=\"o\">=</span><span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">float32</span><span class=\"p\">)</span>\n        <span class=\"k\">try</span><span class=\"p\">:</span>\n            <span class=\"n\">result</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">interpolate</span><span class=\"p\">(</span>\n                <span class=\"n\">prepared</span><span class=\"p\">,</span>\n                <span class=\"n\">scale_factor</span><span class=\"o\">=</span><span class=\"n\">scale</span><span class=\"p\">,</span>\n                <span class=\"n\">mode</span><span class=\"o\">=</span><span class=\"n\">mode</span><span class=\"p\">,</span>\n                <span class=\"n\">align_corners</span><span class=\"o\">=</span><span class=\"nb\">bool</span><span class=\"p\">(</span><span class=\"n\">align_corners</span><span class=\"p\">)</span> <span class=\"k\">if</span> <span class=\"n\">mode</span> <span class=\"o\">!=</span> <span class=\"s2\">\"nearest\"</span> <span class=\"k\">else</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n            <span class=\"p\">)</span>\n        <span class=\"k\">except</span> <span class=\"ne\">RuntimeError</span> <span class=\"k\">as</span> <span class=\"n\">exc</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">RuntimeError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"Upsample: </span><span class=\"si\">{</span><span class=\"n\">rank</span><span class=\"si\">}</span><span class=\"s2\">d interpolation with mode=</span><span class=\"si\">{</span><span class=\"n\">mode</span><span class=\"si\">!r}</span><span class=\"s2\"> failed for an input of \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"shape </span><span class=\"si\">{</span><span class=\"nb\">tuple</span><span class=\"p\">(</span><span class=\"n\">prepared</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\">. Check that 'dims' matches the tensor rank \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"and that the mode is legal for it. Original error: </span><span class=\"si\">{</span><span class=\"n\">exc</span><span class=\"si\">}</span><span class=\"s2\">\"</span>\n            <span class=\"p\">)</span> <span class=\"kn\">from</span><span class=\"w\"> </span><span class=\"nn\">exc</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">_drop_added_rank</span><span class=\"p\">(</span><span class=\"n\">result</span><span class=\"p\">,</span> <span class=\"n\">added</span><span class=\"p\">))</span>\n"}, "ConvolutionPixelShuffle": {"id": "ConvolutionPixelShuffle", "name": "Pixel Shuffle", "cat": "Convolution", "desc": "Reshuffle (N, C*r^2, H, W) into (N, C, H*r, W*r): channels become sub-pixels, the parameter-free half of sub-pixel convolution.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">ConvolutionPixelShuffle</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Trade channels for spatial resolution: the sub-pixel reshuffle.</span>\n\n<span class=\"sd\">    What: ``torch.nn.functional.pixel_shuffle`` - the cheap half of sub-pixel</span>\n<span class=\"sd\">          convolution (ESPCN): a conv first packs ``r * r`` sub-pixel images</span>\n<span class=\"sd\">          into the channel dimension, and this node then reshuffles</span>\n<span class=\"sd\">          ``(N, C * r^2, H, W)`` into ``(N, C, H * r, W * r)`` by moving each</span>\n<span class=\"sd\">          ``r x r`` block of channels out to its own spatial position. No</span>\n<span class=\"sd\">          multiplication happens at all - it is a pure view/permute of the</span>\n<span class=\"sd\">          data, which is why it is the standard way to upsample cheaply after</span>\n<span class=\"sd\">          a convolution. Inherently 2-D: ``F.pixel_shuffle`` only exists for</span>\n<span class=\"sd\">          images.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - ``(N, C * r^2, H, W)``; the channel count must be</span>\n<span class=\"sd\">          divisible by ``r^2``. A bare ``(C, r^2, ...)`` / ``(C, H, W)`` tensor</span>\n<span class=\"sd\">          is accepted as well: missing leading dimensions are added internally</span>\n<span class=\"sd\">          and removed from the result.</span>\n<span class=\"sd\">          r (INT) - the upscale factor per axis (default 2, i.e. ``r^2 = 4``</span>\n<span class=\"sd\">          channels per output pixel and a 2x2 spatial gain).</span>\n<span class=\"sd\">    Out:  output (TENSOR) - ``(N, C, H * r, W * r)``, same dtype as the input.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_conv_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"ConvolutionPixelShuffle\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Pixel Shuffle\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Reshuffle (N, C*r^2, H, W) into (N, C, H*r, W*r): channels become sub-pixels, the parameter-free half of sub-pixel convolution.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Input of shape (N, C*r^2, H, W); the channel count must be divisible by r^2.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"r\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">2</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">64</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Upscale factor per spatial axis; channels shrink by r^2, spatial size grows by r.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"pixel shuffle\"</span><span class=\"p\">,</span> <span class=\"s2\">\"pixelshuffle\"</span><span class=\"p\">,</span> <span class=\"s2\">\"sub pixel\"</span><span class=\"p\">,</span> <span class=\"s2\">\"sub-pixel convolution\"</span><span class=\"p\">,</span> <span class=\"s2\">\"espcn\"</span><span class=\"p\">,</span> <span class=\"s2\">\"upsample\"</span><span class=\"p\">,</span> <span class=\"s2\">\"reshuffle\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span> <span class=\"n\">r</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">2</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">factor</span> <span class=\"o\">=</span> <span class=\"nb\">max</span><span class=\"p\">(</span><span class=\"mi\">1</span><span class=\"p\">,</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">r</span><span class=\"p\">))</span>\n        <span class=\"n\">prepared</span><span class=\"p\">,</span> <span class=\"n\">added</span> <span class=\"o\">=</span> <span class=\"n\">_ensure_min_rank</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"mi\">4</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">prepared</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">()</span> <span class=\"o\">!=</span> <span class=\"mi\">4</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"Pixel Shuffle: F.pixel_shuffle needs a 4-dimensional (N, C*r^2, H, W) \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"tensor, but the input has </span><span class=\"si\">{</span><span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">()</span><span class=\"si\">}</span><span class=\"s2\"> dimension(s) with shape \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"nb\">tuple</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\">; it is an inherently 2-D operation.\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"n\">channels</span> <span class=\"o\">=</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">prepared</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">[</span><span class=\"mi\">1</span><span class=\"p\">])</span>\n        <span class=\"k\">if</span> <span class=\"n\">channels</span> <span class=\"o\">%</span> <span class=\"p\">(</span><span class=\"n\">factor</span> <span class=\"o\">*</span> <span class=\"n\">factor</span><span class=\"p\">)</span> <span class=\"o\">!=</span> <span class=\"mi\">0</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"Pixel Shuffle: the input has </span><span class=\"si\">{</span><span class=\"n\">channels</span><span class=\"si\">}</span><span class=\"s2\"> channel(s), which must be divisible \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"by r^2 = </span><span class=\"si\">{</span><span class=\"n\">factor</span><span class=\"w\"> </span><span class=\"o\">*</span><span class=\"w\"> </span><span class=\"n\">factor</span><span class=\"si\">}</span><span class=\"s2\"> (r=</span><span class=\"si\">{</span><span class=\"n\">factor</span><span class=\"si\">}</span><span class=\"s2\">); a conv should first pack r*r \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"sub-pixels into the channels.\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"k\">try</span><span class=\"p\">:</span>\n            <span class=\"n\">result</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">pixel_shuffle</span><span class=\"p\">(</span><span class=\"n\">prepared</span><span class=\"p\">,</span> <span class=\"n\">factor</span><span class=\"p\">)</span>\n        <span class=\"k\">except</span> <span class=\"ne\">RuntimeError</span> <span class=\"k\">as</span> <span class=\"n\">exc</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">RuntimeError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"Pixel Shuffle: F.pixel_shuffle failed for an input of shape \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"nb\">tuple</span><span class=\"p\">(</span><span class=\"n\">prepared</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\"> with r=</span><span class=\"si\">{</span><span class=\"n\">factor</span><span class=\"si\">}</span><span class=\"s2\">. Original error: </span><span class=\"si\">{</span><span class=\"n\">exc</span><span class=\"si\">}</span><span class=\"s2\">\"</span>\n            <span class=\"p\">)</span> <span class=\"kn\">from</span><span class=\"w\"> </span><span class=\"nn\">exc</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">_drop_added_rank</span><span class=\"p\">(</span><span class=\"n\">result</span><span class=\"p\">,</span> <span class=\"n\">added</span><span class=\"p\">))</span>\n"}, "ConvolutionPixelUnshuffle": {"id": "ConvolutionPixelUnshuffle", "name": "Pixel Unshuffle", "cat": "Convolution", "desc": "Reshuffle (N, C, H*r, W*r) into (N, C*r^2, H, W): the exact inverse of Pixel Shuffle.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">ConvolutionPixelUnshuffle</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"The inverse of Pixel Shuffle: spatial resolution back into channels.</span>\n\n<span class=\"sd\">    What: ``torch.nn.functional.pixel_unshuffle`` - the exact inverse of</span>\n<span class=\"sd\">          ``Pixel Shuffle``: ``(N, C, H * r, W * r)`` becomes</span>\n<span class=\"sd\">          ``(N, C * r^2, H, W)`` by folding every ``r x r`` spatial block back</span>\n<span class=\"sd\">          into the channel dimension. Wiring ``Pixel Shuffle \u2192 Pixel</span>\n<span class=\"sd\">          Unshuffle`` with the same ``r`` is a lossless round trip (the smoke</span>\n<span class=\"sd\">          tester pins this), and the pair is how an encoder undoes what its</span>\n<span class=\"sd\">          decoder did - or how two networks exchange data at two spatial</span>\n<span class=\"sd\">          scales without any interpolation.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - ``(N, C, H, W)``; the spatial sizes must be</span>\n<span class=\"sd\">          divisible by ``r``. Unbatched ``(C, H, W)`` inputs work too: missing</span>\n<span class=\"sd\">          leading dimensions are added internally and removed from the result.</span>\n<span class=\"sd\">          r (INT) - the downscale factor per axis (default 2, i.e. spatial size</span>\n<span class=\"sd\">          halves and channels grow by ``r^2 = 4``).</span>\n<span class=\"sd\">    Out:  output (TENSOR) - ``(N, C * r^2, H / r, W / r)``, same dtype as the</span>\n<span class=\"sd\">          input.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_conv_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"ConvolutionPixelUnshuffle\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Pixel Unshuffle\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Reshuffle (N, C, H*r, W*r) into (N, C*r^2, H, W): the exact inverse of Pixel Shuffle.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Input of shape (N, C, H, W); the spatial sizes must be divisible by r.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"r\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">2</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">64</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Downscale factor per spatial axis; spatial size shrinks by r, channels grow by r^2.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"pixel unshuffle\"</span><span class=\"p\">,</span> <span class=\"s2\">\"pixelunshuffle\"</span><span class=\"p\">,</span> <span class=\"s2\">\"unshuffle\"</span><span class=\"p\">,</span> <span class=\"s2\">\"sub pixel\"</span><span class=\"p\">,</span> <span class=\"s2\">\"downscale\"</span><span class=\"p\">,</span> <span class=\"s2\">\"space to depth\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span> <span class=\"n\">r</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">2</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">factor</span> <span class=\"o\">=</span> <span class=\"nb\">max</span><span class=\"p\">(</span><span class=\"mi\">1</span><span class=\"p\">,</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">r</span><span class=\"p\">))</span>\n        <span class=\"n\">prepared</span><span class=\"p\">,</span> <span class=\"n\">added</span> <span class=\"o\">=</span> <span class=\"n\">_ensure_min_rank</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"mi\">4</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">prepared</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">()</span> <span class=\"o\">!=</span> <span class=\"mi\">4</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"Pixel Unshuffle: F.pixel_unshuffle needs a 4-dimensional (N, C, H, W) \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"tensor, but the input has </span><span class=\"si\">{</span><span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">()</span><span class=\"si\">}</span><span class=\"s2\"> dimension(s) with shape \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"nb\">tuple</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\">; it is an inherently 2-D operation.\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"n\">spatial</span> <span class=\"o\">=</span> <span class=\"nb\">tuple</span><span class=\"p\">(</span><span class=\"n\">prepared</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">[</span><span class=\"mi\">2</span><span class=\"p\">:])</span>\n        <span class=\"k\">if</span> <span class=\"nb\">any</span><span class=\"p\">(</span><span class=\"n\">size</span> <span class=\"o\">%</span> <span class=\"n\">factor</span> <span class=\"o\">!=</span> <span class=\"mi\">0</span> <span class=\"k\">for</span> <span class=\"n\">size</span> <span class=\"ow\">in</span> <span class=\"n\">spatial</span><span class=\"p\">):</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"Pixel Unshuffle: the spatial sizes </span><span class=\"si\">{</span><span class=\"n\">spatial</span><span class=\"si\">}</span><span class=\"s2\"> must all be divisible by \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"r=</span><span class=\"si\">{</span><span class=\"n\">factor</span><span class=\"si\">}</span><span class=\"s2\">; the node folds every </span><span class=\"si\">{</span><span class=\"n\">factor</span><span class=\"si\">}</span><span class=\"s2\">x</span><span class=\"si\">{</span><span class=\"n\">factor</span><span class=\"si\">}</span><span class=\"s2\"> spatial block back \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"into the channels.\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"k\">try</span><span class=\"p\">:</span>\n            <span class=\"n\">result</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">pixel_unshuffle</span><span class=\"p\">(</span><span class=\"n\">prepared</span><span class=\"p\">,</span> <span class=\"n\">factor</span><span class=\"p\">)</span>\n        <span class=\"k\">except</span> <span class=\"ne\">RuntimeError</span> <span class=\"k\">as</span> <span class=\"n\">exc</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">RuntimeError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"Pixel Unshuffle: F.pixel_unshuffle failed for an input of shape \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"nb\">tuple</span><span class=\"p\">(</span><span class=\"n\">prepared</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\"> with r=</span><span class=\"si\">{</span><span class=\"n\">factor</span><span class=\"si\">}</span><span class=\"s2\">. Original error: </span><span class=\"si\">{</span><span class=\"n\">exc</span><span class=\"si\">}</span><span class=\"s2\">\"</span>\n            <span class=\"p\">)</span> <span class=\"kn\">from</span><span class=\"w\"> </span><span class=\"nn\">exc</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">_drop_added_rank</span><span class=\"p\">(</span><span class=\"n\">result</span><span class=\"p\">,</span> <span class=\"n\">added</span><span class=\"p\">))</span>\n"}, "BasicLinear": {"id": "BasicLinear", "name": "Linear", "cat": "Basic", "desc": "Fully-connected layer: tensor @ weight.T (+ bias); weight/bias are wired in as tensors.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">BasicLinear</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Fully-connected (dense) layer: ``output = tensor @ weight.T + bias``.</span>\n\n<span class=\"sd\">    What: applies an affine transform along the last dimension, i.e.</span>\n<span class=\"sd\">          ``torch.nn.Linear`` in functional form. The parameters are not stored</span>\n<span class=\"sd\">          inside the node - ``weight`` and the optional ``bias`` are wired in as</span>\n<span class=\"sd\">          tensors, so the same node can run any checkpoint. A ``Linear`` followed</span>\n<span class=\"sd\">          by an activation node is the textbook \"Dense\" layer.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - input activations of shape ``(..., in_features)``.</span>\n<span class=\"sd\">          weight (TENSOR) - ``(out_features, in_features)``; the last dimension</span>\n<span class=\"sd\">          must match ``tensor``'s last dimension.</span>\n<span class=\"sd\">          bias   (TENSOR, optional) - ``(out_features,)`` (or anything broadcast</span>\n<span class=\"sd\">          compatible with the result); leave unconnected for a bias-free layer.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - ``(..., out_features)``. When ``tensor`` and</span>\n<span class=\"sd\">          ``weight`` are both floating point but of different dtypes they are</span>\n<span class=\"sd\">          promoted to their common dtype first (e.g. fp16 activations with fp32</span>\n<span class=\"sd\">          weights run in fp32) instead of raising a dtype mismatch error.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_basic_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"BasicLinear\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Linear\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Fully-connected layer: tensor @ weight.T (+ bias); weight/bias are wired in as tensors.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Input activations, shape (..., in_features).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"weight\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Weight matrix of shape (out_features, in_features).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"bias\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional bias of shape (out_features,); leave unconnected for no bias.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"dense\"</span><span class=\"p\">,</span> <span class=\"s2\">\"fully connected\"</span><span class=\"p\">,</span> <span class=\"s2\">\"fc\"</span><span class=\"p\">,</span> <span class=\"s2\">\"affine\"</span><span class=\"p\">,</span> <span class=\"s2\">\"projection\"</span><span class=\"p\">,</span> <span class=\"s2\">\"matmul\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">if</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">dtype</span> <span class=\"o\">!=</span> <span class=\"n\">weight</span><span class=\"o\">.</span><span class=\"n\">dtype</span> <span class=\"ow\">and</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">is_floating_point</span><span class=\"p\">()</span> <span class=\"ow\">and</span> <span class=\"n\">weight</span><span class=\"o\">.</span><span class=\"n\">is_floating_point</span><span class=\"p\">():</span>\n            <span class=\"n\">dtype</span> <span class=\"o\">=</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">promote_types</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">dtype</span><span class=\"p\">,</span> <span class=\"n\">weight</span><span class=\"o\">.</span><span class=\"n\">dtype</span><span class=\"p\">)</span>\n            <span class=\"n\">tensor</span> <span class=\"o\">=</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">to</span><span class=\"p\">(</span><span class=\"n\">dtype</span><span class=\"o\">=</span><span class=\"n\">dtype</span><span class=\"p\">)</span>\n            <span class=\"n\">weight</span> <span class=\"o\">=</span> <span class=\"n\">weight</span><span class=\"o\">.</span><span class=\"n\">to</span><span class=\"p\">(</span><span class=\"n\">dtype</span><span class=\"o\">=</span><span class=\"n\">dtype</span><span class=\"p\">)</span>\n            <span class=\"k\">if</span> <span class=\"n\">bias</span> <span class=\"ow\">is</span> <span class=\"ow\">not</span> <span class=\"kc\">None</span><span class=\"p\">:</span>\n                <span class=\"n\">bias</span> <span class=\"o\">=</span> <span class=\"n\">bias</span><span class=\"o\">.</span><span class=\"n\">to</span><span class=\"p\">(</span><span class=\"n\">dtype</span><span class=\"o\">=</span><span class=\"n\">dtype</span><span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">linear</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">weight</span><span class=\"p\">,</span> <span class=\"n\">bias</span><span class=\"p\">))</span>\n"}, "BasicEmbedding": {"id": "BasicEmbedding", "name": "Embedding", "cat": "Basic", "desc": "Lookup table: gathers rows of weight by integer index; the table is wired in as a tensor.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">BasicEmbedding</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Embedding lookup table: gathers rows of ``weight`` by index.</span>\n\n<span class=\"sd\">    What: ``torch.nn.Embedding`` in functional form - a pure table lookup with no</span>\n<span class=\"sd\">          learnable state inside the node. Useful to turn token ids (or any</span>\n<span class=\"sd\">          integer feature ids) into dense vectors.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - index tensor of any shape; cast to ``int64``</span>\n<span class=\"sd\">          internally, so float tensors carrying integral values are accepted.</span>\n<span class=\"sd\">          weight (TENSOR) - the table, ``(num_embeddings, embedding_dim)``.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - ``tensor.shape + (embedding_dim,)``, with the dtype</span>\n<span class=\"sd\">          and device of ``weight``. Indices outside ``[0, num_embeddings)`` raise</span>\n<span class=\"sd\">          a normal torch error, because that always means the table is wrong.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_basic_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"BasicEmbedding\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Embedding\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Lookup table: gathers rows of weight by integer index; the table is wired in as a tensor.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Integer index tensor of any shape (cast to int64 internally).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"weight\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Lookup table of shape (num_embeddings, embedding_dim).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"lookup\"</span><span class=\"p\">,</span> <span class=\"s2\">\"table\"</span><span class=\"p\">,</span> <span class=\"s2\">\"word embedding\"</span><span class=\"p\">,</span> <span class=\"s2\">\"gather\"</span><span class=\"p\">,</span> <span class=\"s2\">\"token\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span> <span class=\"n\">weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">indices</span> <span class=\"o\">=</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">long</span><span class=\"p\">()</span> <span class=\"k\">if</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">dtype</span> <span class=\"o\">!=</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">long</span> <span class=\"k\">else</span> <span class=\"n\">tensor</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">embedding</span><span class=\"p\">(</span><span class=\"n\">indices</span><span class=\"p\">,</span> <span class=\"n\">weight</span><span class=\"p\">))</span>\n"}, "BasicFlatten": {"id": "BasicFlatten", "name": "Flatten", "cat": "Basic", "desc": "Flatten dimensions start_dim..end_dim into one; defaults flatten (N, C, H, W) to (N, C*H*W).", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">BasicFlatten</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Flattens a contiguous range of dimensions into a single dimension.</span>\n\n<span class=\"sd\">    What: ``torch.flatten`` over ``start_dim``..``end_dim``. The defaults</span>\n<span class=\"sd\">          (``start_dim=1``, ``end_dim=-1``) turn a batched tensor such as</span>\n<span class=\"sd\">          ``(N, C, H, W)`` into ``(N, C*H*W)``, which is what a following</span>\n<span class=\"sd\">          ``Linear`` layer expects. Like ``torch.flatten`` this returns a view</span>\n<span class=\"sd\">          whenever the memory layout allows it.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - tensor with at least 1 dimension; dtype/device kept.</span>\n<span class=\"sd\">          start_dim (INT) - first dimension to flatten (0..4).</span>\n<span class=\"sd\">          end_dim   (INT) - last dimension to flatten (-4..4); if it resolves to</span>\n<span class=\"sd\">                            a dimension before ``start_dim`` the two are swapped.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same number of elements, rank reduced to</span>\n<span class=\"sd\">          ``rank - (end_dim - start_dim)``. A 0-dim input is returned unchanged.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_basic_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"BasicFlatten\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Flatten\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Flatten dimensions start_dim..end_dim into one; defaults flatten (N, C, H, W) to (N, C*H*W).\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Tensor to flatten.\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"start_dim\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">4</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"First dimension to flatten (0 keeps the batch dimension).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"end_dim\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=-</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=-</span><span class=\"mi\">4</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">4</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Last dimension to flatten (-1 = last dimension).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"collapse\"</span><span class=\"p\">,</span> <span class=\"s2\">\"flatten dims\"</span><span class=\"p\">,</span> <span class=\"s2\">\"view\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">start_dim</span><span class=\"p\">:</span> <span class=\"nb\">int</span><span class=\"p\">,</span>\n        <span class=\"n\">end_dim</span><span class=\"p\">:</span> <span class=\"nb\">int</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">rank</span> <span class=\"o\">=</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">()</span>\n        <span class=\"k\">if</span> <span class=\"n\">rank</span> <span class=\"o\">==</span> <span class=\"mi\">0</span><span class=\"p\">:</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"s2\">\"Flatten received a 0-dim tensor; passing it through unchanged.\"</span><span class=\"p\">)</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">)</span>\n        <span class=\"n\">start</span> <span class=\"o\">=</span> <span class=\"n\">start_dim</span> <span class=\"k\">if</span> <span class=\"n\">start_dim</span> <span class=\"o\">&gt;=</span> <span class=\"mi\">0</span> <span class=\"k\">else</span> <span class=\"n\">start_dim</span> <span class=\"o\">+</span> <span class=\"n\">rank</span>\n        <span class=\"n\">end</span> <span class=\"o\">=</span> <span class=\"n\">end_dim</span> <span class=\"k\">if</span> <span class=\"n\">end_dim</span> <span class=\"o\">&gt;=</span> <span class=\"mi\">0</span> <span class=\"k\">else</span> <span class=\"n\">end_dim</span> <span class=\"o\">+</span> <span class=\"n\">rank</span>\n        <span class=\"n\">start</span> <span class=\"o\">=</span> <span class=\"nb\">max</span><span class=\"p\">(</span><span class=\"mi\">0</span><span class=\"p\">,</span> <span class=\"nb\">min</span><span class=\"p\">(</span><span class=\"n\">rank</span> <span class=\"o\">-</span> <span class=\"mi\">1</span><span class=\"p\">,</span> <span class=\"n\">start</span><span class=\"p\">))</span>\n        <span class=\"n\">end</span> <span class=\"o\">=</span> <span class=\"nb\">max</span><span class=\"p\">(</span><span class=\"mi\">0</span><span class=\"p\">,</span> <span class=\"nb\">min</span><span class=\"p\">(</span><span class=\"n\">rank</span> <span class=\"o\">-</span> <span class=\"mi\">1</span><span class=\"p\">,</span> <span class=\"n\">end</span><span class=\"p\">))</span>\n        <span class=\"k\">if</span> <span class=\"n\">start</span> <span class=\"o\">&gt;</span> <span class=\"n\">end</span><span class=\"p\">:</span>\n            <span class=\"n\">start</span><span class=\"p\">,</span> <span class=\"n\">end</span> <span class=\"o\">=</span> <span class=\"n\">end</span><span class=\"p\">,</span> <span class=\"n\">start</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">flatten</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">start_dim</span><span class=\"o\">=</span><span class=\"n\">start</span><span class=\"p\">,</span> <span class=\"n\">end_dim</span><span class=\"o\">=</span><span class=\"n\">end</span><span class=\"p\">))</span>\n"}, "BasicReshape": {"id": "BasicReshape", "name": "Reshape", "cat": "Basic", "desc": "Reshape to a comma separated shape string, e.g. \"1,-1\"; -1 infers one dimension.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">BasicReshape</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Reshapes a tensor to an explicit target shape.</span>\n\n<span class=\"sd\">    What: ``torch.reshape`` driven by a shape string. One dimension may be</span>\n<span class=\"sd\">          ``-1``, meaning \"infer this one from the element count\". This is the</span>\n<span class=\"sd\">          core-node counterpart of the teaching node ``CdlReshape`` in the</span>\n<span class=\"sd\">          ``d2l`` group; both stay available.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - tensor to reshape; dtype/device kept.</span>\n<span class=\"sd\">          target_shape (STRING) - comma separated sizes, e.g. ``\"1,-1\"`` (the</span>\n<span class=\"sd\">          default collapses any tensor into a single row) or ``\"2,3,-1\"``.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - the reshaped tensor (a view when possible). If the</span>\n<span class=\"sd\">          string cannot be parsed, or the shape is incompatible with the element</span>\n<span class=\"sd\">          count, the original tensor is returned unchanged with a printed</span>\n<span class=\"sd\">          warning, so a workflow is never broken by a typo.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_basic_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"BasicReshape\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Reshape\"</span><span class=\"p\">,</span>\n            <span class=\"s1\">'Reshape to a comma separated shape string, e.g. \"1,-1\"; -1 infers one dimension.'</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Tensor to reshape.\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"target_shape\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"1,-1\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">placeholder</span><span class=\"o\">=</span><span class=\"s2\">\"e.g. 2,3,-1\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s1\">'Comma separated target sizes; \"-1\" infers one dimension.'</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"view\"</span><span class=\"p\">,</span> <span class=\"s2\">\"shape\"</span><span class=\"p\">,</span> <span class=\"s2\">\"squeeze\"</span><span class=\"p\">,</span> <span class=\"s2\">\"unsqueeze\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span> <span class=\"n\">target_shape</span><span class=\"p\">:</span> <span class=\"nb\">str</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">shape</span> <span class=\"o\">=</span> <span class=\"n\">_parse_shape</span><span class=\"p\">(</span><span class=\"n\">target_shape</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">shape</span> <span class=\"ow\">is</span> <span class=\"kc\">None</span><span class=\"p\">:</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"sa\">f</span><span class=\"s2\">\"Reshape could not parse target_shape=</span><span class=\"si\">{</span><span class=\"n\">target_shape</span><span class=\"si\">!r}</span><span class=\"s2\">; returning the input unchanged.\"</span><span class=\"p\">)</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">)</span>\n        <span class=\"k\">try</span><span class=\"p\">:</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">reshape</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">shape</span><span class=\"p\">))</span>\n        <span class=\"k\">except</span> <span class=\"ne\">RuntimeError</span> <span class=\"k\">as</span> <span class=\"n\">exc</span><span class=\"p\">:</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"sa\">f</span><span class=\"s2\">\"Reshape to </span><span class=\"si\">{</span><span class=\"n\">shape</span><span class=\"si\">}</span><span class=\"s2\"> failed (</span><span class=\"si\">{</span><span class=\"n\">exc</span><span class=\"si\">}</span><span class=\"s2\">); returning the input unchanged.\"</span><span class=\"p\">)</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">)</span>\n"}, "BasicBroadcast": {"id": "BasicBroadcast", "name": "Broadcast", "cat": "Basic", "desc": "Broadcast (view) a tensor to a comma separated shape string, e.g. \"2,3\".", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">BasicBroadcast</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Broadcasts a tensor to an explicit target shape.</span>\n\n<span class=\"sd\">    What: ``torch.broadcast_to`` driven by a shape string, i.e. the read-only</span>\n<span class=\"sd\">          \"expand to\" operation. Every target dimension must either match the</span>\n<span class=\"sd\">          input dimension or extend an input dimension of size 1. Because the</span>\n<span class=\"sd\">          result is a view, no data is copied. This is the core-node counterpart</span>\n<span class=\"sd\">          of the teaching node ``CdlBroadcast`` in the ``d2l`` group.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - tensor to broadcast; dtype/device kept.</span>\n<span class=\"sd\">          target_shape (STRING) - comma separated, non-negative sizes, e.g.</span>\n<span class=\"sd\">          ``\"2,3\"`` (the default) or ``\"3,1,4\"``.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - a broadcast view with the requested shape. If the</span>\n<span class=\"sd\">          string cannot be parsed, or the input is not broadcast compatible, the</span>\n<span class=\"sd\">          original tensor is returned unchanged with a printed warning, so a</span>\n<span class=\"sd\">          workflow is never broken by a typo. Note that ``-1`` is not allowed</span>\n<span class=\"sd\">          here, since nothing can be inferred from a target-only shape.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_basic_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"BasicBroadcast\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Broadcast\"</span><span class=\"p\">,</span>\n            <span class=\"s1\">'Broadcast (view) a tensor to a comma separated shape string, e.g. \"2,3\".'</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Tensor to broadcast.\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"target_shape\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"2,3\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">placeholder</span><span class=\"o\">=</span><span class=\"s2\">\"e.g. 3,1,4\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Comma separated, non-negative target sizes (no -1).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"expand\"</span><span class=\"p\">,</span> <span class=\"s2\">\"broadcast to\"</span><span class=\"p\">,</span> <span class=\"s2\">\"repeat\"</span><span class=\"p\">,</span> <span class=\"s2\">\"tile\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span> <span class=\"n\">target_shape</span><span class=\"p\">:</span> <span class=\"nb\">str</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">shape</span> <span class=\"o\">=</span> <span class=\"n\">_parse_shape</span><span class=\"p\">(</span><span class=\"n\">target_shape</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">shape</span> <span class=\"ow\">is</span> <span class=\"kc\">None</span><span class=\"p\">:</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"sa\">f</span><span class=\"s2\">\"Broadcast could not parse target_shape=</span><span class=\"si\">{</span><span class=\"n\">target_shape</span><span class=\"si\">!r}</span><span class=\"s2\">; returning the input unchanged.\"</span><span class=\"p\">)</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">)</span>\n        <span class=\"k\">try</span><span class=\"p\">:</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">broadcast_to</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">shape</span><span class=\"p\">))</span>\n        <span class=\"k\">except</span> <span class=\"ne\">RuntimeError</span> <span class=\"k\">as</span> <span class=\"n\">exc</span><span class=\"p\">:</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"sa\">f</span><span class=\"s2\">\"Broadcast to </span><span class=\"si\">{</span><span class=\"n\">shape</span><span class=\"si\">}</span><span class=\"s2\"> failed (</span><span class=\"si\">{</span><span class=\"n\">exc</span><span class=\"si\">}</span><span class=\"s2\">); returning the input unchanged.\"</span><span class=\"p\">)</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">)</span>\n"}, "BasicConcat": {"id": "BasicConcat", "name": "Concat", "cat": "Basic", "desc": "Concatenate two tensors along one dimension (torch.cat).", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">BasicConcat</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Concatenates two tensors along one dimension.</span>\n\n<span class=\"sd\">    What: ``torch.cat`` of exactly two tensors - the building block for merging</span>\n<span class=\"sd\">          branches (multi-input feature fusion, encoder/decoder skips that widen</span>\n<span class=\"sd\">          instead of summing, ...). Longer chains are built by stacking nodes.</span>\n<span class=\"sd\">    In:   a, b (TENSOR) - tensors of the same rank that agree in every dimension</span>\n<span class=\"sd\">          except the concatenation one; dtype and device must match.</span>\n<span class=\"sd\">          dim (INT) - dimension to concatenate along, clamped into</span>\n<span class=\"sd\">          ``[-rank, rank - 1]`` so an out-of-range widget value never crashes.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same rank, with dimension ``dim`` equal to the sum of</span>\n<span class=\"sd\">          both inputs. A shape mismatch is a wiring error and is reported by</span>\n<span class=\"sd\">          torch, not silently swallowed.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_basic_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"BasicConcat\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Concat\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Concatenate two tensors along one dimension (torch.cat).\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"a\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"First tensor.\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"b\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Second tensor; same rank/dtype/device as a.\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"dim\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=-</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=-</span><span class=\"mi\">4</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">4</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Dimension to concatenate along (clamped to the tensor rank).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"concatenate\"</span><span class=\"p\">,</span> <span class=\"s2\">\"cat\"</span><span class=\"p\">,</span> <span class=\"s2\">\"merge\"</span><span class=\"p\">,</span> <span class=\"s2\">\"join\"</span><span class=\"p\">,</span> <span class=\"s2\">\"fusion\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">a</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span> <span class=\"n\">b</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span> <span class=\"n\">dim</span><span class=\"p\">:</span> <span class=\"nb\">int</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">rank</span> <span class=\"o\">=</span> <span class=\"nb\">max</span><span class=\"p\">(</span><span class=\"n\">a</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">(),</span> <span class=\"n\">b</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">())</span>\n        <span class=\"k\">if</span> <span class=\"n\">rank</span> <span class=\"o\">==</span> <span class=\"mi\">0</span><span class=\"p\">:</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"s2\">\"Concat received 0-dim tensors; returning the first input unchanged.\"</span><span class=\"p\">)</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">a</span><span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">cat</span><span class=\"p\">((</span><span class=\"n\">a</span><span class=\"p\">,</span> <span class=\"n\">b</span><span class=\"p\">),</span> <span class=\"n\">dim</span><span class=\"o\">=</span><span class=\"n\">_clamp_dim</span><span class=\"p\">(</span><span class=\"n\">dim</span><span class=\"p\">,</span> <span class=\"n\">rank</span><span class=\"p\">)))</span>\n"}, "BasicAdd": {"id": "BasicAdd", "name": "Add", "cat": "Basic", "desc": "Element-wise addition of two tensors (broadcasting); use it for residual / skip connections.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">BasicAdd</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Element-wise addition of two tensors, with broadcasting.</span>\n\n<span class=\"sd\">    What: ``a + b``. This single node covers the classic \"residual\" and \"skip</span>\n<span class=\"sd\">          connection\" patterns (``output = input + branch(input)``): run the</span>\n<span class=\"sd\">          branch, then add it back to the untouched input here.</span>\n<span class=\"sd\">    In:   a, b (TENSOR) - tensors of the same shape, or shapes that broadcast</span>\n<span class=\"sd\">          against each other (e.g. ``(N, C, H, W) + (N, C, 1, 1)``). The mix of</span>\n<span class=\"sd\">          dtypes follows normal torch type promotion.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - the broadcast shape of both inputs.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_basic_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"BasicAdd\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Add\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Element-wise addition of two tensors (broadcasting); use it for residual / skip connections.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"a\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"First tensor.\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"b\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Second tensor; same shape or broadcast compatible.\"</span><span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"sum\"</span><span class=\"p\">,</span> <span class=\"s2\">\"plus\"</span><span class=\"p\">,</span> <span class=\"s2\">\"residual\"</span><span class=\"p\">,</span> <span class=\"s2\">\"skip connection\"</span><span class=\"p\">,</span> <span class=\"s2\">\"shortcut\"</span><span class=\"p\">,</span> <span class=\"s2\">\"bias add\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">a</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span> <span class=\"n\">b</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">a</span> <span class=\"o\">+</span> <span class=\"n\">b</span><span class=\"p\">)</span>\n"}, "BasicMultiply": {"id": "BasicMultiply", "name": "Multiply", "cat": "Basic", "desc": "Element-wise multiplication of two tensors (broadcasting); useful for gating or scaling.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><spa

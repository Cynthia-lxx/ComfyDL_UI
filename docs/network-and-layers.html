<title>Network &amp; Layers — node catalog</title>
<style>:root{--bg:#0f1013;--panel:#16171c;--card:#1c1e24;--border:#262832;--text:#e6e6ec;--muted:#9a9aa5;--faint:#6b6b76;--pop:linear(0,.06 3.2%,.35 7.4%,.72 12.1%,.9 16.6%,1.02 21.5%,1.07 26.4%,1.075 31.1%,1.044 37.3%,.98 47.3%,.963 55.5%,.967 64.4%,.99 80.4%,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.45;font-family:system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 40px}
header{margin-bottom:14px}
h1{margin:0;font-size:22px}
h1 .amp{color:var(--faint);font-weight:400}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:4px 12px;font-size:12.5px;color:var(--muted)}
.stat b{color:var(--text);font-size:14px;margin-right:4px}
.cats{columns:5 220px;column-gap:12px}
.cat{break-inside:avoid;background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden}
.chead{display:flex;align-items:center;gap:8px;width:100%;padding:8px 11px;background:none;border:0;color:var(--text);cursor:pointer;font:inherit;font-weight:600;font-size:13px;text-align:left}
.chead:hover{background:var(--card)}
.chead .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.chead .cname{color:var(--accent);flex:1}
.chead .count{font-size:10.5px;font-weight:500;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:4px;padding:0 6px}
.chips{display:flex;flex-direction:column;gap:4px;padding:0 8px 8px}
.chip{width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:5px;color:var(--text);cursor:pointer;font:inherit;font-size:11.5px;padding:4px 9px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:28px;background:rgba(8,9,12,.62);opacity:0;pointer-events:none;transition:opacity .18s ease,visibility .18s ease;visibility:hidden}
.ov.show{opacity:1;pointer-events:auto;visibility:visible}
.ov-card{position:relative;width:min(760px,100%);max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px 22px;transform:translateY(34px) scale(.93);opacity:0;transition:transform .32s var(--pop),opacity .2s ease}
.ov.show .ov-card{transform:none;opacity:1}
.ov-x{position:absolute;top:10px;right:12px;background:var(--card);border:1px solid var(--border);border-radius:5px;color:var(--muted);cursor:pointer;font:inherit;font-size:13px;line-height:1;padding:4px 9px;z-index:2}
.ov-x:hover{color:var(--text);border-color:var(--faint)}
.ov-tag{display:inline-block;font-size:10.5px;letter-spacing:.4px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 8px;margin-bottom:10px;opacity:.9}
.ov-name{margin:0 0 2px;font-size:21px}
.ov-id{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--faint);margin:0 0 10px}
.ov-desc{font-size:13.5px;color:var(--text);margin:0 0 6px}
.ov-row{display:flex;gap:10px;padding:8px 10px;background:var(--card);border:1px solid var(--border);border-radius:6px;margin-bottom:6px}
.ov-row .rn{font-weight:600;font-size:13px;flex:none;width:170px}
.ov-row .rn small{display:block;font-family:ui-monospace,Consolas,monospace;font-weight:400;font-size:10px;color:var(--accent);opacity:.85}
.ov-row .rd{font-size:12px;color:var(--muted)}
.ov-src{margin-top:12px}
.ov-src h3{font-size:11px;font-weight:600;letter-spacing:.8px;color:var(--faint);text-transform:uppercase;margin:0 0 6px}
.codehl{background:#141416!important;border:1px solid var(--border);border-radius:6px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;line-height:1.5;padding:12px 14px;overflow:auto;max-height:46vh;margin:0;tab-size:4}

n><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">sigmoid</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">))</span>\n"}, "ActivationTanh": {"id": "ActivationTanh", "name": "Tanh", "cat": "Activation", "desc": "Element-wise hyperbolic tangent; output range (-1, 1).", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">ActivationTanh</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Hyperbolic tangent activation, ``tanh(x)``.</span>\n\n<span class=\"sd\">    What: squashes every element into the open interval (-1, 1).</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - arbitrary N-D tensor; dtype/device preserved.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same shape/dtype/device, values in (-1, 1).</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_activation_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"ActivationTanh\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Tanh\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Element-wise hyperbolic tangent; output range (-1, 1).\"</span><span class=\"p\">,</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">tanh</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">))</span>\n"}, "ActivationReLU": {"id": "ActivationReLU", "name": "ReLU", "cat": "Activation", "desc": "Element-wise rectified linear unit: max(0, x).", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">ActivationReLU</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Rectified linear unit, ``max(0, x)``.</span>\n\n<span class=\"sd\">    What: zeroes negative elements, passes non-negative ones unchanged.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - arbitrary N-D tensor; dtype/device preserved.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same shape/dtype/device, all values &gt;= 0.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_activation_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"ActivationReLU\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"ReLU\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Element-wise rectified linear unit: max(0, x).\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"rectified\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">relu</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">))</span>\n"}, "ActivationLeakyReLU": {"id": "ActivationLeakyReLU", "name": "Leaky ReLU", "cat": "Activation", "desc": "ReLU variant that keeps a small slope (negative_slope) for x < 0.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">ActivationLeakyReLU</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Leaky ReLU, ``max(0, x) + negative_slope * min(0, x)``.</span>\n\n<span class=\"sd\">    What: like ReLU but keeps a small slope for negative elements, which avoids</span>\n<span class=\"sd\">          dead units.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - arbitrary N-D tensor; dtype/device preserved.</span>\n<span class=\"sd\">          negative_slope (FLOAT) - slope applied to negative values.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same shape/dtype/device.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_activation_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"ActivationLeakyReLU\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Leaky ReLU\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"ReLU variant that keeps a small slope (negative_slope) for x &lt; 0.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">extra_inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"negative_slope\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">0.01</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">1.0</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">0.01</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Slope applied to negative values (0 gives plain ReLU).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">)</span>\n            <span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span> <span class=\"n\">negative_slope</span><span class=\"p\">:</span> <span class=\"nb\">float</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">leaky_relu</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">negative_slope</span><span class=\"o\">=</span><span class=\"n\">negative_slope</span><span class=\"p\">))</span>\n"}, "ActivationELU": {"id": "ActivationELU", "name": "ELU", "cat": "Activation", "desc": "Exponential linear unit: x if x > 0 else alpha * (exp(x) - 1).", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">ActivationELU</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Exponential linear unit, ``x`` for ``x &gt; 0`` and ``alpha * (exp(x) - 1)`` below.</span>\n\n<span class=\"sd\">    What: smooths negative values toward ``-alpha`` while keeping positives</span>\n<span class=\"sd\">          unchanged.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - arbitrary N-D tensor; dtype/device preserved.</span>\n<span class=\"sd\">          alpha  (FLOAT) - saturation value for negative inputs.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same shape/dtype/device, values &gt;= -alpha.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_activation_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"ActivationELU\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"ELU\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Exponential linear unit: x if x &gt; 0 else alpha * (exp(x) - 1).\"</span><span class=\"p\">,</span>\n            <span class=\"n\">extra_inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"alpha\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">1.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">100.0</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">0.01</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Value that negative inputs saturate towards.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">)</span>\n            <span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span> <span class=\"n\">alpha</span><span class=\"p\">:</span> <span class=\"nb\">float</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">elu</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">alpha</span><span class=\"o\">=</span><span class=\"n\">alpha</span><span class=\"p\">))</span>\n"}, "ActivationSELU": {"id": "ActivationSELU", "name": "SELU", "cat": "Activation", "desc": "Self-normalizing ELU with the standard scale/alpha constants.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">ActivationSELU</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Scaled exponential linear unit with the standard fixed constants.</span>\n\n<span class=\"sd\">    What: self-normalizing activation using the canonical</span>\n<span class=\"sd\">          ``scale=1.05070098`` / ``alpha=1.67326324`` pair; no user parameters.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - arbitrary N-D tensor; dtype/device preserved.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same shape/dtype/device.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_activation_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"ActivationSELU\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"SELU\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Self-normalizing ELU with the standard scale/alpha constants.\"</span><span class=\"p\">,</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">selu</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">))</span>\n"}, "ActivationGELU": {"id": "ActivationGELU", "name": "GELU", "cat": "Activation", "desc": "Gaussian error linear unit; choose the exact or tanh approximation.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">ActivationGELU</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Gaussian error linear unit.</span>\n\n<span class=\"sd\">    What: smooth, non-monotonic activation widely used by transformers.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - arbitrary N-D tensor; dtype/device preserved.</span>\n<span class=\"sd\">          approximate (COMBO) - \"none\" uses the exact erf formulation,</span>\n<span class=\"sd\">          \"tanh\" uses the cheaper tanh approximation.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same shape/dtype/device.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_activation_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"ActivationGELU\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"GELU\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Gaussian error linear unit; choose the exact or tanh approximation.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">extra_inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Combo</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"approximate\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">options</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"none\"</span><span class=\"p\">,</span> <span class=\"s2\">\"tanh\"</span><span class=\"p\">],</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"none\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s1\">'\"none\" = exact erf form, \"tanh\" = faster approximation.'</span><span class=\"p\">,</span>\n                <span class=\"p\">)</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"gaussian\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span> <span class=\"n\">approximate</span><span class=\"p\">:</span> <span class=\"nb\">str</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">gelu</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">approximate</span><span class=\"o\">=</span><span class=\"n\">approximate</span><span class=\"p\">))</span>\n"}, "ActivationSiLU": {"id": "ActivationSiLU", "name": "SiLU", "cat": "Activation", "desc": "Sigmoid linear unit (swish): x * sigmoid(x).", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">ActivationSiLU</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Sigmoid linear unit (a.k.a. swish), ``x * sigmoid(x)``.</span>\n\n<span class=\"sd\">    What: smooth, non-monotonic activation with a single minimum.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - arbitrary N-D tensor; dtype/device preserved.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same shape/dtype/device, values &gt;= ~-0.2785.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_activation_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"ActivationSiLU\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"SiLU\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Sigmoid linear unit (swish): x * sigmoid(x).\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"swish\"</span><span class=\"p\">,</span> <span class=\"s2\">\"silu\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">silu</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">))</span>\n"}, "ActivationMish": {"id": "ActivationMish", "name": "Mish", "cat": "Activation", "desc": "Mish activation: x * tanh(softplus(x)).", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">ActivationMish</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Mish activation, ``x * tanh(softplus(x))``.</span>\n\n<span class=\"sd\">    What: smooth, non-monotonic activation; unbounded above, bounded below.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - arbitrary N-D tensor; dtype/device preserved.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same shape/dtype/device.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_activation_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"ActivationMish\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Mish\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Mish activation: x * tanh(softplus(x)).\"</span><span class=\"p\">,</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"c1\"># torch.nn.functional.mish is the exact same formula; spelled out here</span>\n        <span class=\"c1\"># so the node works on any torch build that has softplus/tanh.</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">tensor</span> <span class=\"o\">*</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">tanh</span><span class=\"p\">(</span><span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">softplus</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">)))</span>\n"}, "ActivationSoftplus": {"id": "ActivationSoftplus", "name": "Softplus", "cat": "Activation", "desc": "Smooth ReLU approximation: log(1 + exp(x)) (beta=1, threshold=20).", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">ActivationSoftplus</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Softplus, a smooth approximation of ReLU: ``log(1 + exp(x))``.</span>\n\n<span class=\"sd\">    What: smooth, strictly positive activation using torch defaults</span>\n<span class=\"sd\">          (``beta=1``, ``threshold=20``; above the threshold it is linear).</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - arbitrary N-D tensor; dtype/device preserved.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same shape/dtype/device, all values &gt; 0.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_activation_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"ActivationSoftplus\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Softplus\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Smooth ReLU approximation: log(1 + exp(x)) (beta=1, threshold=20).\"</span><span class=\"p\">,</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">softplus</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">))</span>\n"}, "ActivationReLU6": {"id": "ActivationReLU6", "name": "ReLU6", "cat": "Activation", "desc": "ReLU clamped to [0, 6]: min(max(0, x), 6).", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">ActivationReLU6</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"ReLU clamped to the [0, 6] range.</span>\n\n<span class=\"sd\">    What: ``min(max(0, x), 6)``; commonly used in mobile/quantized networks.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - arbitrary N-D tensor; dtype/device preserved.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same shape/dtype/device, values in [0, 6].</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_activation_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"ActivationReLU6\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"ReLU6\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"ReLU clamped to [0, 6]: min(max(0, x), 6).\"</span><span class=\"p\">,</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">hardtanh</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"mf\">0.0</span><span class=\"p\">,</span> <span class=\"mf\">6.0</span><span class=\"p\">))</span>\n"}, "ActivationHardSwish": {"id": "ActivationHardSwish", "name": "Hard Swish", "cat": "Activation", "desc": "Piecewise-linear SiLU approximation: x * relu6(x + 3) / 6.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">ActivationHardSwish</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Hard swish, the piecewise-linear approximation of SiLU.</span>\n\n<span class=\"sd\">    What: ``x * relu6(x + 3) / 6``; cheaper than SiLU and quantization friendly.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - arbitrary N-D tensor; dtype/device preserved.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same shape/dtype/device.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_activation_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"ActivationHardSwish\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Hard Swish\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Piecewise-linear SiLU approximation: x * relu6(x + 3) / 6.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"hardswish\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">hardswish</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">))</span>\n"}, "ActivationIdentity": {"id": "ActivationIdentity", "name": "Identity", "cat": "Activation", "desc": "Pass-through activation; returns the input tensor unchanged.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">ActivationIdentity</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Identity activation: forwards the input unchanged.</span>\n\n<span class=\"sd\">    What: a zero-copy pass-through, useful as a placeholder or to keep a graph</span>\n<span class=\"sd\">          shape stable while swapping activations around.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - arbitrary N-D tensor.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - the very same tensor object (no copy, no compute).</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_activation_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"ActivationIdentity\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Identity\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Pass-through activation; returns the input tensor unchanged.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"linear\"</span><span class=\"p\">,</span> <span class=\"s2\">\"none\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">)</span>\n"}, "ActivationSoftmax": {"id": "ActivationSoftmax", "name": "Softmax", "cat": "Activation", "desc": "Normalize values along one dimension so that they sum to 1.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">ActivationSoftmax</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Softmax normalization along a chosen dimension.</span>\n\n<span class=\"sd\">    What: rescales values along ``dim`` so that they sum to 1 (a probability</span>\n<span class=\"sd\">          distribution over that dimension).</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - arbitrary N-D tensor.</span>\n<span class=\"sd\">          dim    (INT)    - dimension to normalize over; clamped into</span>\n<span class=\"sd\">                            ``[-rank, rank - 1]`` so an out-of-range value</span>\n<span class=\"sd\">                            never breaks a workflow.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same shape/dtype/device, summing to 1 along ``dim``.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_activation_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"ActivationSoftmax\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Softmax\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Normalize values along one dimension so that they sum to 1.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">extra_inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"dim\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=-</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=-</span><span class=\"mi\">4</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">4</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Dimension to normalize over (clamped to the tensor rank).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">)</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"normalize\"</span><span class=\"p\">,</span> <span class=\"s2\">\"logits\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span> <span class=\"n\">dim</span><span class=\"p\">:</span> <span class=\"nb\">int</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">rank</span> <span class=\"o\">=</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">()</span>\n        <span class=\"k\">if</span> <span class=\"n\">rank</span> <span class=\"o\">==</span> <span class=\"mi\">0</span><span class=\"p\">:</span>\n            <span class=\"c1\"># A scalar's distribution is trivially [1.0]; softmax would raise.</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">ones_like</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">))</span>\n        <span class=\"n\">dim</span> <span class=\"o\">=</span> <span class=\"nb\">max</span><span class=\"p\">(</span><span class=\"o\">-</span><span class=\"n\">rank</span><span class=\"p\">,</span> <span class=\"nb\">min</span><span class=\"p\">(</span><span class=\"n\">rank</span> <span class=\"o\">-</span> <span class=\"mi\">1</span><span class=\"p\">,</span> <span class=\"n\">dim</span><span class=\"p\">))</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">softmax</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">dim</span><span class=\"o\">=</span><span class=\"n\">dim</span><span class=\"p\">))</span>\n"}, "AttentionMultihead": {"id": "AttentionMultihead", "name": "Multi-Head Attention", "cat": "Attention", "desc": "Multi-head attention over wired q/k/v tensors: projections, scaled dot-product, optional mask, softmax and output projection.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">AttentionMultihead</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Multi-head attention over wired q / k / v tensors.</span>\n\n<span class=\"sd\">    What: the full ``torch.nn.MultiheadAttention`` math in functional form -</span>\n<span class=\"sd\">          project ``queries`` / ``keys`` / ``values`` with the wired weights, split</span>\n<span class=\"sd\">          into ``num_heads`` heads, score with ``Q K^T / sqrt(d)``, apply the</span>\n<span class=\"sd\">          optional ``mask``, softmax, (in train mode) drop out attention weights,</span>\n<span class=\"sd\">          re-merge and project with ``out_weight``. The parameters are not stored</span>\n<span class=\"sd\">          inside the node, so one node can run any checkpoint. The optional mask</span>\n<span class=\"sd\">          is boolean (``True`` = attend) or additive float, broadcastable to</span>\n<span class=\"sd\">          ``(batch, heads, query_len, key_len)`` - a ``(L, S)`` causal or padding</span>\n<span class=\"sd\">          mask plugs straight in.</span>\n<span class=\"sd\">    In:   queries (TENSOR) - ``(..., L, E_in_q)``; shares leading batch dims with</span>\n<span class=\"sd\">          keys / values.</span>\n<span class=\"sd\">          keys (TENSOR) - ``(..., S, E_in_k)``.</span>\n<span class=\"sd\">          values (TENSOR) - ``(..., S, E_in_v)``.</span>\n<span class=\"sd\">          q_weight, k_weight, v_weight (TENSOR) - ``(E, E_in_*)`` each, wired in;</span>\n<span class=\"sd\">          ``E`` must be divisible by ``num_heads``.</span>\n<span class=\"sd\">          out_weight (TENSOR) - ``(E_out, E)``.</span>\n<span class=\"sd\">          q_bias, k_bias, v_bias, out_bias (TENSOR, optional) - ``(E,)`` /</span>\n<span class=\"sd\">          ``(E_out,)``; leave unconnected for bias-free projections.</span>\n<span class=\"sd\">          mask (TENSOR, optional) - boolean or additive, broadcastable to</span>\n<span class=\"sd\">          ``(batch, heads, L, S)``.</span>\n<span class=\"sd\">          num_heads (INT) - number of parallel heads (default 4).</span>\n<span class=\"sd\">          dropout_p (FLOAT) - attention-weight dropout probability; train mode</span>\n<span class=\"sd\">          only, 0 disables.</span>\n<span class=\"sd\">          seed (INT) - seed of the dropout draw; the same seed reproduces the</span>\n<span class=\"sd\">          same output bit for bit.</span>\n<span class=\"sd\">          mode (STRING, optional) - link the ``mode`` output of a Training Mode</span>\n<span class=\"sd\">          node; unconnected means ``train``.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - ``(..., L, E_out)``. Floating-point inputs and weights</span>\n<span class=\"sd\">          of different dtypes are promoted to their common dtype first (e.g.</span>\n<span class=\"sd\">          fp16 activations with fp32 weights run in fp32).</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_attention_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"AttentionMultihead\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Multi-Head Attention\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Multi-head attention over wired q/k/v tensors: projections, scaled dot-product, optional mask, softmax and output projection.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"queries\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Queries of shape (..., query_len, in_width_q); shares leading batch dims with keys/values.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"keys\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Keys of shape (..., key_len, in_width_k).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"values\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Values of shape (..., key_len, in_width_v).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"q_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"in_width_q\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"k_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"in_width_k\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"v_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"in_width_v\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"out_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"embed width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"q_bias\"</span><span class=\"p\">,</span> <span class=\"s2\">\"embed width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"k_bias\"</span><span class=\"p\">,</span> <span class=\"s2\">\"embed width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"v_bias\"</span><span class=\"p\">,</span> <span class=\"s2\">\"embed width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"out_bias\"</span><span class=\"p\">,</span> <span class=\"s2\">\"out width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_mask_input</span><span class=\"p\">(),</span>\n                <span class=\"n\">_num_heads_input</span><span class=\"p\">(),</span>\n                <span class=\"n\">_dropout_p_input</span><span class=\"p\">(),</span>\n                <span class=\"n\">_seed_input</span><span class=\"p\">(),</span>\n                <span class=\"n\">_attn_mode_input</span><span class=\"p\">(),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"attention\"</span><span class=\"p\">,</span> <span class=\"s2\">\"mha\"</span><span class=\"p\">,</span> <span class=\"s2\">\"scaled dot product\"</span><span class=\"p\">,</span> <span class=\"s2\">\"sdpa\"</span><span class=\"p\">,</span> <span class=\"s2\">\"transformer\"</span><span class=\"p\">,</span> <span class=\"s2\">\"qkv\"</span><span class=\"p\">,</span> <span class=\"s2\">\"self attention\"</span><span class=\"p\">,</span> <span class=\"s2\">\"cross attention\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">queries</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">keys</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">values</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">q_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">k_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">v_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">out_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">q_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">k_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">v_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">out_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">mask</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">num_heads</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">4</span><span class=\"p\">,</span>\n        <span class=\"n\">dropout_p</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">0.0</span><span class=\"p\">,</span>\n        <span class=\"n\">seed</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">0</span><span class=\"p\">,</span>\n        <span class=\"n\">mode</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"n\">MODE_TRAIN</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span>\n            <span class=\"n\">_multi_head_attention</span><span class=\"p\">(</span>\n                <span class=\"n\">queries</span><span class=\"p\">,</span> <span class=\"n\">keys</span><span class=\"p\">,</span> <span class=\"n\">values</span><span class=\"p\">,</span>\n                <span class=\"n\">q_weight</span><span class=\"p\">,</span> <span class=\"n\">k_weight</span><span class=\"p\">,</span> <span class=\"n\">v_weight</span><span class=\"p\">,</span> <span class=\"n\">out_weight</span><span class=\"p\">,</span>\n                <span class=\"n\">q_bias</span><span class=\"o\">=</span><span class=\"n\">q_bias</span><span class=\"p\">,</span> <span class=\"n\">k_bias</span><span class=\"o\">=</span><span class=\"n\">k_bias</span><span class=\"p\">,</span> <span class=\"n\">v_bias</span><span class=\"o\">=</span><span class=\"n\">v_bias</span><span class=\"p\">,</span> <span class=\"n\">out_bias</span><span class=\"o\">=</span><span class=\"n\">out_bias</span><span class=\"p\">,</span>\n                <span class=\"n\">mask</span><span class=\"o\">=</span><span class=\"n\">mask</span><span class=\"p\">,</span> <span class=\"n\">num_heads</span><span class=\"o\">=</span><span class=\"n\">num_heads</span><span class=\"p\">,</span> <span class=\"n\">dropout_p</span><span class=\"o\">=</span><span class=\"n\">dropout_p</span><span class=\"p\">,</span>\n                <span class=\"n\">training</span><span class=\"o\">=</span><span class=\"n\">_normalize_mode</span><span class=\"p\">(</span><span class=\"n\">mode</span><span class=\"p\">)</span> <span class=\"o\">==</span> <span class=\"n\">MODE_TRAIN</span><span class=\"p\">,</span> <span class=\"n\">seed</span><span class=\"o\">=</span><span class=\"n\">seed</span><span class=\"p\">,</span>\n            <span class=\"p\">)</span>\n        <span class=\"p\">)</span>\n"}, "AttentionSelf": {"id": "AttentionSelf", "name": "Self-Attention", "cat": "Attention", "desc": "Self-attention on one tensor: q=k=v=the wired input, projections from the wired weight set.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">AttentionSelf</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Self-attention: one tensor queries, keys and values itself.</span>\n\n<span class=\"sd\">    What: the most common attention form - ``AttentionMultihead`` with</span>\n<span class=\"sd\">          ``queries = keys = values = tensor``, so the sequence attends to</span>\n<span class=\"sd\">          itself. The q/k/v projections happen inside the node from the same</span>\n<span class=\"sd\">          wired weight set, which removes the three duplicate wires the general</span>\n<span class=\"sd\">          node would need. Output shape equals input shape when ``out_weight``</span>\n<span class=\"sd\">          is square ``(E, E)``, the usual residual-block setup.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - ``(..., L, E_in)``; the sequence attending to itself.</span>\n<span class=\"sd\">          q_weight, k_weight, v_weight (TENSOR) - ``(E, E_in)`` each, wired in;</span>\n<span class=\"sd\">          ``E`` must be divisible by ``num_heads``.</span>\n<span class=\"sd\">          out_weight (TENSOR) - ``(E_out, E)``; square for residual use.</span>\n<span class=\"sd\">          q_bias, k_bias, v_bias, out_bias (TENSOR, optional) - ``(E,)`` /</span>\n<span class=\"sd\">          ``(E_out,)``.</span>\n<span class=\"sd\">          mask (TENSOR, optional) - boolean or additive, broadcastable to</span>\n<span class=\"sd\">          ``(batch, heads, L, L)``.</span>\n<span class=\"sd\">          num_heads (INT), dropout_p (FLOAT), seed (INT), mode (STRING,</span>\n<span class=\"sd\">          optional) - as in ``Multi-Head Attention``.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - ``(..., L, E_out)``; dtype promotion as in</span>\n<span class=\"sd\">          ``BasicLinear``.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_attention_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"AttentionSelf\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Self-Attention\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Self-attention on one tensor: q=k=v=the wired input, projections from the wired weight set.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Input sequence of shape (..., seq_len, in_width); it queries, keys and values itself.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"q_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"in_width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"k_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"in_width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"v_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"in_width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"out_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"embed width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"q_bias\"</span><span class=\"p\">,</span> <span class=\"s2\">\"embed width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"k_bias\"</span><span class=\"p\">,</span> <span class=\"s2\">\"embed width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"v_bias\"</span><span class=\"p\">,</span> <span class=\"s2\">\"embed width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"out_bias\"</span><span class=\"p\">,</span> <span class=\"s2\">\"out width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_mask_input</span><span class=\"p\">(),</span>\n                <span class=\"n\">_num_heads_input</span><span class=\"p\">(),</span>\n                <span class=\"n\">_dropout_p_input</span><span class=\"p\">(),</span>\n                <span class=\"n\">_seed_input</span><span class=\"p\">(),</span>\n                <span class=\"n\">_attn_mode_input</span><span class=\"p\">(),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"self attention\"</span><span class=\"p\">,</span> <span class=\"s2\">\"attention\"</span><span class=\"p\">,</span> <span class=\"s2\">\"sa\"</span><span class=\"p\">,</span> <span class=\"s2\">\"transformer\"</span><span class=\"p\">,</span> <span class=\"s2\">\"intra attention\"</span><span class=\"p\">,</span> <span class=\"s2\">\"mha\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">q_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">k_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">v_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">out_weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">q_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">k_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">v_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">out_bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">mask</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">num_heads</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">4</span><span class=\"p\">,</span>\n        <span class=\"n\">dropout_p</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">0.0</span><span class=\"p\">,</span>\n        <span class=\"n\">seed</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">0</span><span class=\"p\">,</span>\n        <span class=\"n\">mode</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"n\">MODE_TRAIN</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span>\n            <span class=\"n\">_multi_head_attention</span><span class=\"p\">(</span>\n                <span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">,</span>\n                <span class=\"n\">q_weight</span><span class=\"p\">,</span> <span class=\"n\">k_weight</span><span class=\"p\">,</span> <span class=\"n\">v_weight</span><span class=\"p\">,</span> <span class=\"n\">out_weight</span><span class=\"p\">,</span>\n                <span class=\"n\">q_bias</span><span class=\"o\">=</span><span class=\"n\">q_bias</span><span class=\"p\">,</span> <span class=\"n\">k_bias</span><span class=\"o\">=</span><span class=\"n\">k_bias</span><span class=\"p\">,</span> <span class=\"n\">v_bias</span><span class=\"o\">=</span><span class=\"n\">v_bias</span><span class=\"p\">,</span> <span class=\"n\">out_bias</span><span class=\"o\">=</span><span class=\"n\">out_bias</span><span class=\"p\">,</span>\n                <span class=\"n\">mask</span><span class=\"o\">=</span><span class=\"n\">mask</span><span class=\"p\">,</span> <span class=\"n\">num_heads</span><span class=\"o\">=</span><span class=\"n\">num_heads</span><span class=\"p\">,</span> <span class=\"n\">dropout_p</span><span class=\"o\">=</span><span class=\"n\">dropout_p</span><span class=\"p\">,</span>\n                <span class=\"n\">training</span><span class=\"o\">=</span><span class=\"n\">_normalize_mode</span><span class=\"p\">(</span><span class=\"n\">mode</span><span class=\"p\">)</span> <span class=\"o\">==</span> <span class=\"n\">MODE_TRAIN</span><span class=\"p\">,</span> <span class=\"n\">seed</span><span class=\"o\">=</span><span class=\"n\">seed</span><span class=\"p\">,</span>\n            <span class=\"p\">)</span>\n        <span class=\"p\">)</span>\n"}, "AttentionCross": {"id": "AttentionCross", "name": "Cross-Attention", "cat": "Attention", "desc": "Cross-attention: queries from tensor, keys/values from context; the encoder-decoder / multimodal form.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">AttentionCross</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Cross-attention: ``tensor`` queries, ``context`` keys and values.</span>\n\n<span class=\"sd\">    What: the encoder-decoder / multimodal form - queries are projected from</span>\n<span class=\"sd\">          ``tensor``, keys and values from ``context`` (a different sequence, a</span>\n<span class=\"sd\">          different width even), so one modality can attend to another. Output</span>\n<span class=\"sd\">          length follows ``tensor``'s sequence dimension, which is what a decoder</span>\n<span class=\"sd\">          block expects.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - ``(..., L, E_in_q)``; provides the queries.</span>\n<span class=\"sd\">          context (TENSOR) - ``(..., S, E_in_kv)``; provides keys and values,</span>\n<span class=\"sd\">          shares the leading batch dims with ``tensor``.</span>\n<span class=\"sd\">          q_weight (TENSOR) - ``(E, E_in_q)``; k_weight / v_weight -</span>\n<span class=\"sd\">          ``(E, E_in_kv)`` each, wired in; ``E`` must be divisible by</span>\n<span class=\"sd\">          ``num_heads``.</span>\n<span class=\"sd\">          out_weight (TENSOR) - ``(E_out, E)``.</span>\n<span class=\"sd\">          q_bias, k_bias, v_bias, out_bias (TENSOR, optional) - ``(E,)`` /</span>\n<span class=\"sd\">          ``(E_out,)``.</span>\n<span class=\"sd\">          mask (TENSOR, optional) - boolean or additive, broadcastable to</span>\n<span class=\"sd\">          ``(batch, heads, L, S)``.</span>\n<span class=\"sd\">          num_heads (INT), dropout_p (FLOAT), seed (INT), mode (STRING,</span>\n<span class=\"sd\">          optional) - as in ``Multi-Head Attention``.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - ``(..., L, E_out)``; dtype promotion as in</span>\n<span class=\"sd\">          ``BasicLinear``.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_attention_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"AttentionCross\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Cross-Attention\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Cross-attention: queries from tensor, keys/values from context; the encoder-decoder / multimodal form.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Query source of shape (..., query_len, in_width_q).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"context\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Key/value source of shape (..., context_len, in_width_kv); same leading batch dims as tensor.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"q_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"in_width_q\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"k_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"in_width_kv\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"v_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"in_width_kv\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"out_weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"embed width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"q_bias\"</span><span class=\"p\">,</span> <span class=\"s2\">\"embed width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"k_bias\"</span><span class=\"p\">,</span> <span class=\"s2\">\"embed width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"v_bias\"</span><span class=\"p\">,</span> <span class=\"s2\">\"embed width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"out_bias\"</span><span class=\"p\">,</span> <span class=\"s2\">\"out width\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_mask_input</span><span class=\"p\">(),</span>\n                <span class=\"n\">_num_heads_input</span><span class=\"p\">(),</span>\n                <span class=\"n\">_dropout_p_input</span><span class=\"p\">(),</span>\n                <span class=\"n\">_seed_input</span><span class=\"p\">(),</span>\n                <span class=\"n\">_attn_mode_input</span><span class=\"p\">(),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"cross a

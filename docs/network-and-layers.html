ning Loop: </span><span class=\"si\">{</span><span class=\"n\">model</span><span class=\"o\">.</span><span class=\"n\">depth</span><span class=\"si\">}</span><span class=\"s2\"> dense layer(s) [</span><span class=\"si\">{</span><span class=\"n\">summary</span><span class=\"si\">}</span><span class=\"s2\">], \"</span>\n            <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"n\">data</span><span class=\"o\">.</span><span class=\"n\">samples</span><span class=\"si\">}</span><span class=\"s2\"> sample(s) x </span><span class=\"si\">{</span><span class=\"n\">data</span><span class=\"o\">.</span><span class=\"n\">features</span><span class=\"si\">}</span><span class=\"s2\"> feature(s) -&gt; </span><span class=\"si\">{</span><span class=\"n\">data</span><span class=\"o\">.</span><span class=\"n\">outputs</span><span class=\"si\">}</span><span class=\"s2\"> \"</span>\n            <span class=\"sa\">f</span><span class=\"s2\">\"output(s), loss </span><span class=\"si\">{</span><span class=\"n\">data</span><span class=\"o\">.</span><span class=\"n\">loss</span><span class=\"si\">}</span><span class=\"s2\">, </span><span class=\"si\">{</span><span class=\"n\">iterations</span><span class=\"si\">}</span><span class=\"s2\"> step(s), \"</span>\n            <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"n\">per_step</span><span class=\"w\"> </span><span class=\"ow\">or</span><span class=\"w\"> </span><span class=\"n\">data</span><span class=\"o\">.</span><span class=\"n\">samples</span><span class=\"si\">}</span><span class=\"s2\"> sample(s) per step, </span><span class=\"si\">{</span><span class=\"n\">optimizer</span><span class=\"o\">.</span><span class=\"n\">describe</span><span class=\"p\">()</span><span class=\"si\">}</span><span class=\"s2\">, \"</span>\n            <span class=\"sa\">f</span><span class=\"s2\">\"loss </span><span class=\"si\">{</span><span class=\"nb\">float</span><span class=\"p\">(</span><span class=\"n\">history</span><span class=\"p\">[</span><span class=\"mi\">0</span><span class=\"p\">])</span><span class=\"si\">:</span><span class=\"s2\">.6g</span><span class=\"si\">}</span><span class=\"s2\"> -&gt; </span><span class=\"si\">{</span><span class=\"nb\">float</span><span class=\"p\">(</span><span class=\"n\">curve</span><span class=\"p\">[</span><span class=\"o\">-</span><span class=\"mi\">1</span><span class=\"p\">])</span><span class=\"si\">:</span><span class=\"s2\">.6g</span><span class=\"si\">}</span><span class=\"s2\">\"</span>\n            <span class=\"o\">+</span> <span class=\"p\">(</span><span class=\"sa\">f</span><span class=\"s2\">\" | </span><span class=\"si\">{</span><span class=\"s1\">' | '</span><span class=\"o\">.</span><span class=\"n\">join</span><span class=\"p\">(</span><span class=\"n\">notes</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\">\"</span> <span class=\"k\">if</span> <span class=\"n\">notes</span> <span class=\"k\">else</span> <span class=\"s2\">\"\"</span><span class=\"p\">)</span>\n        <span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">module_parameters</span><span class=\"p\">(</span><span class=\"n\">model</span><span class=\"p\">),</span> <span class=\"n\">curve</span><span class=\"p\">[</span><span class=\"o\">-</span><span class=\"mi\">1</span><span class=\"p\">],</span> <span class=\"n\">curve</span><span class=\"p\">,</span> <span class=\"n\">predictions</span><span class=\"p\">)</span>\n"}, "TrainingLoss": {"id": "TrainingLoss", "name": "Loss", "cat": "Training", "desc": "Computes one loss (mse / l1 / smooth_l1 / cross_entropy / bce_with_logits / kl_div) between a prediction and a target.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TrainingLoss</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Computes one loss between a prediction and a target.</span>\n\n<span class=\"sd\">    What: the standalone form of the trainer's loss, on the shared math of</span>\n<span class=\"sd\">          ``comfy.training_metrics`` - the same function a ``Training Loop``</span>\n<span class=\"sd\">          minimizes, available for evaluation graphs, comparisons of custom</span>\n<span class=\"sd\">          objectives, or feeding a number into any tensor node. Forward only:</span>\n<span class=\"sd\">          no gradients are taken here (they cannot cross a node boundary</span>\n<span class=\"sd\">          anyway), so it is safe anywhere in a graph.</span>\n<span class=\"sd\">    In:   prediction (TENSOR) - model output; logits for the classification</span>\n<span class=\"sd\">          losses, raw values for the regression losses.</span>\n<span class=\"sd\">          target (TENSOR) - ground truth; see the loss below for the expected</span>\n<span class=\"sd\">          form.</span>\n<span class=\"sd\">          loss (COMBO) - ``mse`` / ``l1`` / ``smooth_l1``: regression targets of</span>\n<span class=\"sd\">          the prediction's shape. ``cross_entropy``: class indices, or a</span>\n<span class=\"sd\">          one-hot / probability tensor of the prediction's shape. </span>\n<span class=\"sd\">          ``bce_with_logits``: 0/1 targets of the prediction's shape.</span>\n<span class=\"sd\">          ``kl_div``: probabilities of the prediction's shape (the KL of the</span>\n<span class=\"sd\">          target distribution from the prediction's softmax).</span>\n<span class=\"sd\">    Out:  loss (TENSOR) - scalar, the mean loss of the pair.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"TrainingLoss\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Loss\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Computes one loss (mse / l1 / smooth_l1 / cross_entropy / bce_with_logits / kl_div) between a prediction and a target.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"s2\">\"loss\"</span><span class=\"p\">,</span> <span class=\"s2\">\"mse\"</span><span class=\"p\">,</span> <span class=\"s2\">\"l1\"</span><span class=\"p\">,</span> <span class=\"s2\">\"smooth l1\"</span><span class=\"p\">,</span> <span class=\"s2\">\"cross entropy\"</span><span class=\"p\">,</span> <span class=\"s2\">\"bce\"</span><span class=\"p\">,</span>\n                <span class=\"s2\">\"binary cross entropy\"</span><span class=\"p\">,</span> <span class=\"s2\">\"kl divergence\"</span><span class=\"p\">,</span> <span class=\"s2\">\"objective\"</span><span class=\"p\">,</span> <span class=\"s2\">\"cost\"</span><span class=\"p\">,</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"prediction\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Model output: logits for the classification losses, values for the regression losses.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"target\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Ground truth: same shape as the prediction, or class indices for cross_entropy.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Combo</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"loss\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">options</span><span class=\"o\">=</span><span class=\"nb\">list</span><span class=\"p\">(</span><span class=\"n\">tm</span><span class=\"o\">.</span><span class=\"n\">LOSS_OPTIONS</span><span class=\"p\">),</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"mse\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Loss function; see the node's help for the expected target form.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"loss\"</span><span class=\"p\">)],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">prediction</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">target</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">loss</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"s2\">\"mse\"</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">mode</span> <span class=\"o\">=</span> <span class=\"n\">_loss_mode</span><span class=\"p\">(</span><span class=\"n\">loss</span><span class=\"p\">)</span>\n        <span class=\"k\">try</span><span class=\"p\">:</span>\n            <span class=\"n\">value</span> <span class=\"o\">=</span> <span class=\"n\">tm</span><span class=\"o\">.</span><span class=\"n\">compute_loss</span><span class=\"p\">(</span><span class=\"n\">mode</span><span class=\"p\">,</span> <span class=\"n\">prediction</span><span class=\"p\">,</span> <span class=\"n\">target</span><span class=\"p\">)</span>\n        <span class=\"k\">except</span> <span class=\"p\">(</span><span class=\"ne\">ValueError</span><span class=\"p\">,</span> <span class=\"ne\">TypeError</span><span class=\"p\">)</span> <span class=\"k\">as</span> <span class=\"n\">error</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span><span class=\"sa\">f</span><span class=\"s2\">\"[Network &amp; Layers] Loss (</span><span class=\"si\">{</span><span class=\"n\">mode</span><span class=\"si\">}</span><span class=\"s2\">): </span><span class=\"si\">{</span><span class=\"n\">error</span><span class=\"si\">}</span><span class=\"s2\">\"</span><span class=\"p\">)</span> <span class=\"kn\">from</span><span class=\"w\"> </span><span class=\"nn\">error</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">value</span><span class=\"o\">.</span><span class=\"n\">detach</span><span class=\"p\">()</span><span class=\"o\">.</span><span class=\"n\">reshape</span><span class=\"p\">(()))</span>\n"}, "TrainingMetrics": {"id": "TrainingMetrics", "name": "Metrics", "cat": "Training", "desc": "Computes one metric (mae / rmse / accuracy / top_3 / top_5 / perplexity) between a prediction and a target.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TrainingMetrics</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Computes one metric between a prediction and a target.</span>\n\n<span class=\"sd\">    What: the evaluation twin of the ``Loss`` node, on the shared math of</span>\n<span class=\"sd\">          ``comfy.training_metrics``. Metrics are read-only numbers (detached</span>\n<span class=\"sd\">          scalars): wire the prediction of any model node together with its</span>\n<span class=\"sd\">          targets and read the quality of the fit, without running a trainer.</span>\n<span class=\"sd\">    In:   prediction (TENSOR) - model output; logits for the classification</span>\n<span class=\"sd\">          metrics, raw values for the regression metrics.</span>\n<span class=\"sd\">          target (TENSOR) - ground truth; see the metric below for the expected</span>\n<span class=\"sd\">          form.</span>\n<span class=\"sd\">          metric (COMBO) - ``mae`` / ``rmse``: regression targets of the</span>\n<span class=\"sd\">          prediction's shape. ``accuracy`` / ``top_3`` / ``top_5``: class</span>\n<span class=\"sd\">          indices, or a one-hot / probability tensor of the prediction's shape</span>\n<span class=\"sd\">          (top-k accuracy; k is clamped to the class count). ``perplexity``:</span>\n<span class=\"sd\">          class indices / one-hot; ``exp(cross_entropy)`` of the token</span>\n<span class=\"sd\">          predictions - the natural LM quality number.</span>\n<span class=\"sd\">    Out:  metric (TENSOR) - scalar, the metric of the pair.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"TrainingMetrics\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Metrics\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Computes one metric (mae / rmse / accuracy / top_3 / top_5 / perplexity) between a prediction and a target.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"s2\">\"metric\"</span><span class=\"p\">,</span> <span class=\"s2\">\"accuracy\"</span><span class=\"p\">,</span> <span class=\"s2\">\"top-k\"</span><span class=\"p\">,</span> <span class=\"s2\">\"perplexity\"</span><span class=\"p\">,</span> <span class=\"s2\">\"mae\"</span><span class=\"p\">,</span> <span class=\"s2\">\"rmse\"</span><span class=\"p\">,</span>\n                <span class=\"s2\">\"evaluation\"</span><span class=\"p\">,</span> <span class=\"s2\">\"score\"</span><span class=\"p\">,</span> <span class=\"s2\">\"quality\"</span><span class=\"p\">,</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"prediction\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Model output: logits for the classification metrics, values for the regression metrics.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"target\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Ground truth: same shape as the prediction, or class indices for the classification metrics.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Combo</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"metric\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">options</span><span class=\"o\">=</span><span class=\"nb\">list</span><span class=\"p\">(</span><span class=\"n\">tm</span><span class=\"o\">.</span><span class=\"n\">METRIC_OPTIONS</span><span class=\"p\">),</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"mae\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Metric to compute; see the node's help for the expected target form.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"metric\"</span><span class=\"p\">)],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">prediction</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">target</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">metric</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"s2\">\"mae\"</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">text</span> <span class=\"o\">=</span> <span class=\"s2\">\"\"</span> <span class=\"k\">if</span> <span class=\"n\">metric</span> <span class=\"ow\">is</span> <span class=\"kc\">None</span> <span class=\"k\">else</span> <span class=\"nb\">str</span><span class=\"p\">(</span><span class=\"n\">metric</span><span class=\"p\">)</span><span class=\"o\">.</span><span class=\"n\">strip</span><span class=\"p\">()</span><span class=\"o\">.</span><span class=\"n\">lower</span><span class=\"p\">()</span>\n        <span class=\"k\">if</span> <span class=\"n\">text</span> <span class=\"ow\">not</span> <span class=\"ow\">in</span> <span class=\"n\">tm</span><span class=\"o\">.</span><span class=\"n\">METRIC_OPTIONS</span><span class=\"p\">:</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"metric '</span><span class=\"si\">{</span><span class=\"n\">metric</span><span class=\"si\">}</span><span class=\"s2\">' is unknown; using 'mae' (one of \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"s1\">', '</span><span class=\"o\">.</span><span class=\"n\">join</span><span class=\"p\">(</span><span class=\"n\">tm</span><span class=\"o\">.</span><span class=\"n\">METRIC_OPTIONS</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\">).\"</span>\n            <span class=\"p\">)</span>\n            <span class=\"n\">text</span> <span class=\"o\">=</span> <span class=\"s2\">\"mae\"</span>\n        <span class=\"k\">try</span><span class=\"p\">:</span>\n            <span class=\"n\">value</span> <span class=\"o\">=</span> <span class=\"n\">tm</span><span class=\"o\">.</span><span class=\"n\">compute_metric</span><span class=\"p\">(</span><span class=\"n\">text</span><span class=\"p\">,</span> <span class=\"n\">prediction</span><span class=\"p\">,</span> <span class=\"n\">target</span><span class=\"p\">)</span>\n        <span class=\"k\">except</span> <span class=\"p\">(</span><span class=\"ne\">ValueError</span><span class=\"p\">,</span> <span class=\"ne\">TypeError</span><span class=\"p\">)</span> <span class=\"k\">as</span> <span class=\"n\">error</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span><span class=\"sa\">f</span><span class=\"s2\">\"[Network &amp; Layers] Metrics (</span><span class=\"si\">{</span><span class=\"n\">text</span><span class=\"si\">}</span><span class=\"s2\">): </span><span class=\"si\">{</span><span class=\"n\">error</span><span class=\"si\">}</span><span class=\"s2\">\"</span><span class=\"p\">)</span> <span class=\"kn\">from</span><span class=\"w\"> </span><span class=\"nn\">error</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">value</span><span class=\"o\">.</span><span class=\"n\">reshape</span><span class=\"p\">(()))</span>\n"}, "TrainingEvaluate": {"id": "TrainingEvaluate", "name": "Evaluate", "cat": "Training", "desc": "Evaluates a model (nn_model) or a parameter set (PARAMS) on x/y: loss, metric and predictions, without training.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TrainingEvaluate</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Evaluates a model on ``x`` / ``y`` - forward only, no training.</span>\n\n<span class=\"sd\">    What: the read-only twin of a trainer. It runs the model (or a network</span>\n<span class=\"sd\">          rebuilt from a parameter set) on the data, and reports the loss, one</span>\n<span class=\"sd\">          metric and the raw predictions - the numbers a decision like \"is this</span>\n<span class=\"sd\">          checkpoint better\" needs, without spending a single optimizer step.</span>\n<span class=\"sd\">          No gradients are taken, the model is left untouched, and the</span>\n<span class=\"sd\">          parameters are never mutated, so the node can sit on the cached path</span>\n<span class=\"sd\">          of any workflow.</span>\n<span class=\"sd\">    In:   model (nn_model, optional) - a materialised ``nn.Module``, e.g. from</span>\n<span class=\"sd\">          ``Language Model Build`` / ``Language Model Train``. Takes precedence</span>\n<span class=\"sd\">          when both a model and parameters are wired.</span>\n<span class=\"sd\">          params (PARAMS, optional) - a parameter set with the trainer's naming</span>\n<span class=\"sd\">          convention (``layer0.weight``, ...): the MLP is rebuilt from the</span>\n<span class=\"sd\">          layer shapes (with ``activation`` between the hidden layers, exactly</span>\n<span class=\"sd\">          like ``Training Loop`` builds it) and the parameters are loaded in.</span>\n<span class=\"sd\">          x (TENSOR) - inputs. For a model: as the model expects it (a language</span>\n<span class=\"sd\">          model takes ``(N, L)`` token indices). For parameters:</span>\n<span class=\"sd\">          ``(N, in_features)`` or any shape whose last dimension is the feature</span>\n<span class=\"sd\">          dimension.</span>\n<span class=\"sd\">          y (TENSOR) - targets aligned with the model's *outputs*: per-position</span>\n<span class=\"sd\">          token indices for a language model (the Sliding Window ``(N,)``</span>\n<span class=\"sd\">          next-token form is also accepted, read exactly like in</span>\n<span class=\"sd\">          ``Language Model Train``), class indices / one-hot or same-shaped</span>\n<span class=\"sd\">          values otherwise.</span>\n<span class=\"sd\">          activation (COMBO) - the activation between the hidden layers of the</span>\n<span class=\"sd\">          rebuilt MLP (parameters path only); must match the network the</span>\n<span class=\"sd\">          parameters were trained with.</span>\n<span class=\"sd\">          loss (COMBO) - ``auto`` (the default) picks ``cross_entropy`` for</span>\n<span class=\"sd\">          class-index targets and ``mse`` for value targets; or one of the six</span>\n<span class=\"sd\">          explicit losses of the ``Loss`` node.</span>\n<span class=\"sd\">          metric (COMBO) - ``auto`` (the default) picks ``accuracy`` for</span>\n<span class=\"sd\">          class-index targets and ``mae`` for value targets; one of the six</span>\n<span class=\"sd\">          explicit metrics of the ``Metrics`` node; or ``none`` to skip the</span>\n<span class=\"sd\">          metric (the output is ``nan``).</span>\n<span class=\"sd\">    Out:  loss (TENSOR) - scalar, the selected loss of the evaluated pair.</span>\n<span class=\"sd\">          metric (TENSOR) - scalar, the selected metric (``nan`` for ``none``).</span>\n<span class=\"sd\">          prediction (TENSOR) - the model's raw outputs on ``x``, detached.</span>\n<span class=\"sd\">    Raises:</span>\n<span class=\"sd\">        ValueError: when neither ``model`` nor ``params`` is wired, when the</span>\n<span class=\"sd\">            parameter set cannot be rebuilt as an MLP, or when the data does</span>\n<span class=\"sd\">            not align with the model.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"TrainingEvaluate\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Evaluate\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Evaluates a model (nn_model) or a parameter set (PARAMS) on x/y: loss, metric and predictions, without training.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"s2\">\"evaluate\"</span><span class=\"p\">,</span> <span class=\"s2\">\"eval\"</span><span class=\"p\">,</span> <span class=\"s2\">\"test\"</span><span class=\"p\">,</span> <span class=\"s2\">\"validation\"</span><span class=\"p\">,</span> <span class=\"s2\">\"metric\"</span><span class=\"p\">,</span> <span class=\"s2\">\"loss\"</span><span class=\"p\">,</span>\n                <span class=\"s2\">\"score\"</span><span class=\"p\">,</span> <span class=\"s2\">\"perplexity\"</span><span class=\"p\">,</span> <span class=\"s2\">\"accuracy\"</span><span class=\"p\">,</span> <span class=\"s2\">\"benchmark\"</span><span class=\"p\">,</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NNModel</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"model\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"A materialised nn.Module to evaluate; takes precedence over 'params'.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Params</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"params\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"A trainer parameter set (layer0.weight, ...); its MLP is rebuilt and evaluated.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"x\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Inputs: a "id": "TrainingSaveParameters", "name": "Save Parameters", "cat": "Training", "desc": "Saves a parameter set as a .safetensors file in the output folder, and passes it through.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TrainingSaveParameters</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Writes a parameter set to a ``.safetensors`` file in ComfyUI's output folder.</span>\n\n<span class=\"sd\">    What: the file half of the persistence story - a trained parameter set becomes</span>\n<span class=\"sd\">          an ordinary checkpoint file that survives restarts, can be copied</span>\n<span class=\"sd\">          between machines and can be read back by ``Load Parameters``. The node</span>\n<span class=\"sd\">          also has an output, so it can sit in the middle of a chain: saving does</span>\n<span class=\"sd\">          not end the graph.</span>\n<span class=\"sd\">    In:   params (PARAMS) - the parameter set to write; anything a trainer or a</span>\n<span class=\"sd\">          ``Learnable Parameters`` node publishes.</span>\n<span class=\"sd\">          filename_prefix (STRING) - output subfolder and file stem, e.g.</span>\n<span class=\"sd\">          ``\"comfydl/parameters\"``; ``%date%`` style placeholders are supported,</span>\n<span class=\"sd\">          and a counter is appended (``parameters_00001_.safetensors``) so an</span>\n<span class=\"sd\">          earlier save is never overwritten.</span>\n<span class=\"sd\">    Out:  params (PARAMS) - the same set, passed through unchanged so the graph</span>\n<span class=\"sd\">          can continue to use it.</span>\n<span class=\"sd\">          path (STRING) - absolute path of the file that was written; paste it</span>\n<span class=\"sd\">          into the ``path`` widget of ``Load Parameters`` (or read it from the</span>\n<span class=\"sd\">          log) to read the set back later.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"TrainingSaveParameters\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Save Parameters\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Saves a parameter set as a .safetensors file in the output folder, and passes it through.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">is_output_node</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"s2\">\"save\"</span><span class=\"p\">,</span> <span class=\"s2\">\"write\"</span><span class=\"p\">,</span> <span class=\"s2\">\"checkpoint\"</span><span class=\"p\">,</span> <span class=\"s2\">\"safetensors\"</span><span class=\"p\">,</span> <span class=\"s2\">\"export\"</span><span class=\"p\">,</span>\n                <span class=\"s2\">\"trainable parameters\"</span><span class=\"p\">,</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Params</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"params\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Parameter set to write to disk.\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"filename_prefix\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"n\">DEFAULT_FILE_PREFIX</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Output subfolder and file stem; a counter is appended to keep earlier saves.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Params</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"params\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"path\"</span><span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">params</span><span class=\"p\">,</span> <span class=\"n\">filename_prefix</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"n\">DEFAULT_FILE_PREFIX</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">payload</span> <span class=\"o\">=</span> <span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">as_parameter_dict</span><span class=\"p\">(</span><span class=\"n\">params</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"ow\">not</span> <span class=\"n\">payload</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"s2\">\"[Network &amp; Layers] Save Parameters received an empty parameter set; \"</span>\n                <span class=\"s2\">\"nothing would be written.\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"n\">output_path</span> <span class=\"o\">=</span> <span class=\"n\">_save_parameter_file</span><span class=\"p\">(</span>\n            <span class=\"n\">payload</span><span class=\"p\">,</span> <span class=\"n\">_text</span><span class=\"p\">(</span><span class=\"n\">filename_prefix</span><span class=\"p\">,</span> <span class=\"n\">DEFAULT_FILE_PREFIX</span><span class=\"p\">)</span>\n        <span class=\"p\">)</span>\n        <span class=\"nb\">print</span><span class=\"p\">(</span>\n            <span class=\"sa\">f</span><span class=\"s2\">\"[Network &amp; Layers] Save Parameters: wrote </span><span class=\"si\">{</span><span class=\"nb\">len</span><span class=\"p\">(</span><span class=\"n\">payload</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\"> tensor(s) / \"</span>\n            <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">parameter_count</span><span class=\"p\">(</span><span class=\"n\">payload</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\"> value(s) to </span><span class=\"si\">{</span><span class=\"n\">output_path</span><span class=\"si\">}</span><span class=\"s2\">\"</span>\n        <span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">payload</span><span class=\"p\">,</span> <span class=\"n\">output_path</span><span class=\"p\">)</span>\n"}, "TrainingLoadParameters": {"id": "TrainingLoadParameters", "name": "Load Parameters", "cat": "Training", "desc": "Reads a parameter set from a .safetensors file (relative to the output folder, or absolute).", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TrainingLoadParameters</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Reads a parameter set back from a ``.safetensors`` file.</span>\n\n<span class=\"sd\">    What: the other half of the persistence story, and the way a trained set is</span>\n<span class=\"sd\">          reused in a later session: the file is read into ordinary parameters</span>\n<span class=\"sd\">          (float32, ``requires_grad``) so it can warm start a trainer, feed</span>\n<span class=\"sd\">          ``Parameters to Tensor``, or be re-saved somewhere else.</span>\n<span class=\"sd\">    In:   path (STRING) - the file to read. A relative path is resolved against</span>\n<span class=\"sd\">          ComfyUI's *output* folder (which is where ``Save Parameters`` writes),</span>\n<span class=\"sd\">          an absolute path is used as it is. The default points at the first file</span>\n<span class=\"sd\">          ``Save Parameters`` writes, so \"save, then load\" works without typing.</span>\n<span class=\"sd\">    Out:  params (PARAMS) - every floating point tensor of the file, keyed by its</span>\n<span class=\"sd\">          key in the file. Integer / non tensor entries are reported and dropped,</span>\n<span class=\"sd\">          because only floating point tensors can be trained; tensors that are</span>\n<span class=\"sd\">          not float32 are promoted, also with a report.</span>\n<span class=\"sd\">    Raises:</span>\n<span class=\"sd\">        ValueError: when the file does not exist or holds no usable tensor; the</span>\n<span class=\"sd\">            message carries the resolved absolute path.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"TrainingLoadParameters\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Load Parameters\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Reads a parameter set from a .safetensors file (relative to the output folder, or absolute).\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"s2\">\"load\"</span><span class=\"p\">,</span> <span class=\"s2\">\"read\"</span><span class=\"p\">,</span> <span class=\"s2\">\"checkpoint\"</span><span class=\"p\">,</span> <span class=\"s2\">\"safetensors\"</span><span class=\"p\">,</span> <span class=\"s2\">\"import\"</span><span class=\"p\">,</span>\n                <span class=\"s2\">\"trainable parameters\"</span><span class=\"p\">,</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"path\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"n\">DEFAULT_LOAD_PATH</span><span class=\"p\">,</span>\n                    <span class=\"n\">placeholder</span><span class=\"o\">=</span><span class=\"s2\">\"e.g. comfydl/parameters_00001_.safetensors\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"File to read; relative to the output folder, or absolute.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Params</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"params\"</span><span class=\"p\">)],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">path</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"n\">DEFAULT_LOAD_PATH</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">resolved</span> <span class=\"o\">=</span> <span class=\"n\">_resolve_parameter_path</span><span class=\"p\">(</span><span class=\"n\">path</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"ow\">not</span> <span class=\"n\">os</span><span class=\"o\">.</span><span class=\"n\">path</span><span class=\"o\">.</span><span class=\"n\">isfile</span><span class=\"p\">(</span><span class=\"n\">resolved</span><span class=\"p\">):</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"[Network &amp; Layers] Load Parameters found no file at </span><span class=\"si\">{</span><span class=\"n\">resolved</span><span class=\"si\">}</span><span class=\"s2\">; run \"</span>\n                <span class=\"s2\">\"'Save Parameters' first, or fix the 'path' widget (relative paths \"</span>\n                <span class=\"s2\">\"start at the output folder).\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"n\">state</span> <span class=\"o\">=</span> <span class=\"n\">comfy</span><span class=\"o\">.</span><span class=\"n\">utils</span><span class=\"o\">.</span><span class=\"n\">load_torch_file</span><span class=\"p\">(</span><span class=\"n\">resolved</span><span class=\"p\">,</span> <span class=\"n\">safe_load</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">)</span>\n        <span class=\"n\">payload</span><span class=\"p\">,</span> <span class=\"n\">dropped</span><span class=\"p\">,</span> <span class=\"n\">converted</span> <span class=\"o\">=</span> <span class=\"n\">_parameters_from_state</span><span class=\"p\">(</span><span class=\"n\">state</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">dropped</span><span class=\"p\">:</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"nb\">len</span><span class=\"p\">(</span><span class=\"n\">dropped</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\"> entry / entries in </span><span class=\"si\">{</span><span class=\"n\">resolved</span><span class=\"si\">}</span><span class=\"s2\"> are not floating point \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"tensors and cannot be trained: \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">parameter_names</span><span class=\"p\">({</span><span class=\"n\">name</span><span class=\"p\">:</span><span class=\"w\"> </span><span class=\"kc\">None</span><span class=\"w\"> </span><span class=\"k\">for</span><span class=\"w\"> </span><span class=\"n\">name</span><span class=\"w\"> </span><span class=\"ow\">in</span><span class=\"w\"> </span><span class=\"n\">dropped</span><span class=\"p\">},</span><span class=\"w\"> </span><span class=\"n\">NAME_PREVIEW</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\">\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">converted</span><span class=\"p\">:</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"nb\">len</span><span class=\"p\">(</span><span class=\"n\">converted</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\"> entry / entries in </span><span class=\"si\">{</span><span class=\"n\">resolved</span><span class=\"si\">}</span><span class=\"s2\"> were promoted to \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"float32: </span><span class=\"si\">{</span><span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">parameter_names</span><span class=\"p\">({</span><span class=\"n\">name</span><span class=\"p\">:</span><span class=\"w\"> </span><span class=\"kc\">None</span><span class=\"w\"> </span><span class=\"k\">for</span><span class=\"w\"> </span><span class=\"n\">name</span><span class=\"w\"> </span><span class=\"ow\">in</span><span class=\"w\"> </span><span class=\"n\">converted</span><span class=\"p\">},</span><span class=\"w\"> </span><span class=\"n\">NAME_PREVIEW</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\">\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"ow\">not</span> <span class=\"n\">payload</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"[Network &amp; Layers] Load Parameters found no trainable tensor in \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"n\">resolved</span><span class=\"si\">}</span><span class=\"s2\">.\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"nb\">print</span><span class=\"p\">(</span>\n            <span class=\"sa\">f</span><span class=\"s2\">\"[Network &amp; Layers] Load Parameters: read </span><span class=\"si\">{</span><span class=\"nb\">len</span><span class=\"p\">(</span><span class=\"n\">payload</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\"> tensor(s) / \"</span>\n            <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">parameter_count</span><span class=\"p\">(</span><span class=\"n\">payload</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\"> value(s) from </span><span class=\"si\">{</span><span class=\"n\">resolved</span><span class=\"si\">}</span><span class=\"s2\">\"</span>\n        <span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">payload</span><span class=\"p\">)</span>\n"}, "TrainingParametersToText": {"id": "TrainingParametersToText", "name": "Parameters to Text", "cat": "Training", "desc": "Encodes a parameter set into copyable text (CDLPARAMS1:<base64>) that survives inside a workflow file.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TrainingParametersToText</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Encodes a parameter set as text, so it can be carried by a widget.</span>\n\n<span class=\"sd\">    What: the widget half of the persistence story, and the reason a trained set</span>\n<span class=\"sd\">          can survive inside a saved ``.json`` workflow without any file: the</span>\n<span class=\"sd\">          parameters are written into a ``safetensors`` blob and base64 encoded.</span>\n<span class=\"sd\">          The node is an output node and also pushes the text into its own UI, so</span>\n<span class=\"sd\">          the value can simply be copied out of the node and pasted into the</span>\n<span class=\"sd\">          ``text`` widget of a ``Text to Parameters`` node.</span>\n<span class=\"sd\">    In:   params (PARAMS) - the parameter set to encode.</span>\n<span class=\"sd\">    Out:  text (STRING) - ``CDLPARAMS1:&lt;base64&gt;``; paste it into ``Text to</span>\n<span class=\"sd\">          Parameters``. Long sets produce long text - for anything larger than a</span>\n<span class=\"sd\">          few thousand values prefer ``Save Parameters`` / ``Load Parameters``.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"TrainingParametersToText\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Parameters to Text\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Encodes a parameter set into copyable text (CDLPARAMS1:&lt;base64&gt;) that survives inside a workflow file.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">is_output_node</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"encode\"</span><span class=\"p\">,</span> <span class=\"s2\">\"text\"</span><span class=\"p\">,</span> <span class=\"s2\">\"base64\"</span><span class=\"p\">,</span> <span class=\"s2\">\"copy\"</span><span class=\"p\">,</span> <span class=\"s2\">\"share\"</span><span class=\"p\">,</span> <span class=\"s2\">\"inline\"</span><span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Params</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"params\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Parameter set to encode as text.\"</span><span class=\"p\">)],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"text\"</span><span class=\"p\">)],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">params</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">payload</span> <span class=\"o\">=</span> <span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">as_parameter_dict</span><span class=\"p\">(</span><span class=\"n\">params</span><span class=\"p\">)</span>\n        <span class=\"n\">text</span> <span class=\"o\">=</span> <span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">encode_parameters</span><span class=\"p\">(</span><span class=\"n\">payload</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"nb\">len</span><span class=\"p\">(</span><span class=\"n\">text</span><span class=\"p\">)</span> <span class=\"o\">&lt;=</span> <span class=\"mi\">4000</span><span class=\"p\">:</span>\n            <span class=\"nb\">print</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"[Network &amp; Layers] Parameters to Text (</span><span class=\"si\">{</span><span class=\"nb\">len</span><span class=\"p\">(</span><span class=\"n\">payload</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\"> tensor(s) / \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">parameter_count</span><span class=\"p\">(</span><span class=\"n\">payload</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\"> value(s)):</span><span class=\"se\">\\n</span><span class=\"si\">{</span><span class=\"n\">text</span><span class=\"si\">}</span><span class=\"s2\">\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"k\">else</span><span class=\"p\">:</span>\n            <span class=\"nb\">print</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"[Network &amp; Layers] Parameters to Text: </span><span class=\"si\">{</span><span class=\"nb\">len</span><span class=\"p\">(</span><span class=\"n\">payload</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\"> tensor(s) / \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">parameter_count</span><span class=\"p\">(</span><span class=\"n\">payload</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\"> value(s) encoded into </span><span class=\"si\">{</span><span class=\"nb\">len</span><span class=\"p\">(</span><span class=\"n\">text</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\"> \"</span>\n                <span class=\"s2\">\"characters; copy the text from the node's own output box (too long \"</span>\n                <span class=\"s2\">\"to print - prefer Save Parameters / Load Parameters for big sets).\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">text</span><span class=\"p\">,</span> <span class=\"n\">ui</span><span class=\"o\">=</span><span class=\"p\">{</span><span class=\"s2\">\"text\"</span><span class=\"p\">:</span> <span class=\"p\">[</span><span class=\"n\">text</span><span class=\"p\">]})</span>\n"}, "TrainingTextToParameters": {"id": "TrainingTextToParameters", "name": "Text to Parameters", "cat": "Training", "desc": "Decodes text produced by 'Parameters to Text' back into a trainable parameter set.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TrainingTextToParameters</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Decodes the text form of a parameter set back into ``PARAMS``.</span>\n\n<span class=\"sd\">    What: the reading end of the widget channel. Paste the ``text`` output of a</span>\n<span class=\"sd\">          ``Parameters to Text`` node into this node's widget - or keep the</span>\n<span class=\"sd\">          default, which is a valid tiny parameter set - and it comes back as a</span>\n<span class=\"sd\">          trainable parameter set.</span>\n<span class=\"sd\">    In:   text (STRING) - ``CDLPARAMS1:&lt;base64&gt;`` as produced by ``Parameters to</span>\n<span class=\"sd\">          Text``; surrounding whitespace and line breaks are ignored, and the</span>\n<span class=\"sd\">          header may be omitted when only the base64 body was copied.</span>\n<span class=\"sd\">    Out:  params (PARAMS) - the decoded parameters, as float32 ``requires_grad``</span>\n<span class=\"sd\">          tensors keyed by their original names.</span>\n<span class=\"sd\">    Raises:</span>\n<span class=\"sd\">        ValueError: when the text is empty, is not valid base64, or does not</span>\n<span class=\"sd\">            decode into a ``safetensors`` payload; the message says what to paste.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"TrainingTextToParameters\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Text to Parameters\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Decodes text produced by 'Parameters to Text' back into a trainable parameter set.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"decode\"</span><span class=\"p\">,</span> <span class=\"s2\">\"text\"</span><span class=\"p\">,</span> <span class=\"s2\">\"base64\"</span><span class=\"p\">,</span> <span class=\"s2\">\"paste\"</span><span class=\"p\">,</span> <span class=\"s2\">\"inline\"</span><span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"text\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"n\">DEFAULT_PARAMS_TEXT</span><span class=\"p\">,</span>\n                    <span class=\"n\">multiline</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Text produced by 'Parameters to Text'; the default is a valid 2x3 'weight'.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Params</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"params\"</span><span class=\"p\">)],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">text</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"n\">DEFAULT_PARAMS_TEXT</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">try</span><span class=\"p\">:</span>\n            <span class=\"n\">state</span> <span class=\"o\">=</span> <span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">decode_parameters</span><span class=\"p\">(</span><span class=\"n\">text</span><span class=\"p\">)</span>\n        <span class=\"k\">except</span> <span class=\"ne\">ValueError</span> <span class=\"k\">as</span> <span class=\"n\">error</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span><span class=\"sa\">f</span><span class=\"s2\">\"[Network &amp; Layers] Text to Parameters: </span><span class=\"si\">{</span><span class=\"n\">error</span><span class=\"si\">}</span><span class=\"s2\">\"</span><span class=\"p\">)</span> <span class=\"kn\">from</span><span class=\"w\"> </span><span class=\"nn\">error</span>\n        <span class=\"n\">payload</span><span class=\"p\">,</span> <span class=\"n\">dropped</span><span class=\"p\">,</span> <span class=\"n\">converted</span> <span class=\"o\">=</span> <span class=\"n\">_parameters_from_state</span><span class=\"p\">(</span><span class=\"n\">state</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">dropped</span><span class=\"p\">:</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class \">{</span><span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">parameter_count</span><span class=\"p\">(</span><span class=\"n\">payload</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\"> value(s)\"</span>\n            <span class=\"o\">+</span> <span class=\"p\">(</span><span class=\"sa\">f</span><span class=\"s2\">\" (</span><span class=\"si\">{</span><span class=\"nb\">len</span><span class=\"p\">(</span><span class=\"n\">converted</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\"> promoted to float32)\"</span> <span class=\"k\">if</span> <span class=\"n\">converted</span> <span class=\"k\">else</span> <span class=\"s2\">\"\"</span><span class=\"p\">)</span>\n        <span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">payload</span><span class=\"p\">)</span>\n"}}</script>

<script>
console.info('[N&L] init');
var DATA, CATS;
try {
  DATA = JSON.parse(document.getElementById('nl-data').textContent);
  CATS = JSON.parse(document.getElementById('nl-cats').textContent);
  console.info('[N&L] data loaded:', Object.keys(DATA).length, 'nodes,',
                CATS.length, 'categories');
} catch (err) {
  console.error('[N&L] data load failed:', err);
}
var ov = document.getElementById('ov'), card = document.getElementById('ov-card');
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function openOv(html){
  card.innerHTML = '<button class="ov-x" type="button">\u00d7</button>' + html;
  card.querySelector('.ov-x').addEventListener('click', closeOv);
  ov.classList.add('show');
  console.info('[N&L] overlay opened');
}
function closeOv(){ ov.classList.remove('show'); }
ov.addEventListener('click', function(e){ if (e.target === ov) closeOv(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeOv(); });
function nodeHtml(n){
  return '<span class="ov-tag">' + esc(n.cat) + '</span>'
    + '<h2 class="ov-name">' + esc(n.name) + '</h2>'
    + '<p class="ov-id">' + esc(n.id) + '</p>'
    + '<p class="ov-desc">' + esc(n.desc) + '</p>'
    + '<div class="ov-src"><h3>Source</h3>'
    + '<pre class="codehl">' + n.code + '</pre></div>';
}
function catHtml(c){
  var rows = c.ids.map(function(id){
    var n = DATA[id];
    return '<div class="ov-row"><div class="rn">' + esc(n.name)
      + '<small>' + esc(n.id) + '</small></div>'
      + '<div class="rd">' + esc(n.desc) + '</div></div>';
  }).join('');
  return '<span class="ov-tag">' + esc(c.name) + '</span>'
    + '<h2 class="ov-name">' + esc(c.name) + '</h2>'
    + '<p class="ov-desc">' + esc(c.blurb) + '</p>' + rows;
}
var nChips = 0, nHeads = 0;
document.querySelectorAll('.chip[data-node]').forEach(function (chip) {
  nChips++;
  chip.addEventListener('click', function () {
    console.info('[N&L] node click:', chip.getAttribute('data-node'));
    openOv(nodeHtml(DATA[chip.getAttribute('data-node')]));
  });
});
document.querySelectorAll('.chead[data-cat]').forEach(function (head) {
  nHeads++;
  head.addEventListener('click', function () {
    var meta = CATS.filter(function (c) {
      return c.name === head.getAttribute('data-cat');
    })[0];
    console.info('[N&L] category click:', head.getAttribute('data-cat'));
    openOv(catHtml(meta));
  });
});
console.info('[N&L] listeners attached:', nChips, 'node chips,', nHeads, 'categories');
</script>
</div>
</body>
</html>

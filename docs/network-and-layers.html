">:</span>\n        <span class=\"k\">if</span> <span class=\"n\">weight</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">()</span> <span class=\"o\">&lt;</span> <span class=\"mi\">1</span><span class=\"p\">:</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"s2\">\"WeightNorm received a 0-dim weight; returning it unchanged.\"</span><span class=\"p\">)</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">weight</span><span class=\"p\">)</span>\n        <span class=\"n\">norm</span> <span class=\"o\">=</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">linalg</span><span class=\"o\">.</span><span class=\"n\">vector_norm</span><span class=\"p\">(</span><span class=\"n\">weight</span><span class=\"p\">,</span> <span class=\"n\">dim</span><span class=\"o\">=</span><span class=\"n\">_clamp_dim</span><span class=\"p\">(</span><span class=\"n\">dim</span><span class=\"p\">,</span> <span class=\"n\">weight</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">()),</span> <span class=\"n\">keepdim</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">)</span><span class=\"o\">.</span><span class=\"n\">clamp_min</span><span class=\"p\">(</span><span class=\"n\">eps</span><span class=\"p\">)</span>\n        <span class=\"n\">output</span> <span class=\"o\">=</span> <span class=\"n\">weight</span> <span class=\"o\">/</span> <span class=\"n\">norm</span>\n        <span class=\"k\">if</span> <span class=\"n\">g</span> <span class=\"ow\">is</span> <span class=\"ow\">not</span> <span class=\"kc\">None</span><span class=\"p\">:</span>\n            <span class=\"n\">output</span> <span class=\"o\">=</span> <span class=\"n\">output</span> <span class=\"o\">*</span> <span class=\"n\">g</span>\n        <span clas      unconnected for the deterministic default.</span>\n<span class=\"sd\">          n_power_iterations (INT) - how many refinement steps to run; the default 10</span>\n<span class=\"sd\">          sits close to the true largest singular value, while 1 already gives a usable</span>\n<span class=\"sd\">          estimate and skips 9 matrix-vector products.</span>\n<span class=\"sd\">          dim (INT) - dimension that counts as \"rows\", clamped to the weight rank.</span>\n<span class=\"sd\">          eps (FLOAT) - lower bound applied to the estimated value, so a weight that is</span>\n<span class=\"sd\">          numerically zero cannot divide by zero.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - the re-parameterized weight, same shape as ``weight``.</span>\n<span class=\"sd\">          sigma (TENSOR) - the estimated largest singular value, so it can be inspected</span>\n<span class=\"sd\">          or multiplied back with a soft scale. A weight with rank below 2 is returned</span>\n<span class=\"sd\">          unchanged with ``sigma = 0``.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"NormalizationSpectralNorm\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"SpectralNorm\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">NORMALIZATION_CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Divide a weight by an estimate of its largest singular value (deterministic power iteration).\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"spectral normalization\"</span><span class=\"p\">,</span> <span class=\"s2\">\"largest singular value\"</span><span class=\"p\">,</span> <span class=\"s2\">\"power iteration\"</span><span class=\"p\">,</span> <span class=\"s2\">\"lipschitz\"</span><span class=\"p\">,</span> <span class=\"s2\">\"gan\"</span><span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"weight\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Weight of shape (..., m, n).\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"u\"</span><span class=\"p\">,</span> <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional left singular vector of length m; unconnected uses the deterministic default.\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span cl s=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">if</span> <span class=\"n\">weight</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">()</span> <span class=\"o\">&lt;</span> <span class=\"mi\">2</span><span class=\"p\">:</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"s2\">\"SpectralNorm needs a weight with at least two dimensions; returning it unchanged.\"</span><span class=\"p\">)</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">weight</span><span class=\"p\">,</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">zeros</span><span class=\"p\">((),</span> <span class=\"n\">dtype</span><span class=\"o\">=</span><span class=\"n\">weight</span><span class=\"o\">.</span><span class=\"n\">dtype</span><span class=\"p\">,</span> <span class=\"n\">device</span><span class=\"o\">=</span><span class=\"n\">weight</span><span class=\"o\">.</span><span class=\"n\">device</span><span class=\"p\">))</span>\n        <span class=\"n\">axis</span> <span class=\"o\">=</span> <span class=\"n\">_clamp_dim</span><span class=\"p\">(</span><span class=\"n\">dim</span><span class=\"p\">,</span> <span class=\"n\">weight</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">())</span>\n        <span class=\"n\">matrix</span> <span class=\"o\">=</span> <span class=\"n\">weight</span><span class=\"o\">.</span><span class=\"n\">movedim</span><span class=\"p\">(</span><span class=\"n\">axis</span><span class=\"p\">,</span> <span class=\"mi\">0</span><span class=\"p\">)</span><span class=\"o\">.</span><span class=\"n\">reshape</span><span class=\"p\">(</span><span class=\"n\">weight</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">[</span><span class=\"n\">axis</span><span class=\"p\">],</span> <span class=\"o\">-</span><span class=\"mi\">1</span><span class=\"p\">)</span>\n        <span class=\"n\">left</span> <span class=\"o\">=</span> <span class=\"n\">_unit_vector</span><span class=\"p\">(</span><span class=\"n\">_matrix_vector</span><span class=\"p\">(</span><span class=\"n\">u</span><span class=\"p\">,</span> <span class=\"n\">matrix</span><span class=\"o\">.</span><span class=\"n\">sum</span><span class=\"p\">(</span><span class=\"n\">dim</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">)),</span> <span class=\"n\">eps</span><span class=\"p\">)</span>\n        <span class=\"n\">right</span> <span class=\"o\">=</span> <span class=\"n\">_unit_vector</span><span class=\"p\">(</span><span class=\"n\">_matrix_vector</span><span class=\"p\">(</span><span class=\"n\">v</span><span class=\"p\">,</span> <span class=\"n\">matrix</span><span class=\"o\">.</span><span class=\"n\">sum</span><span class=\"p\">(</span><span class=\"n\">dim</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">)),</span> <span class=\"n\">eps</span><span class=\"p\">)</span>\n        <span class=\"k\">for</span> <span class=\"n\">_</span> <span class=\"ow\">in</span> <span class=\"nb\">range</span><span class=\"p\">(</span><span class=\"nb\">max</span><span class=\"p\">(</span><span class=\"mi\">0</span><span class=\"p\">,</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">n_power_iterations</span><span class=\"p\">))):</span>\n            <span class=\"n\">left</span> <span class=\"o\">=</span> <span class=\"n\">_unit_vector</span><span class=\"p\">(</span><span class=\"n\">matrix</span> <span class=\"o\">@</span> <span class=\"n\">right</span><span class=\"p\">,</span> <span class=\"n\">eps</span><span class=\"p\">)</span>\n            <span class=\"n\">right</span> <span class=\"o\">=</span> <span class=\"n\">_unit_vector</span><span class=\"p\">(</span><span class=\"n\">matrix</span><span class=\"o\">.</span><span class=\"n\">mT</span> <span class=\"o\">@</span> <span class=\"n\">left</span><span class=\"p\">,</span> <span class=\"n\">eps</span><span class=\"p\">)</span>\n        <span class=\"n\">sigma</span> <span class=\"o\">=</span> <span class=\"p\">(</span><span class=\"n\">left</span> <span class=\"o\">@</span> <span class=\"p\">(</span><span class=\"n\">matrix</span> <span class=\"o\">@</span> <span class=\"n\">right</span><span class=\"p\">))</span><span class=\"o\">.</span><span class=\"n\">abs</span><span class=\"p\">()</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">weight</span> <span class=\"o\">/</span> <span class=\"n\">sigma</span><span class=\"o\">.</span><span class=\"n\">clamp_min</span><span class=\"p\">(</span><span class=\"n\">eps</span><span class=\"p\">),</span> <span class=\"n\">sigma</span><span class=\"p\">)</span>\n"}, "TrainingMode": {"id": "TrainingMode", "name": "Training Mode", "cat": "Training", "desc": "Publishes train/eval to every node whose mode slot is linked to it; flip it to switch a graph between training and inference.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TrainingMode</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Declares whether the graph currently trains or infers, for every node linked to it.</span>\n\n<span class=\"sd\">    What: a single dropdown that fans out to the whole graph. The node computes</span>\n<span class=\"sd\">          nothing itself - it publishes the choice as a STRING, and the normalization</span>\n<span class=\"sd\">          nodes read it through their ``mode`` slot. Because the link is part of</span>\n<span class=\"sd\">          ComfyUI's cache signature, flipping the dropdown invalidates every consumer,</span>\n<span class=\"sd\">          so the graph genuinely re-runs instead of replaying cached outputs.</span>\n<span class=\"sd\">    In:   mode (COMBO) - ``train`` normalizes with the statistics of the current call</span>\n<span class=\"sd\">          and ignores the wired ``running_mean`` / ``running_var`` (the PyTorch</span>\n<span class=\"sd\">          default); ``eval`` normalizes with the wired statistics.</span>\n<span class=\"sd\">    Out:  mode (STRING) - the selected mode, to be linked into ``mode`` slots.</span>\n<span class=\"sd\">          Placing this node without linking anything is harmless: it is only</span>\n<span class=\"sd\">          evaluated when a consumer asks for it.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"TrainingMode\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Training Mode\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">TRAINING_CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Publishes train/eval to every node whose mode slot is linked to it; flip it to switch a graph between training and inference.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"train\"</span><span class=\"p\">,</span> <span class=\"s2\">\"eval\"</span><span class=\"p\">,</span> <span class=\"s2\">\"inference\"</span><span class=\"p\">,</span> <span class=\"s2\">\"mode\"</span><span class=\"p\">,</span> <span class=\"s2\">\"batchnorm\"</span><span class=\"p\">,</span> <span class=\"s2\">\"state\"</span><span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Combo</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"mode\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">options</span><span class=\"o\">=</span><span class=\"nb\">list</span><span class=\"p\">(</span><span class=\"n\">MODE_OPTIONS</span><span class=\"p\">),</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"n\">MODE_TRAIN</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"train: use the statistics of the current call. eval: use the running statistics wired into the consumer.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"mode\"</span><span class=\"p\">)],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">mode</span><span class=\"p\">:</span> <span class=\"nb\">str</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">_normalize_mode</span><span class=\"p\">(</span><span class=\"n\">mode</span><span class=\"p\">))</span>\n"}, "TrainingRunStats": {"id": "TrainingRunStats", "name": "Training Run Stats", "cat": "Training", "desc": "Editable running_mean / running_var for eval mode; wire the outputs into the running stat slots of BatchNorm / InstanceNorm.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TrainingRunStats</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Carries ``running_mean`` / ``running_var`` across runs, as numbers or as links.</span>\n\n<span class=\"sd\">    What: the persistent half of the train/eval switch. A widget is what survives in a</span>\n<span class=\"sd\">          saved workflow, so both statistics can be typed in as comma separated numbers</span>\n<span class=\"sd\">          and are emitted as 1-D tensors; wire the outputs into the ``running_mean`` /</span>\n<span class=\"sd\">          ``running_var`` slots of a BatchNorm / InstanceNorm node.</span>\n<span class=\"sd\">          Both statistics can also be *linked* instead of typed: BatchNorm and</span>\n<span class=\"sd\">          InstanceNorm export the per-channel statistics they normalized with, and a</span>\n<span class=\"sd\">          link wins over the widget, so the numbers of a run can be handed forward</span>\n<span class=\"sd\">          without ever being copied by hand.</span>\n<span class=\"sd\">    In:   running_mean (STRING) - per-channel means, e.g. ``\"0.0\"`` or ``\"0.1,0.2,0.3\"``.</span>\n<span class=\"sd\">          running_var (STRING) - per-channel variances, e.g. ``\"1.0\"``.</span>\n<span class=\"sd\">          mean (TENSOR, optional) - link the ``mean`` output of a BatchNorm /</span>\n<span class=\"sd\">          InstanceNorm here; overrides the ``running_mean`` text above.</span>\n<span class=\"sd\">          var (TENSOR, optional) - link the ``var`` output here; overrides</span>\n<span class=\"sd\">          ``running_var``.</span>\n<span class=\"sd\">    Out:  running_mean (TENSOR) - 1-D tensor with the means (linked value, else parsed).</span>\n<span class=\"sd\">          running_var (TENSOR) - 1-D tensor with the variances.</span>\n<span class=\"sd\">          One value is broadcast to every channel by the consumer, a value per channel</span>\n<span class=\"sd\">          is used as is. Text that cannot be parsed falls back to ``0.0`` / ``1.0``</span>\n<span class=\"sd\">          with a warning, so a typo cannot break a workflow.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"TrainingRunStats\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Training Run Stats\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">TRAINING_CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Editable running_mean / running_var for eval mode; wire the outputs into the running stat slots of BatchNorm / InstanceNorm.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"running mean\"</span><span class=\"p\">,</span> <span class=\"s2\">\"running var\"</span><span class=\"p\">,</span> <span class=\"s2\">\"ema\"</span><span class=\"p\">,</span> <span class=\"s2\">\"statistics\"</span><span class=\"p\">,</span> <span class=\"s2\">\"state\"</span><span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"running_mean\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"0.0\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">placeholder</span><span class=\"o\">=</span><span class=\"s2\">\"e.g. 0.1,0.2,0.3\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Per-channel means as comma separated numbers; a single value is broadcast to every channel.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"running_var\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"1.0\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">placeholder</span><span class=\"o\">=</span><span class=\"s2\">\"e.g. 1.0,1.0,1.0\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Per-channel variances as comma separated numbers; a single value is broadcast to every channel.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"mean\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional per-channel mean linked from a BatchNorm / InstanceNorm 'mean' output; overrides the running_mean text above.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"var\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional per-channel variance linked from a BatchNorm / InstanceNorm 'var' output; overrides the running_var text above.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"running_mean\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"running_var\"</span><span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">running_mean</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"s2\">\"0.0\"</span><span class=\"p\">,</span>\n        <span class=\"n\">running_var</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"s2\">\"1.0\"</span><span class=\"p\">,</span>\n        <span class=\"n\">mean</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">var</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span>\n            <span class=\"n\">_linked_stats</span><span class=\"p\">(</span><span class=\"n\">mean</span><span class=\"p\">,</span> <span class=\"n\">running_mean</span><span class=\"p\">,</span> <span class=\"s2\">\"running_mean\"</span><span class=\"p\">,</span> <span class=\"mf\">0.0</span><span class=\"p\">),</span>\n            <span class=\"n\">_linked_stats</span><span class=\"p\">(</span><span class=\"n\">var</span><span class=\"p\">,</span> <span class=\"n\">running_var</span><span class=\"p\">,</span> <span class=\"s2\">\"running_var\"</span><span class=\"p\">,</span> <span class=\"mf\">1.0</span><span class=\"p\">),</span>\n        <span class=\"p\">)</span>\n"}, "RegularizationDropout": {"id": "RegularizationDropout", "name": "Dropout", "cat": "Regularization", "desc": "Zero each element with probability p and rescale the rest by 1/(1-p); eval mode passes the input through.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">RegularizationDropout</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Element-wise dropout: ``F.dropout``.</span>\n\n<span class=\"sd\">    What: zeroes each element of the input independently with probability ``p`` and</span>\n<span class=\"sd\">          divides the surviving elements by ``1 - p``, so the expectation of the output</span>\n<span class=\"sd\">          equals the input (the ``torch.nn.Dropout`` semantics used to regularize a</span>\n<span class=\"sd\">          training run, and a ready source of stochastic masks in general).</span>\n<span class=\"sd\">          The mask is drawn element by element, so one node covers every rank -</span>\n<span class=\"sd\">          ``(N, C)``, ``(N, C, H, W)`` or a bare scalar - with no 1d/2d/3d flavour to</span>\n<span class=\"sd\">          pick. This is the plain element-wise dropout; the channel-wise variant some</span>\n<span class=\"sd\">          recurrent networks use is a different operation and a different node.</span>\n<span class=\"sd\">          The draw is seeded: the same ``seed`` and ``p`` reproduce the mask bit for</span>\n<span class=\"sd\">          bit, which keeps ComfyUI's caching meaningful (an unchanged graph returns the</span>\n<span class=\"sd\">          cached output instead of a fresh mask). The \"control after generate\"</span>\n<span class=\"sd\">          dropdown next to the seed widget is what moves the seed between runs - set it</span>\n<span class=\"sd\">          to \"randomize\" for a new mask every run, \"fixed\" to freeze the mask.</span>\n<span class=\"sd\">          Nothing is stored in the node and the input is never written to, because the</span>\n<span class=\"sd\">          same tensor may be shared with other nodes.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - input of any shape; dtype/device preserved.</span>\n<span class=\"sd\">          p (FLOAT) - probability that an element is dropped, 0 to 1. ``0`` passes the</span>\n<span class=\"sd\">          input through unchanged, ``1`` returns zeros.</span>\n<span class=\"sd\">          seed (INT) - seed of the mask draw; only used in ``train`` mode.</span>\n<span class=\"sd\">          mode (STRING, optional) - link the ``mode`` output of a Training Mode node;</span>\n<span class=\"sd\">          unconnected means ``train``. In ``eval`` mode the input is passed straight</span>\n<span class=\"sd\">          through, which makes a Dropout left in an inference graph harmless.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same shape/dtype/device as ``tensor``.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"RegularizationDropout\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Dropout\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">REGULARIZATION_CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Zero each element with probability p and rescale the rest by 1/(1-p); eval mode passes the input through.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"dropout\"</span><span class=\"p\">,</span> <span class=\"s2\">\"drop out\"</span><span class=\"p\">,</span> <span class=\"s2\">\"regularization\"</span><span class=\"p\">,</span> <span class=\"s2\">\"regularizer\"</span><span class=\"p\">,</span> <span class=\"s2\">\"dropout rate\"</span><span class=\"p\">,</span> <span class=\"s2\">\"mask\"</span><span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Input of any shape; dtype and device are preserved.\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"p\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">0.5</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">1.0</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">0.01</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Probability that an element is dropped. 0 passes the input through, 1 returns zeros.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"seed\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mh\">0xFFFFFFFFFFFFFFFF</span><span class=\"p\">,</span>\n                    <span class=\"n\">control_after_generate</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Seed of the mask draw: the same seed reproduces the same mask. The dropdown decides whether the value changes after each run.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">_mode_input</span><span class=\"p\">(</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Link the mode output of a Training Mode node: 'train' drops elements, 'eval' passes the input through unchanged. Unconnected means 'train'.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"output\"</span><span class=\"p\">)],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">p</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">0.5</span><span class=\"p\">,</span>\n        <span class=\"n\">seed</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">0</span><span class=\"p\">,</span>\n        <span class=\"n\">mode</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"n\">MODE_TRAIN</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">if</span> <span class=\"n\">_normalize_mode</span><span class=\"p\">(</span><span class=\"n\">mode</span><span class=\"p\">)</span> <span class=\"o\">==</span> <span class=\"n\">MODE_EVAL</span><span class=\"p\">:</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">p</span> <span class=\"o\">&lt;=</span> <span class=\"mf\">0.0</span><span class=\"p\">:</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">p</span> <span class=\"o\">&gt;=</span> <span class=\"mf\">1.0</span><span class=\"p\">:</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">zeros_like</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">))</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">_dropout</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">p</span><span class=\"p\">,</span> <span class=\"n\">seed</span><span class=\"p\">))</span>\n"}, "PoolingSliding": {"id": "PoolingSliding", "name": "Pool", "cat": "Pooling", "desc": "Sliding window pooling (max/avg) over 1/2/3 spatial dims - MaxPool{1,2,3}d and AvgPool{1,2,3}d in one node.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">PoolingSliding</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Sliding window pooling (max or average) over 1, 2 or 3 spatial dimensions.</span>\n\n<span class=\"sd\">    What: the functional form of ``torch.nn.MaxPool{1,2,3}d`` and</span>\n<span class=\"sd\">          ``torch.nn.AvgPool{1,2,3}d``. A learnable-free downsampling step that</span>\n<span class=\"sd\">          slides a ``kernel_size`` window across the spatial dimensions and</span>\n<span class=\"sd\">          keeps the reduction (max or mean) of each window - the classic</span>\n<span class=\"sd\">          \"shrink the feature map, keep the strongest response\" operation.</span>\n<span class=\"sd\">          ``mode`` picks the reduction and ``dims`` picks the rank, so the twelve</span>\n<span class=\"sd\">          torch layer types collapse into one node.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - feature map, usually ``(N, C, H, W)``. A bare</span>\n<span class=\"sd\">          ``(C, H, W)`` or even ``(H, W)`` tensor is accepted: missing leading</span>\n<span class=\"sd\">          dimensions are added internally and removed again from the result, so</span>\n<span class=\"sd\">          unbatched tensors pool exactly like batched ones.</span>\n<span class=\"sd\">          dims (COMBO) - 1, 2 or 3 (default 2): selects Pool1d/2d/3d and how many</span>\n<span class=\"sd\">          spatial dimensions the widgets below apply to.</span>\n<span class=\"sd\">          mode (COMBO) - ``max`` (default) or ``avg``.</span>\n<span class=\"sd\">          kernel_size (INT) - window size, default 2 (halves the spatial size).</span>\n<span class=\"sd\">          stride (INT) - window step, default 0 meaning \"same as kernel_size\"</span>\n<span class=\"sd\">          (torch's own default, giving non-overlapping windows).</span>\n<span class=\"sd\">          padding (INT) - implicit zero padding added on both sides, default 0.</span>\n<span class=\"sd\">          dilation (INT) - spacing between window elements, default 1.</span>\n<span class=\"sd\">          ceil_mode (BOOLEAN) - default false; when true the last window is kept</span>\n<span class=\"sd\">          even if it reaches past the input edge.</span>\n<span class=\"sd\">          count_include_pad (BOOLEAN) - default true; when false the padded zeros</span>\n<span class=\"sd\">          are excluded from the average divisor.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - pooled tensor with the same rank as the input.</span>\n<span class=\"sd\">          ``dims=2, kernel_size=2`` reproduces ``nn.MaxPool2d(2)`` exactly.</span>\n<span class=\"sd\">    Note: ``dilation`` only exists for ``mode=max`` and ``count_include_pad`` only</span>\n<span class=\"sd\">          for ``mode=avg`` (that is torch's API, not a limitation here); the</span>\n<span class=\"sd\">          unused widget is ignored and a note is printed when it is set to a</span>\n<span class=\"sd\">          non-default value.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_pooling_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"PoolingSliding\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Pool\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Sliding window pooling (max/avg) over 1/2/3 spatial dims - MaxPool{1,2,3}d and AvgPool{1,2,3}d in one node.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Feature map, e.g. (N, C, H, W); unbatched (C, H, W) also works.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">_dims_widget</span><span class=\"p\">(),</span>\n                <span class=\"n\">_mode_widget</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"max\"</span><span class=\"p\">,</span>\n                    <span class=\"s2\">\"Reduction: 'max' keeps the strongest activation per window, 'avg' averages it.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"kernel_size\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">2</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">64</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Window size; 2 halves the spatial size with the default stride.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"stride\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">64</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Window step; 0 means 'use kernel_size' (torch default).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"padding\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">32</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Implicit zero padding on both sides.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"dilation\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">16</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Spacing between window elements (max pooling only).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Boolean</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"ceil_mode\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"kc\">False</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Keep a window that reaches past the input edge (round up instead of down).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Boolean</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"count_include_pad\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Include padded zeros in the average divisor (avg pooling only).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"s2\">\"maxpool\"</span><span class=\"p\">,</span> <span class=\"s2\">\"avgpool\"</span><span class=\"p\">,</span> <span class=\"s2\">\"maxpool1d\"</span><span class=\"p\">,</span> <span class=\"s2\">\"maxpool2d\"</span><span class=\"p\">,</span> <span class=\"s2\">\"maxpool3d\"</span><span class=\"p\">,</span>\n                <span class=\"s2\">\"avgpool1d\"</span><span class=\"p\">,</span> <span class=\"s2\">\"avgpool2d\"</span><span class=\"p\">,</span> <span class=\"s2\">\"avgpool3d\"</span><span class=\"p\">,</span> <span class=\"s2\">\"max pooling\"</span><span class=\"p\">,</span>\n                <span class=\"s2\">\"average pooling\"</span><span class=\"p\">,</span> <span class

n class=\"nc\">BasicMultiply</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Element-wise multiplication of two tensors, with broadcasting.</span>\n\n<span class=\"sd\">    What: ``a * b``. Used for gating/attention weighting (``features * mask``),</span>\n<span class=\"sd\">          per-channel scaling (``features * (N, C, 1, 1)``) and any multiplicative</span>\n<span class=\"sd\">          merge of two branches.</span>\n<span class=\"sd\">    In:   a, b (TENSOR) - tensors of the same shape, or shapes that broadcast</span>\n<span class=\"sd\">          against each other. The mix of dtypes follows normal torch type</span>\n<span class=\"sd\">          promotion.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - the broadcast shape of both inputs.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_basic_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"BasicMultiply\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Multiply\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Element-wise multiplication of two tensors (broadcasting); useful for gating or scaling.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"a\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"First tensor.\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"b\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Second tensor; same shape or broadcast compatible.\"</span><span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"mul\"</span><span class=\"p\">,</span> <span class=\"s2\">\"product\"</span><span class=\"p\">,</span> <span class=\"s2\">\"scale\"</span><span class=\"p\">,</span> <span class=\"s2\">\"gate\"</span><span class=\"p\">,</span> <span class=\"s2\">\"mask\"</span><span class=\"p\">,</span> <span class=\"s2\">\"weighting\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">a</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span> <span class=\"n\">b</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">a</span> <span class=\"o\">*</span> <span class=\"n\">b</span><span class=\"p\">)</span>\n"}, "NormalizationBatchNorm": {"id": "NormalizationBatchNorm", "name": "BatchNorm", "cat": "Normalization", "desc": "Batch normalization over the channel dimension of (N, C, ...); one node covers the 1d/2d/3d flavours.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">NormalizationBatchNorm</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Batch normalization over the channel dimension: ``F.batch_norm``.</span>\n\n<span class=\"sd\">    What: normalizes every channel across all other dimensions - the batch and the</span>\n<span class=\"sd\">          spatial ones - using the statistics of the current call (``train``) or the</span>\n<span class=\"sd\">          statistics wired into ``running_mean`` / ``running_var`` (``eval``). One node</span>\n<span class=\"sd\">          covers every rank, because the shape alone decides which dimensions the</span>\n<span class=\"sd\">          statistics are taken over: ``(N, C)`` behaves like ``BatchNorm1d``,</span>\n<span class=\"sd\">          ``(N, C, L)`` like ``BatchNorm1d`` over a sequence, ``(N, C, H, W)`` like</span>\n<span class=\"sd\">          ``BatchNorm2d`` and ``(N, C, D, H, W)`` like ``BatchNorm3d``. The dimension</span>\n<span class=\"sd\">          that is *not* reduced over is always dimension 1.</span>\n<span class=\"sd\">          Nothing is stored inside the node: the batch statistics are not written back</span>\n<span class=\"sd\">          into ``running_mean`` / ``running_var``, because a tensor may be shared with</span>\n<span class=\"sd\">          other nodes in the same graph. To carry statistics from one run into the next</span>\n<span class=\"sd\">          one, wire the ``mean`` / ``var`` outputs into a Training Run Stats node.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - input of shape ``(N, C, ...)``; dtype/device preserved.</span>\n<span class=\"sd\">          weight (TENSOR, optional) - per-channel scale gamma of shape ``(C,)``.</span>\n<span class=\"sd\">          bias (TENSOR, optional) - per-channel shift beta of shape ``(C,)``.</span>\n<span class=\"sd\">          running_mean / running_var (TENSOR, optional) - per-channel statistics used in</span>\n<span class=\"sd\">          ``eval`` mode, shape ``(C,)``; a single value is broadcast to every channel.</span>\n<span class=\"sd\">          Wire them from Training Run Stats.</span>\n<span class=\"sd\">          eps (FLOAT) - stabiliser added to the variance.</span>\n<span class=\"sd\">          mode (STRING, optional) - link the ``mode`` output of a Training Mode node;</span>\n<span class=\"sd\">          unconnected means ``train``.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same shape/dtype/device as ``tensor``.</span>\n<span class=\"sd\">          mean (TENSOR) - the per-channel mean this call normalized with: the batch mean</span>\n<span class=\"sd\">          of the current call in ``train``, the wired ``running_mean`` in ``eval``. Shape</span>\n<span class=\"sd\">          ``(C,)``, so it can be linked into Training Run Stats.</span>\n<span class=\"sd\">          var (TENSOR) - likewise the per-channel variance.</span>\n\n<span class=\"sd\">    In ``eval`` mode without usable statistics the batch statistics are used instead</span>\n<span class=\"sd\">    and a warning is printed, so an incomplete graph never breaks.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_normalization_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"NormalizationBatchNorm\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"BatchNorm\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Batch normalization over the channel dimension of (N, C, ...); one node covers the 1d/2d/3d flavours.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Input of shape (N, C) or (N, C, ...).\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"weight\"</span><span class=\"p\">,</span> <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional per-channel scale gamma, shape (C,).\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"bias\"</span><span class=\"p\">,</span> <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional per-channel shift beta, shape (C,).\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"running_mean\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Per-channel mean for eval mode, shape (C,) or a single value; wire it from Training Run Stats.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"running_var\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Per-channel variance for eval mode, shape (C,) or a single value; wire it from Training Run Stats.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"eps\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">1e-5</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">1e-2</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">1e-6</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Stabiliser added to the variance.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">_mode_input</span><span class=\"p\">(),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"bn\"</span><span class=\"p\">,</span> <span class=\"s2\">\"batchnorm\"</span><span class=\"p\">,</span> <span class=\"s2\">\"batch norm\"</span><span class=\"p\">,</span> <span class=\"s2\">\"normalize batch\"</span><span class=\"p\">,</span> <span class=\"s2\">\"running stats\"</span><span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"output\"</span><span class=\"p\">),</span> <span class=\"o\">*</span><span class=\"n\">_STATS_OUTPUTS</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">running_mean</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">running_var</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">eps</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">1e-5</span><span class=\"p\">,</span>\n        <span class=\"n\">mode</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"n\">MODE_TRAIN</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">if</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">()</span> <span class=\"o\">&lt;</span> <span class=\"mi\">2</span><span class=\"p\">:</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"s2\">\"BatchNorm needs a channel dimension, i.e. rank &gt;= 2 (N, C, ...); returning the input unchanged.\"</span><span class=\"p\">)</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">mean</span><span class=\"p\">()</span><span class=\"o\">.</span><span class=\"n\">reshape</span><span class=\"p\">(</span><span class=\"mi\">1</span><span class=\"p\">),</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">var</span><span class=\"p\">(</span><span class=\"n\">unbiased</span><span class=\"o\">=</span><span class=\"kc\">False</span><span class=\"p\">)</span><span class=\"o\">.</span><span class=\"n\">reshape</span><span class=\"p\">(</span><span class=\"mi\">1</span><span class=\"p\">))</span>\n        <span class=\"c1\"># Every dimension but the channel one, which is what lets one node cover the</span>\n        <span class=\"c1\"># 1d/2d/3d flavours. ``unbiased=False`` matches the biased variance that</span>\n        <span class=\"c1\"># ``F.batch_norm`` normalizes with, so the exported value is the one used.</span>\n        <span class=\"n\">reduce_dims</span> <span class=\"o\">=</span> <span class=\"p\">(</span><span class=\"mi\">0</span><span class=\"p\">,)</span> <span class=\"o\">+</span> <span class=\"nb\">tuple</span><span class=\"p\">(</span><span class=\"nb\">range</span><span class=\"p\">(</span><span class=\"mi\">2</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">()))</span>\n        <span class=\"n\">batch_mean</span> <span class=\"o\">=</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">mean</span><span class=\"p\">(</span><span class=\"n\">dim</span><span class=\"o\">=</span><span class=\"n\">reduce_dims</span><span class=\"p\">)</span>\n        <span class=\"n\">batch_var</span> <span class=\"o\">=</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">var</span><span class=\"p\">(</span><span class=\"n\">dim</span><span class=\"o\">=</span><span class=\"n\">reduce_dims</span><span class=\"p\">,</span> <span class=\"n\">unbiased</span><span class=\"o\">=</span><span class=\"kc\">False</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">_normalize_mode</span><span class=\"p\">(</span><span class=\"n\">mode</span><span class=\"p\">)</span> <span class=\"o\">==</span> <span class=\"n\">MODE_EVAL</span><span class=\"p\">:</span>\n            <span class=\"n\">channels</span> <span class=\"o\">=</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">[</span><span class=\"mi\">1</span><span class=\"p\">]</span>\n            <span class=\"n\">mean</span> <span class=\"o\">=</span> <span class=\"n\">_broadcast_stat</span><span class=\"p\">(</span><span class=\"n\">running_mean</span><span class=\"p\">,</span> <span class=\"n\">channels</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"s2\">\"running_mean\"</span><span class=\"p\">)</span>\n            <span class=\"n\">var</span> <span class=\"o\">=</span> <span class=\"n\">_broadcast_stat</span><span class=\"p\">(</span><span class=\"n\">running_var</span><span class=\"p\">,</span> <span class=\"n\">channels</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"s2\">\"running_var\"</span><span class=\"p\">)</span>\n            <span class=\"k\">if</span> <span class=\"n\">mean</span> <span class=\"ow\">is</span> <span class=\"ow\">not</span> <span class=\"kc\">None</span> <span class=\"ow\">and</span> <span class=\"n\">var</span> <span class=\"ow\">is</span> <span class=\"ow\">not</span> <span class=\"kc\">None</span><span class=\"p\">:</span>\n                <span class=\"n\">output</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">batch_norm</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">mean</span><span class=\"p\">,</span> <span class=\"n\">var</span><span class=\"p\">,</span> <span class=\"n\">weight</span><span class=\"p\">,</span> <span class=\"n\">bias</span><span class=\"p\">,</span> <span class=\"n\">training</span><span class=\"o\">=</span><span class=\"kc\">False</span><span class=\"p\">,</span> <span class=\"n\">eps</span><span class=\"o\">=</span><span class=\"n\">eps</span><span class=\"p\">)</span>\n                <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">output</span><span class=\"p\">,</span> <span class=\"n\">mean</span><span class=\"o\">.</span><span class=\"n\">reshape</span><span class=\"p\">(</span><span class=\"o\">-</span><span class=\"mi\">1</span><span class=\"p\">),</span> <span class=\"n\">var</span><span class=\"o\">.</span><span class=\"n\">reshape</span><span class=\"p\">(</span><span class=\"o\">-</span><span class=\"mi\">1</span><span class=\"p\">))</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"s2\">\"BatchNorm is in eval mode but no usable running statistics are wired in; using the batch statistics instead.\"</span><span class=\"p\">)</span>\n        <span class=\"c1\"># ``training=False`` fed with the statistics computed above: the same result as</span>\n        <span class=\"c1\"># ``training=True``, but the reduction happens once instead of twice.</span>\n        <span class=\"n\">output</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">batch_norm</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">batch_mean</span><span class=\"p\">,</span> <span class=\"n\">batch_var</span><span class=\"p\">,</span> <span class=\"n\">weight</span><span class=\"p\">,</span> <span class=\"n\">bias</span><span class=\"p\">,</span> <span class=\"n\">training</span><span class=\"o\">=</span><span class=\"kc\">False</span><span class=\"p\">,</span> <span class=\"n\">eps</span><span class=\"o\">=</span><span class=\"n\">eps</span><span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">output</span><span class=\"p\">,</span> <span class=\"n\">batch_mean</span><span class=\"p\">,</span> <span class=\"n\">batch_var</span><span class=\"p\">)</span>\n"}, "NormalizationInstanceNorm": {"id": "NormalizationInstanceNorm", "name": "InstanceNorm", "cat": "Normalization", "desc": "Per-sample, per-channel normalization over the spatial dimensions of (N, C, ...).", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">NormalizationInstanceNorm</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Instance normalization: ``F.instance_norm``.</span>\n\n<span class=\"sd\">    What: like BatchNorm, but the statistics are taken per sample *and* per channel, so</span>\n<span class=\"sd\">          no information is shared across the batch. Typical use is style transfer and</span>\n<span class=\"sd\">          any layer where each image must be normalized independently. As with BatchNorm</span>\n<span class=\"sd\">          a single node covers ``(N, C, L)``, ``(N, C, H, W)`` and ``(N, C, D, H, W)``;</span>\n<span class=\"sd\">          the spatial dimensions are whatever follows the channel dimension.</span>\n<span class=\"sd\">          Nothing is stored inside the node, and the wired statistics are never updated</span>\n<span class=\"sd\">          in place.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - input of shape ``(N, C, ...)`` with at least one spatial</span>\n<span class=\"sd\">          dimension; dtype/device preserved.</span>\n<span class=\"sd\">          weight (TENSOR, optional) - per-channel scale gamma of shape ``(C,)``.</span>\n<span class=\"sd\">          bias (TENSOR, optional) - per-channel shift beta of shape ``(C,)``.</span>\n<span class=\"sd\">          running_mean / running_var (TENSOR, optional) - per-channel statistics used in</span>\n<span class=\"sd\">          ``eval`` mode, shape ``(C,)``; a single value is broadcast to every channel.</span>\n<span class=\"sd\">          Wire them from Training Run Stats.</span>\n<span class=\"sd\">          eps (FLOAT) - stabiliser added to the variance.</span>\n<span class=\"sd\">          mode (STRING, optional) - link the ``mode`` output of a Training Mode node;</span>\n<span class=\"sd\">          unconnected means ``train`` (normalize with the statistics of this call).</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same shape/dtype/device as ``tensor``.</span>\n<span class=\"sd\">          mean (TENSOR) - the per-channel mean this call normalized with: the statistics</span>\n<span class=\"sd\">          of the current call in ``train``, the wired ``running_mean`` in ``eval``. The</span>\n<span class=\"sd\">          per-sample means are reduced to one value per channel, so the pair means the</span>\n<span class=\"sd\">          same thing as BatchNorm's and can be stored in the same slots.</span>\n<span class=\"sd\">          var (TENSOR) - likewise the per-channel variance.</span>\n\n<span class=\"sd\">    In ``eval`` mode without usable statistics the statistics of the current call are</span>\n<span class=\"sd\">    used instead and a warning is printed. A tensor without a spatial dimension (rank</span>\n<span class=\"sd\">    below 3) is returned unchanged, because there is nothing to normalize over.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_normalization_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"NormalizationInstanceNorm\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"InstanceNorm\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Per-sample, per-channel normalization over the spatial dimensions of (N, C, ...).\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Input of shape (N, C, ...) with at least one spatial dimension.\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"weight\"</span><span class=\"p\">,</span> <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional per-channel scale gamma, shape (C,).\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"bias\"</span><span class=\"p\">,</span> <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional per-channel shift beta, shape (C,).\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"running_mean\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Per-channel mean for eval mode, shape (C,) or a single value; wire it from Training Run Stats.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"running_var\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Per-channel variance for eval mode, shape (C,) or a single value; wire it from Training Run Stats.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"eps\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">1e-5</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">1e-2</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">1e-6</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Stabiliser added to the variance.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">_mode_input</span><span class=\"p\">(),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"in\"</span><span class=\"p\">,</span> <span class=\"s2\">\"instancenorm\"</span><span class=\"p\">,</span> <span class=\"s2\">\"instance norm\"</span><span class=\"p\">,</span> <span class=\"s2\">\"per sample\"</span><span class=\"p\">,</span> <span class=\"s2\">\"style transfer\"</span><span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"output\"</span><span class=\"p\">),</span> <span class=\"o\">*</span><span class=\"n\">_STATS_OUTPUTS</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">running_mean</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">running_var</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">eps</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">1e-5</span><span class=\"p\">,</span>\n        <span class=\"n\">mode</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"n\">MODE_TRAIN</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">if</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">()</span> <span class=\"o\">&lt;</span> <span class=\"mi\">3</span><span class=\"p\">:</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"s2\">\"InstanceNorm needs a spatial dimension, i.e. rank &gt;= 3 (N, C, ...); returning the input unchanged.\"</span><span class=\"p\">)</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">mean</span><span class=\"p\">()</span><span class=\"o\">.</span><span class=\"n\">reshape</span><span class=\"p\">(</span><span class=\"mi\">1</span><span class=\"p\">),</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">var</span><span class=\"p\">(</span><span class=\"n\">unbiased</span><span class=\"o\">=</span><span class=\"kc\">False</span><span class=\"p\">)</span><span class=\"o\">.</span><span class=\"n\">reshape</span><span class=\"p\">(</span><span class=\"mi\">1</span><span class=\"p\">))</span>\n        <span class=\"k\">if</span> <span class=\"n\">_normalize_mode</span><span class=\"p\">(</span><span class=\"n\">mode</span><span class=\"p\">)</span> <span class=\"o\">==</span> <span class=\"n\">MODE_EVAL</span><span class=\"p\">:</span>\n            <span class=\"n\">channels</span> <span class=\"o\">=</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">[</span><span class=\"mi\">1</span><span class=\"p\">]</span>\n            <span class=\"n\">mean</span> <span class=\"o\">=</span> <span class=\"n\">_broadcast_stat</span><span class=\"p\">(</span><span class=\"n\">running_mean</span><span class=\"p\">,</span> <span class=\"n\">channels</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"s2\">\"running_mean\"</span><span class=\"p\">)</span>\n            <span class=\"n\">var</span> <span class=\"o\">=</span> <span class=\"n\">_broadcast_stat</span><span class=\"p\">(</span><span class=\"n\">running_var</span><span class=\"p\">,</span> <span class=\"n\">channels</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"s2\">\"running_var\"</span><span class=\"p\">)</span>\n            <span class=\"k\">if</span> <span class=\"n\">mean</span> <span class=\"ow\">is</span> <span class=\"ow\">not</span> <span class=\"kc\">None</span> <span class=\"ow\">and</span> <span class=\"n\">var</span> <span class=\"ow\">is</span> <span class=\"ow\">not</span> <span class=\"kc\">None</span><span class=\"p\">:</span>\n                <span class=\"n\">output</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">instance_norm</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">mean</span><span class=\"p\">,</span> <span class=\"n\">var</span><span class=\"p\">,</span> <span class=\"n\">weight</span><span class=\"p\">,</span> <span class=\"n\">bias</span><span class=\"p\">,</span> <span class=\"n\">use_input_stats</span><span class=\"o\">=</span><span class=\"kc\">False</span><span class=\"p\">,</span> <span class=\"n\">eps</span><span class=\"o\">=</span><span class=\"n\">eps</span><span class=\"p\">)</span>\n                <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">output</span><span class=\"p\">,</span> <span class=\"n\">mean</span><span class=\"o\">.</span><span class=\"n\">reshape</span><span class=\"p\">(</span><span class=\"o\">-</span><span class=\"mi\">1</span><span class=\"p\">),</span> <span class=\"n\">var</span><span class=\"o\">.</span><span class=\"n\">reshape</span><span class=\"p\">(</span><span class=\"o\">-</span><span class=\"mi\">1</span><span class=\"p\">))</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"s2\">\"InstanceNorm is in eval mode but no usable running statistics are wired in; using the statistics of this call instead.\"</span><span class=\"p\">)</span>\n        <span class=\"n\">output</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">instance_norm</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"kc\">None</span><span class=\"p\">,</span> <span class=\"kc\">None</span><span class=\"p\">,</span> <span class=\"n\">weight</span><span class=\"p\">,</span> <span class=\"n\">bias</span><span class=\"p\">,</span> <span class=\"n\">use_input_stats</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span> <span class=\"n\">eps</span><span class=\"o\">=</span><span class=\"n\">eps</span><span class=\"p\">)</span>\n        <span class=\"c1\"># Instance statistics are per sample, so they are reduced to one mean/variance</span>\n        <span class=\"c1\"># per channel: the exported pair then means the same thing as BatchNorm's and</span>\n        <span class=\"c1\"># fits the same ``running_mean`` / ``running_var`` slots. The variance is the</span>\n        <span class=\"c1\"># two-way decomposition - the mean of the within-sample variances plus the</span>\n        <span class=\"c1\"># variance of the per-sample means - which is exactly the variance of the whole</span>\n        <span class=\"c1\"># batch, i.e. the quantity BatchNorm would have reported for this tensor.</span>\n        <span class=\"n\">spatial</span> <span class=\"o\">=</span> <span class=\"nb\">tuple</span><span class=\"p\">(</span><span class=\"nb\">range</span><span class=\"p\">(</span><span class=\"mi\">2</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">()))</span>\n        <span class=\"n\">sample_mean</span> <span class=\"o\">=</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">mean</span><span class=\"p\">(</span><span class=\"n\">dim</span><span class=\"o\">=</span><span class=\"n\">spatial</span><span class=\"p\">)</span>\n        <span class=\"n\">sample_var</span> <span class=\"o\">=</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">var</span><span class=\"p\">(</span><span class=\"n\">dim</span><span class=\"o\">=</span><span class=\"n\">spatial</span><span class=\"p\">,</span> <span class=\"n\">unbiased</span><span class=\"o\">=</span><span class=\"kc\">False</span><span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span>\n            <span class=\"n\">output</span><span class=\"p\">,</span>\n            <span class=\"n\">sample_mean</span><span class=\"o\">.</span><span class=\"n\">mean</span><span class=\"p\">(</span><span class=\"n\">dim</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">),</span>\n            <span class=\"n\">sample_var</span><span class=\"o\">.</span><span class=\"n\">mean</span><span class=\"p\">(</span><span class=\"n\">dim</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">)</span> <span class=\"o\">+</span> <span class=\"n\">sample_mean</span><span class=\"o\">.</span><span class=\"n\">var</span><span class=\"p\">(</span><span class=\"n\">dim</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span> <span class=\"n\">unbiased</span><span class=\"o\">=</span><span class=\"kc\">False</span><span class=\"p\">),</span>\n        <span class=\"p\">)</span>\n"}, "NormalizationLayerNorm": {"id": "NormalizationLayerNorm", "name": "LayerNorm", "cat": "Normalization", "desc": "Layer normalization over the trailing dimensions, e.g. \"last\" or \"8,16\".", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">NormalizationLayerNorm</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Layer normalization over the trailing dimensions: ``F.layer_norm``.</span>\n\n<span class=\"sd\">    What: normalizes each sample independently, over the dimensions named by</span>\n<span class=\"sd\">          ``normalized_shape`` (the last one by default), then applies gamma/beta.</span>\n<span class=\"sd\">          This is the transformer/MLP normalizer; unlike BatchNorm it does not reduce</span>\n<span class=\"sd\">          over the batch at all, which is why it has no train/eval switch - its math</span>\n<span class=\"sd\">          is identical in both modes.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - input of shape ``(..., d1, d2, ...)``; dtype/device kept.</span>\n<span class=\"sd\">          weight (TENSOR, optional) - scale gamma, shaped like the normalized part.</span>\n<span class=\"sd\">          bias (TENSOR, optional) - shift beta, shaped like the normalized part.</span>\n<span class=\"sd\">          normalized_shape (STRING) - ``\"last\"`` normalizes the last dimension; a list</span>\n<span class=\"sd\">          such as ``\"8,16\"`` normalizes the last two. The numbers are only used to</span>\n<span class=\"sd\">          decide how many dimensions to take: if they no longer match the tensor (a</span>\n<span class=\"sd\">          stale widget value after a shape change) the actual sizes win and a warning</span>\n<span class=\"sd\">          is printed, so a workflow is never broken by an outdated shape string.</span>\n<span class=\"sd\">          eps (FLOAT) - stabiliser added to the variance.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same shape/dtype/device as ``tensor``.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_normalization_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"NormalizationLayerNorm\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"LayerNorm\"</span><span class=\"p\">,</span>\n            <span class=\"s1\">'Layer normalization over the trailing dimensions, e.g. \"last\" or \"8,16\".'</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Input of shape (..., d1, d2, ...).\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"weight\"</span><span class=\"p\">,</span> <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional scale gamma, shaped like the normalized part.\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"bias\"</span><span class=\"p\">,</span> <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional shift beta, shaped like the normalized part.\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"normalized_shape\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"last\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">placeholder</span><span class=\"o\">=</span><span class=\"s2\">\"e.g. 8,16\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s1\">'\"last\" normalizes the last dimension; a list such as \"8,16\" normalizes the last two.'</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"eps\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">1e-5</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">1e-2</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">1e-6</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Stabiliser added to the variance.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"ln\"</span><span class=\"p\">,</span> <span class=\"s2\">\"layernorm\"</span><span class=\"p\">,</span> <span class=\"s2\">\"layer norm\"</span><span class=\"p\">,</span> <span class=\"s2\">\"transformer norm\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">normalized_shape</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"s2\">\"last\"</span><span class=\"p\">,</span>\n        <span class=\"n\">eps</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">1e-5</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">if</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">()</span> <span class=\"o\">&lt;</span> <span class=\"mi\">1</span><span class=\"p\">:</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"s2\">\"LayerNorm received a 0-dim tensor; returning it unchanged.\"</span><span class=\"p\">)</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">)</span>\n        <span class=\"n\">shape</span> <span class=\"o\">=</span> <span class=\"n\">_resolve_normalized_shape</span><span class=\"p\">(</span><span class=\"n\">normalized_shape</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">layer_norm</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">shape</span><span class=\"p\">,</span> <span class=\"n\">weight</span><span class=\"p\">,</span> <span class=\"n\">bias</span><span class=\"p\">,</span> <span class=\"n\">eps</span><span class=\"p\">))</span>\n"}, "NormalizationGroupNorm": {"id": "NormalizationGroupNorm", "name": "GroupNorm", "cat": "Normalization", "desc": "Normalization over groups of channels; num_groups=1 normalizes over all channels.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">NormalizationGroupNorm</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Group normalization: ``F.group_norm``.</span>\n\n<span class=\"sd\">    What: splits the channels into ``num_groups`` groups and normalizes each group</span>\n<span class=\"sd\">          over its channels and all remaining dimensions. It sits between LayerNorm</span>\n<span class=\"sd\">          (every channel in one group) and InstanceNorm (one channel per group), and</span>\n<span class=\"sd\">          is the usual replacement for BatchNorm when the batch is small, because it</span>\n<span class=\"sd\">          never reduces over the batch. ``num_groups=1`` is the friendliest default:</span>\n<span class=\"sd\">          it works for every channel count.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - input of shape ``(N, C, ...)``; dtype/device preserved.</span>\n<span class=\"sd\">          weight (TENSOR, optional) - per-channel scale gamma of shape ``(C,)``.</span>\n<span class=\"sd\">          bias (TENSOR, optional) - per-channel shift beta of shape ``(C,)``.</span>\n<span class=\"sd\">          num_groups (INT) - number of channel groups. If it does not divide the</span>\n<span class=\"sd\">          channel count (or is below 1) one group is used instead and a warning is</span>\n<span class=\"sd\">          printed, so a workflow is never broken by an arithmetic slip.</span>\n<span class=\"sd\">          eps (FLOAT) - stabiliser added to the variance.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same shape/dtype/device as ``tensor``.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_normalization_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"NormalizationGroupNorm\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"GroupNorm\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Normalization over groups of channels; num_groups=1 normalizes over all channels.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Input of shape (N, C, ...).\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"weight\"</span><span class=\"p\">,</span> <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional per-channel scale gamma, shape (C,).\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"bias\"</span><span class=\"p\">,</span> <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional per-channel shift beta, shape (C,).\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"num_groups\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">64</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Channel groups; must divide the channel count, otherwise 1 group is used.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"eps\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">1e-5</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">1e-2</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">1e-6</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Stabiliser added to the variance.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"gn\"</span><span class=\"p\">,</span> <span class=\"s2\">\"groupnorm\"</span><span class=\"p\">,</span> <span class=\"s2\">\"group norm\"</span><span class=\"p\">,</span> <span class=\"s2\">\"small batch\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">bias</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">num_groups</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">1</span><span class=\"p\">,</span>\n        <span class=\"n\">eps</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">1e-5</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">if</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">()</span> <span class=\"o\">&lt;</span> <span class=\"mi\">2</span><span class=\"p\">:</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"s2\">\"GroupNorm needs a channel dimension, i.e. rank &gt;= 2 (N, C, ...); returning the input unchanged.\"</span><span class=\"p\">)</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">)</span>\n        <span class=\"n\">channels</span> <span class=\"o\">=</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">[</span><span class=\"mi\">1</span><span class=\"p\">]</span>\n        <span class=\"n\">groups</span> <span class=\"o\">=</span> <span class=\"n\">num_groups</span> <span class=\"k\">if</span> <span class=\"n\">num_groups</span> <span class=\"o\">&gt;=</span> <span class=\"mi\">1</span> <span class=\"ow\">and</span> <span class=\"n\">channels</span> <span class=\"o\">%</span> <span class=\"n\">num_groups</span> <span class=\"o\">==</span> <span class=\"mi\">0</span> <span class=\"k\">else</span> <span class=\"mi\">1</span>\n        <span class=\"k\">if</span> <span class=\"n\">groups</span> <span class=\"o\">!=</span> <span class=\"n\">num_groups</span><span class=\"p\">:</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"sa\">f</span><span class=\"s2\">\"GroupNorm num_groups=</span><span class=\"si\">{</span><span class=\"n\">num_groups</span><span class=\"si\">}</span><span class=\"s2\"> is not usable for </span><span class=\"si\">{</span><span class=\"n\">channels</span><span class=\"si\">}</span><span class=\"s2\"> channel(s); using 1 group instead.\"</span><span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">group_norm</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">groups</span><span class=\"p\">,</span> <span class=\"n\">weight</span><span class=\"p\">,</span> <span class=\"n\">bias</span><span class=\"p\">,</span> <span class=\"n\">eps</span><span class=\"p\">))</span>\n"}, "NormalizationRMSNorm": {"id": "NormalizationRMSNorm", "name": "RMSNorm", "cat": "Normalization", "desc": "Root-mean-square normalization over the trailing dimensions, e.g. LLaMA style.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">NormalizationRMSNorm</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Root-mean-square normalization: ``F.rms_norm``.</span>\n\n<span class=\"sd\">    What: divides by the root mean square of the normalized dimensions and multiplies</span>\n<span class=\"sd\">          by an optional scale, without centering and without a bias. This is the</span>\n<span class=\"sd\">          normalizer used by LLaMA-style models; it is cheaper than LayerNorm (no mean</span>\n<span class=\"sd\">          subtraction) and has no train/eval switch, because its math is identical in</span>\n<span class=\"sd\">          both modes.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - input of shape ``(..., d1, d2, ...)``; dtype/device kept.</span>\n<span class=\"sd\">          weight (TENSOR, optional) - scale gamma, shaped like the normalized part.</span>\n<span class=\"sd\">          normalized_shape (STRING) - ``\"last\"`` normalizes the last dimension; a list</span>\n<span class=\"sd\">          such as ``\"8,16\"`` normalizes the last two. As in LayerNorm the numbers only</span>\n<span class=\"sd\">          decide how many dimensions to take and the actual sizes win when they differ.</span>\n<span class=\"sd\">          eps (FLOAT) - stabiliser added inside the square root; 1e-6 follows LLaMA.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same shape/dtype/device as ``tensor``.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_normalization_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"NormalizationRMSNorm\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"RMSNorm\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Root-mean-square normalization over the trailing dimensions, e.g. LLaMA style.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Input of shape (..., d1, d2, ...).\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"weight\"</span><span class=\"p\">,</span> <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional scale gamma, shaped like the normalized part.\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"normalized_shape\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"last\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">placeholder</span><span class=\"o\">=</span><span class=\"s2\">\"e.g. 8,16\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s1\">'\"last\" normalizes the last dimension; a list such as \"8,16\" normalizes the last two.'</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"eps\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">1e-6</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">1e-2</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">1e-6</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Stabiliser added inside the square root (1e-6 follows LLaMA).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"rms\"</span><span class=\"p\">,</span> <span class=\"s2\">\"rmsnorm\"</span><span class=\"p\">,</span> <span class=\"s2\">\"root mean square\"</span><span class=\"p\">,</span> <span class=\"s2\">\"llama\"</span><span class=\"p\">,</span> <span class=\"s2\">\"llm norm\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">normalized_shape</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"s2\">\"last\"</span><span class=\"p\">,</span>\n        <span class=\"n\">eps</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">1e-6</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">if</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">()</span> <span class=\"o\">&lt;</span> <span class=\"mi\">1</span><span class=\"p\">:</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"s2\">\"RMSNorm received a 0-dim tensor; returning it unchanged.\"</span><span class=\"p\">)</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">)</span>\n        <span class=\"n\">shape</span> <span class=\"o\">=</span> <span class=\"n\">_resolve_normalized_shape</span><span class=\"p\">(</span><span class=\"n\">normalized_shape</span><span class=\"p\">,</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">rms_norm</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">shape</span><span class=\"p\">,</span> <span class=\"n\">weight</span><span class=\"p\">,</span> <span class=\"n\">eps</span><span class=\"p\">))</span>\n"}, "NormalizationWeightNorm": {"id": "NormalizationWeightNorm", "name": "WeightNorm", "cat": "Normalization", "desc": "Re-parameterize a weight as g * v / ||v||, i.e. separate its direction from its scale.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">NormalizationWeightNorm</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Weight re-parameterization: ``weight = g * v / ||v||``.</span>\n\n<span class=\"sd\">    What: a *re-parameterization of a weight tensor*, not a normalization of</span>\n<span class=\"sd\">          activations. It decouples the direction of a weight matrix from its scale:</span>\n<span class=\"sd\">          the norm along ``dim`` is removed and re-applied through the optional ``g``,</span>\n<span class=\"sd\">          which makes the scale a separate knob (the trick behind \"weight</span>\n<span class=\"sd\">          normalization\" and a common way to keep activations stable while training).</span>\n<span class=\"sd\">          This node is stateless - unlike ``torch.nn.utils.weight_norm`` it does not</span>\n<span class=\"sd\">          register anything on a module, it simply returns the re-parameterized tensor.</span>\n<span class=\"sd\">    In:   weight (TENSOR) - the weight to re-parameterize, e.g. ``(out, in)``.</span>\n<span class=\"sd\">          g (TENSOR, optional) - the scale that replaces the removed norm. Its shape is</span>\n<span class=\"sd\">          the weight shape without ``dim`` (e.g. ``(out, 1)`` for ``dim=0``); anything</span>\n<span class=\"sd\">          broadcastable against the weight works. Leave it unconnected for a purely</span>\n<span class=\"sd\">          direction-normalized weight (which then has unit norm along ``dim``).</span>\n<span class=\"sd\">          dim (INT) - dimension to take the norm over, clamped to the weight rank.</span>\n<span class=\"sd\">          eps (FLOAT) - lower bound applied to the norm, so a zero weight cannot divide</span>\n<span class=\"sd\">          by zero.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - the re-parameterized weight, same shape as ``weight``.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_normalization_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"NormalizationWeightNorm\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"WeightNorm\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Re-parameterize a weight as g * v / ||v||, i.e. separate its direction from its scale.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"weight\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Weight tensor to re-parameterize, e.g. (out, in).\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"g\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional scale replacing the removed norm, e.g. (out, 1) for dim=0; leave unconnected for a unit-norm weight.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"dim\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=-</span><span class=\"mi\">8</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">7</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Dimension to take the norm over (clamped to the weight rank).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"eps\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">1e-12</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">1e-3</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">1e-9</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Lower bound applied to the norm.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"weight normalization\"</span><span class=\"p\">,</span> <span class=\"s2\">\"reparameterization\"</span><span class=\"p\">,</span> <span class=\"s2\">\"direction\"</span><span class=\"p\">,</span> <span class=\"s2\">\"scale\"</span><span class=\"p\">,</span> <span class=\"s2\">\"norm of weight\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">weight</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">g</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">dim</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">0</span><span class=\"p\">,</span>\n        <span class=\"n\">eps</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">1e-12</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\

>,</span> <span class=\"s2\">\"text\"</span><span class=\"p\">,</span> <span class=\"s2\">\"ids\"</span><span class=\"p\">,</span> <span class=\"s2\">\"indices\"</span><span class=\"p\">,</span> <span class=\"s2\">\"vocab\"</span><span class=\"p\">,</span> <span class=\"s2\">\"nlp\"</span><span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Vocab</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"vocab\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"The vocabulary to decode with; link from Vocab Build.\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"ids\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Token indices: a 1-D stream or a 2-D (batch, seq_len) batch.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"text\"</span><span class=\"p\">)],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">vocab</span><span class=\"p\">,</span> <span class=\"n\">ids</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">table</span> <span class=\"o\">=</span> <span class=\"n\">_as_vocab</span><span class=\"p\">(</span><span class=\"n\">vocab</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"ow\">not</span> <span class=\"nb\">isinstance</span><span class=\"p\">(</span><span class=\"n\">ids</span><span class=\"p\">,</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">):</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"'ids' needs a tensor of token indices; got </span><span class=\"si\">{</span><span class=\"nb\">type</span><span class=\"p\">(</span><span class=\"n\">ids</span><span class=\"p\">)</span><span class=\"o\">.</span><span class=\"vm\">__name__</span><span class=\"si\">}</span><span class=\"s2\">.\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"n\">flat</span> <span class=\"o\">=</span> <span class=\"n\">_as_index_tensor</span><span class=\"p\">(</span><span class=\"n\">ids</span><span class=\"p\">,</span> <span class=\"s2\">\"ids\"</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">ids</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">()</span> <span class=\"o\">&lt;=</span> <span class=\"mi\">1</span><span class=\"p\">:</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">table</span><span class=\"o\">.</span><span class=\"n\">decode</span><span class=\"p\">(</span><span class=\"n\">flat</span><span class=\"o\">.</span><span class=\"n\">tolist</span><span class=\"p\">()))</span>\n        <span class=\"n\">width</span> <span class=\"o\">=</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">ids</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">[</span><span class=\"o\">-</span><span class=\"mi\">1</span><span class=\"p\">])</span>\n        <span class=\"n\">rows</span> <span class=\"o\">=</span> <span class=\"p\">[</span>\n            <span class=\"n\">flat</span><span class=\"p\">[</span><span class=\"n\">row</span> <span class=\"o\">*</span> <span class=\"n\">width</span> <span class=\"p\">:</span> <span class=\"p\">(</span><span class=\"n\">row</span> <span class=\"o\">+</span> <span class=\"mi\">1</span><span class=\"p\">)</span> <span class=\"o\">*</span> <span class=\"n\">width</span><span class=\"p\">]</span><span class=\"o\">.</span><span class=\"n\">tolist</span><span class=\"p\">()</span>\n            <span class=\"k\">for</span> <span class=\"n\">row</span> <span class=\"ow\">in</span> <span class=\"nb\">range</span><span class=\"p\">(</span><span class=\"n\">ids</span><span class=\"o\">.</span><span class=\"n\">numel</span><span class=\"p\">()</span> <span class=\"o\">//</span> <span class=\"nb\">max</span><span class=\"p\">(</span><span class=\"mi\">1</span><span class=\"p\">,</span> <span class=\"n\">width</span><span class=\"p\">))</span>\n        <span class=\"p\">]</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"s2\">\"</span><span class=\"se\">\\n</span><span class=\"s2\">\"</span><span class=\"o\">.</span><span class=\"n\">join</span><span class=\"p\">(</span><span class=\"n\">table</span><span class=\"o\">.</span><span class=\"n\">decode</span><span class=\"p\">(</span><span class=\"n\">row</span><span class=\"p\">)</span> <span class=\"k\">for</span> <span class=\"n\">row</span> <span class=\"ow\">in</span> <span class=\"n\">rows</span><span class=\"p\">))</span>\n"}, "TextSlidingWindow": {"id": "TextSlidingWindow", "name": "Sliding Window", "cat": "Text", "desc": "Cuts a token-index stream into (context, next token) sample pairs: the next-token dataset of a language model.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TextSlidingWindow</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Cut an index stream into (context, next-token) training samples.</span>\n\n<span class=\"sd\">    What: the next-token dataset of a language model. A window of ``window``</span>\n<span class=\"sd\">          tokens slides over the stream one position at a time; every position</span>\n<span class=\"sd\">          contributes one sample - the window as input ``x`` and the token</span>\n<span class=\"sd\">          right after it as target ``y``. With the default window 4 and the</span>\n<span class=\"sd\">          default corpus this yields one sample per position, exactly the</span>\n<span class=\"sd\">          d2l ``seq_data_iter_sequential`` dataset in its simplest (stride 1)</span>\n<span class=\"sd\">          form.</span>\n<span class=\"sd\">    In:   ids (TENSOR) - 1-D long tensor of token indices (link from Text</span>\n<span class=\"sd\">          Encode); floats are truncated, 2-D inputs are flattened.</span>\n<span class=\"sd\">          window (INT) - context length per sample (default 4).</span>\n<span class=\"sd\">    Out:  x (TENSOR) - ``(samples, window)`` long; the contexts.</span>\n<span class=\"sd\">          y (TENSOR) - ``(samples,)`` long; the next token of each context.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"TextSlidingWindow\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Sliding Window\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Cuts a token-index stream into (context, next token) sample pairs: the next-token dataset of a language model.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"sliding window\"</span><span class=\"p\">,</span> <span class=\"s2\">\"dataset\"</span><span class=\"p\">,</span> <span class=\"s2\">\"next token\"</span><span class=\"p\">,</span> <span class=\"s2\">\"samples\"</span><span class=\"p\">,</span> <span class=\"s2\">\"language model\"</span><span class=\"p\">,</span> <span class=\"s2\">\"ngram\"</span><span class=\"p\">,</span> <span class=\"s2\">\"text\"</span><span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"ids\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"1-D stream of token indices; link from Text Encode.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"window\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">4</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">4096</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Context length per sample; must be shorter than the stream.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"x\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"y\"</span><span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">ids</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span> <span class=\"n\">window</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">4</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">flat</span> <span class=\"o\">=</span> <span class=\"n\">_as_index_tensor</span><span class=\"p\">(</span><span class=\"n\">ids</span><span class=\"p\">,</span> <span class=\"s2\">\"ids\"</span><span class=\"p\">)</span>\n        <span class=\"n\">size</span> <span class=\"o\">=</span> <span class=\"nb\">max</span><span class=\"p\">(</span><span class=\"mi\">1</span><span class=\"p\">,</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">window</span><span class=\"p\">))</span>\n        <span class=\"n\">contexts</span><span class=\"p\">:</span> <span class=\"nb\">list</span><span class=\"p\">[</span><span class=\"nb\">list</span><span class=\"p\">[</span><span class=\"nb\">int</span><span class=\"p\">]]</span> <span class=\"o\">=</span> <span class=\"p\">[]</span>\n        <span class=\"n\">targets</span><span class=\"p\">:</span> <span class=\"nb\">list</span><span class=\"p\">[</span><span class=\"nb\">int</span><span class=\"p\">]</span> <span class=\"o\">=</span> <span class=\"p\">[]</span>\n        <span class=\"c1\"># One sample per stream position: report it so a long corpus shows a live</span>\n        <span class=\"c1\"># bar instead of a frozen node (and the loop stays interruptible).</span>\n        <span class=\"n\">pbar</span> <span class=\"o\">=</span> <span class=\"n\">comfy</span><span class=\"o\">.</span><span class=\"n\">utils</span><span class=\"o\">.</span><span class=\"n\">ProgressBar</span><span class=\"p\">(</span><span class=\"nb\">max</span><span class=\"p\">(</span><span class=\"mi\">0</span><span class=\"p\">,</span> <span class=\"n\">flat</span><span class=\"o\">.</span><span class=\"n\">numel</span><span class=\"p\">()</span> <span class=\"o\">-</span> <span class=\"n\">size</span><span class=\"p\">))</span>\n        <span class=\"k\">for</span> <span class=\"n\">context</span><span class=\"p\">,</span> <span class=\"n\">target</span> <span class=\"ow\">in</span> <span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">iter_windows</span><span class=\"p\">(</span><span class=\"n\">flat</span><span class=\"o\">.</span><span class=\"n\">tolist</span><span class=\"p\">(),</span> <span class=\"n\">size</span><span class=\"p\">):</span>\n            <span class=\"n\">contexts</span><span class=\"o\">.</span><span class=\"n\">append</span><span class=\"p\">(</span><span class=\"n\">context</span><span class=\"p\">)</span>\n            <span class=\"n\">targets</span><span class=\"o\">.</span><span class=\"n\">append</span><span class=\"p\">(</span><span class=\"n\">target</span><span class=\"p\">)</span>\n            <span class=\"n\">pbar</span><span class=\"o\">.</span><span class=\"n\">update</span><span class=\"p\">(</span><span class=\"mi\">1</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"ow\">not</span> <span class=\"n\">contexts</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"the stream holds </span><span class=\"si\">{</span><span class=\"n\">flat</span><span class=\"o\">.</span><span class=\"n\">numel</span><span class=\"p\">()</span><span class=\"si\">}</span><span class=\"s2\"> token(s); a window of </span><span class=\"si\">{</span><span class=\"n\">size</span><span class=\"si\">}</span><span class=\"s2\"> \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"needs at least window + 1 = </span><span class=\"si\">{</span><span class=\"n\">size</span><span class=\"w\"> </span><span class=\"o\">+</span><span class=\"w\"> </span><span class=\"mi\">1</span><span class=\"si\">}</span><span class=\"s2\"> to cut a single sample.\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span>\n            <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">tensor</span><span class=\"p\">(</span><span class=\"n\">contexts</span><span class=\"p\">,</span> <span class=\"n\">dtype</span><span class=\"o\">=</span><span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">long</span><span class=\"p\">),</span>\n            <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">tensor</span><span class=\"p\">(</span><span class=\"n\">targets</span><span class=\"p\">,</span> <span class=\"n\">dtype</span><span class=\"o\">=</span><span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">long</span><span class=\"p\">),</span>\n        <span class=\"p\">)</span>\n"}, "LanguageModelEmbedding": {"id": "LanguageModelEmbedding", "name": "Language Model Embedding", "cat": "Training", "desc": "First spec link of a language model: token embedding width, vocabulary size and the optional sinusoidal position encoding.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">LanguageModelEmbedding</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"The first link of a language-model spec chain: token embedding.</span>\n\n<span class=\"sd\">    What: declares the input half of the model - vocabulary size, model width</span>\n<span class=\"sd\">          and whether the fixed sinusoidal position encoding is added to the</span>\n<span class=\"sd\">          embedded tokens (on by default; a stack without recurrence needs</span>\n<span class=\"sd\">          order information, and the table has no learnable parameters). The</span>\n<span class=\"sd\">          node outputs the one-link chain that Transformer Block nodes extend.</span>\n<span class=\"sd\">    In:   spec (MODELSPEC, optional) - an existing chain whose embedding link</span>\n<span class=\"sd\">          this node replaces (the transformer blocks are kept); leave</span>\n<span class=\"sd\">          unconnected to start a fresh chain.</span>\n<span class=\"sd\">          vocab (VOCAB, optional) - link from Vocab Build to read</span>\n<span class=\"sd\">          ``vocab_size`` automatically; overrides the widget when connected.</span>\n<span class=\"sd\">          vocab_size (INT) - vocabulary size when ``vocab`` is unconnected</span>\n<span class=\"sd\">          (default 16). Must match the vocabulary the model will be trained</span>\n<span class=\"sd\">          on, or the trained head addresses the wrong token set.</span>\n<span class=\"sd\">          d_model (INT) - model width (default 32); every block of the chain</span>\n<span class=\"sd\">          uses this width and the head projects back to ``vocab_size``.</span>\n<span class=\"sd\">          include_position (BOOLEAN) - add the sinusoidal position encoding</span>\n<span class=\"sd\">          (default on).</span>\n<span class=\"sd\">    Out:  spec (MODELSPEC) - the chain starting with this embedding link.</span>\n<span class=\"sd\">          d_model (INT) - the declared width, for wiring into other nodes.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"LanguageModelEmbedding\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Language Model Embedding\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"First spec link of a language model: token embedding width, vocabulary size and the optional sinusoidal position encoding.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"language model\"</span><span class=\"p\">,</span> <span class=\"s2\">\"embedding\"</span><span class=\"p\">,</span> <span class=\"s2\">\"spec\"</span><span class=\"p\">,</span> <span class=\"s2\">\"transformer\"</span><span class=\"p\">,</span> <span class=\"s2\">\"vocab\"</span><span class=\"p\">,</span> <span class=\"s2\">\"position\"</span><span class=\"p\">,</span> <span class=\"s2\">\"lm\"</span><span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ModelSpec</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"spec\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional existing chain whose embedding link is replaced (blocks are kept); leave unconnected to start a fresh chain.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Vocab</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"vocab\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Link from Vocab Build to read vocab_size automatically; overrides the widget.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"vocab_size\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">16</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">2</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">1000000</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Vocabulary size (the VOCAB link overrides this); the output head has this many logits.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"d_model\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"n\">DEFAULT_D_MODEL</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">2</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">4096</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Model width; every transformer block of the chain shares it.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Boolean</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"include_position\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Add the fixed sinusoidal position encoding after the embedding (no learnable parameters).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ModelSpec</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"spec\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"d_model\"</span><span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">spec</span><span class=\"o\">=</span><span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">vocab</span><span class=\"o\">=</span><span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">vocab_size</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">16</span><span class=\"p\">,</span>\n        <span class=\"n\">d_model</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"n\">DEFAULT_D_MODEL</span><span class=\"p\">,</span>\n        <span class=\"n\">include_position</span><span class=\"p\">:</span> <span class=\"nb\">bool</span> <span class=\"o\">=</span> <span class=\"kc\">True</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"k\">if</span> <span class=\"n\">vocab</span> <span class=\"ow\">is</span> <span class=\"ow\">not</span> <span class=\"kc\">None</span><span class=\"p\">:</span>\n            <span class=\"n\">size</span> <span class=\"o\">=</span> <span class=\"n\">_as_vocab</span><span class=\"p\">(</span><span class=\"n\">vocab</span><span class=\"p\">)</span><span class=\"o\">.</span><span class=\"n\">size</span>\n        <span class=\"k\">else</span><span class=\"p\">:</span>\n            <span class=\"n\">size</span> <span class=\"o\">=</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">vocab_size</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">size</span> <span class=\"o\">&lt;</span> <span class=\"mi\">2</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"vocab_size must be &gt;= 2 (a one-token vocabulary has nothing \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"to predict); got </span><span class=\"si\">{</span><span class=\"n\">size</span><span class=\"si\">}</span><span class=\"s2\">.\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"n\">width</span> <span class=\"o\">=</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">d_model</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">width</span> <span class=\"o\">&lt;</span> <span class=\"mi\">2</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span><span class=\"sa\">f</span><span class=\"s2\">\"d_model must be &gt;= 2; got </span><span class=\"si\">{</span><span class=\"n\">width</span><span class=\"si\">}</span><span class=\"s2\">.\"</span><span class=\"p\">)</span>\n        <span class=\"n\">link</span> <span class=\"o\">=</span> <span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">EmbeddingSpec</span><span class=\"p\">(</span><span class=\"n\">size</span><span class=\"p\">,</span> <span class=\"n\">width</span><span class=\"p\">,</span> <span class=\"n\">include_position</span><span class=\"o\">=</span><span class=\"nb\">bool</span><span class=\"p\">(</span><span class=\"n\">include_position</span><span class=\"p\">))</span>\n        <span class=\"n\">incoming</span> <span class=\"o\">=</span> <span class=\"nb\">tuple</span><span class=\"p\">(</span><span class=\"n\">spec</span><span class=\"p\">)</span> <span class=\"k\">if</span> <span class=\"nb\">isinstance</span><span class=\"p\">(</span><span class=\"n\">spec</span><span class=\"p\">,</span> <span class=\"p\">(</span><span class=\"nb\">tuple</span><span class=\"p\">,</span> <span class=\"nb\">list</span><span class=\"p\">))</span> <span class=\"ow\">and</span> <span class=\"n\">spec</span> <span class=\"k\">else</span> <span class=\"p\">()</span>\n        <span class=\"k\">if</span> <span class=\"n\">incoming</span><span class=\"p\">:</span>\n            <span class=\"k\">if</span> <span class=\"ow\">not</span> <span class=\"nb\">isinstance</span><span class=\"p\">(</span><span class=\"n\">incoming</span><span class=\"p\">[</span><span class=\"mi\">0</span><span class=\"p\">],</span> <span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">EmbeddingSpec</span><span class=\"p\">):</span>\n                <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"the wired chain does not start with an embedding link; a \"</span>\n                    <span class=\"s2\">\"transformer block cannot come first. Feed the chain \"</span>\n                    <span class=\"s2\">\"through the Embedding node, not around it.\"</span>\n                <span class=\"p\">)</span>\n            <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">((</span><span class=\"n\">link</span><span class=\"p\">,</span> <span class=\"o\">*</span><span class=\"n\">incoming</span><span class=\"p\">[</span><span class=\"mi\">1</span><span class=\"p\">:]),</span> <span class=\"n\">width</span><span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">((</span><span class=\"n\">link</span><span class=\"p\">,),</span> <span class=\"n\">width</span><span class=\"p\">)</span>\n"}, "LanguageModelTransformerBlock": {"id": "LanguageModelTransformerBlock", "name": "Language Model Transformer Block", "cat": "Training", "desc": "Appends one pre-LN transformer block (causal self-attention + FFN) to a language-model spec chain; the width follows the embedding link.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">LanguageModelTransformerBlock</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Append one pre-LN transformer block to a language-model spec chain.</span>\n\n<span class=\"sd\">    What: one ``x + attn(LN(x))`` then ``x + ffn(LN(x))`` block - causal</span>\n<span class=\"sd\">          self-attention over ``num_heads`` heads plus a two-layer FFN with</span>\n<span class=\"sd\">          ``d_ffn`` hidden units. The width is *read from the incoming chain*</span>\n<span class=\"sd\">          (the embedding link declares it), so a mismatched block is</span>\n<span class=\"sd\">          impossible to wire. Chain as many blocks as wanted by feeding each</span>\n<span class=\"sd\">          node's ``spec`` output into the next one's ``spec`` input; the model</span>\n<span class=\"sd\">          is as deep as the chain.</span>\n<span class=\"sd\">    In:   spec (MODELSPEC) - the chain so far; must start with a Language</span>\n<span class=\"sd\">          Model Embedding link.</span>\n<span class=\"sd\">          num_heads (INT) - attention heads (default 4); must divide the chain</span>\n<span class=\"sd\">          width.</span>\n<span class=\"sd\">          d_ffn (INT) - FFN hidden width (default 128, i.e. 4x the default</span>\n<span class=\"sd\">          model width).</span>\n<span class=\"sd\">          activation (COMBO) - between the FFN linear layers, ``relu`` or</span>\n<span class=\"sd\">          ``gelu``.</span>\n<span class=\"sd\">          dropout (FLOAT) - dropout probability inside the block; active only</span>\n<span class=\"sd\">          while training (the Train node's job), 0 disables.</span>\n<span class=\"sd\">    Out:  spec (MODELSPEC) - the chain with this block appended.</span>\n<span class=\"sd\">          d_model (INT) - the chain width, unchanged (pass-through).</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"LanguageModelTransformerBlock\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Language Model Transformer Block\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Appends one pre-LN transformer block (causal self-attention + FFN) to a language-model spec chain; the width follows the embedding link.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"transformer\"</span><span class=\"p\">,</span> <span class=\"s2\">\"block\"</span><span class=\"p\">,</span> <span class=\"s2\">\"spec\"</span><span class=\"p\">,</span> <span class=\"s2\">\"language model\"</span><span class=\"p\">,</span> <span class=\"s2\">\"attention\"</span><span class=\"p\">,</span> <span class=\"s2\">\"ffn\"</span><span class=\"p\">,</span> <span class=\"s2\">\"residual\"</span><span class=\"p\">,</span> <span class=\"s2\">\"lm\"</span><span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ModelSpec</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"spec\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"The chain so far; link from Language Model Embedding (or a previous Transformer Block).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"num_heads\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">4</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">64</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Attention heads; must divide the model width read from the chain.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"d_ffn\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"n\">DEFAULT_D_FFN</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">2</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">16384</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Hidden width of the feed-forward half; 4x the model width is the classic ratio.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Combo</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"activation\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">options</span><span class=\"o\">=</span><span class=\"nb\">list</span><span class=\"p\">(</span><span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">ACTIVATION_OPTIONS</span><span class=\"p\">),</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"relu\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Activation between the two FFN linear layers.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"dropout\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">0.9</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">0.05</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Dropout inside the block (attention weights and FFN hidden); active only while training.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ModelSpec</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"spec\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"d_model\"</span><span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">spec</span><span class=\"p\">,</span>\n        <span class=\"n\">num_heads</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">4</span><span class=\"p\">,</span>\n        <span class=\"n\">d_ffn</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"n\">DEFAULT_D_FFN</span><span class=\"p\">,</span>\n        <span class=\"n\">activation</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"s2\">\"relu\"</span><span class=\"p\">,</span>\n        <span class=\"n\">dropout</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">0.0</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">chain</span> <span class=\"o\">=</span> <span class=\"n\">_as_chain</span><span class=\"p\">(</span><span class=\"n\">spec</span><span class=\"p\">)</span>\n        <span class=\"n\">width</span> <span class=\"o\">=</span> <span class=\"n\">_chain_width</span><span class=\"p\">(</span><span class=\"n\">chain</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">width</span> <span class=\"ow\">is</span> <span class=\"kc\">None</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"s2\">\"the incoming chain does not start with a Language Model \"</span>\n                <span class=\"s2\">\"Embedding link; a transformer block must follow one.\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"n\">block</span> <span class=\"o\">=</span> <span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">TransformerBlockSpec</span><span class=\"p\">(</span>\n            <span class=\"n\">d_model</span><span class=\"o\">=</span><span class=\"n\">width</span><span class=\"p\">,</span>\n            <span class=\"n\">num_heads</span><span class=\"o\">=</span><span class=\"nb\">max</span><span class=\"p\">(</span><span class=\"mi\">1</span><span class=\"p\">,</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">num_heads</span><span class=\"p\">)),</span>\n            <span class=\"n\">d_ffn</span><span class=\"o\">=</span><span class=\"nb\">max</span><span class=\"p\">(</span><span class=\"mi\">2</span><span class=\"p\">,</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">d_ffn</span><span class=\"p\">)),</span>\n            <span class=\"n\">activation</span><span class=\"o\">=</span><span class=\"n\">activation</span><span class=\"p\">,</span>\n            <span class=\"n\">dropout</span><span class=\"o\">=</span><span class=\"nb\">min</span><span class=\"p\">(</span><span class=\"nb\">max</span><span class=\"p\">(</span><span class=\"nb\">float</span><span class=\"p\">(</span><span class=\"n\">dropout</span><span class=\"p\">),</span> <span class=\"mf\">0.0</span><span class=\"p\">),</span> <span class=\"mf\">0.9</span><span class=\"p\">),</span>\n        <span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">((</span><span class=\"o\">*</span><span class=\"n\">chain</span><span class=\"p\">,</span> <span class=\"n\">block</span><span class=\"p\">),</span> <span class=\"n\">width</span><span class=\"p\">)</span>\n"}, "LanguageModelBuild": {"id": "LanguageModelBuild", "name": "Language Model Build", "cat": "Training", "desc": "Materialises a spec chain into a seeded nn.Module language model and reports its parameter count.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">LanguageModelBuild</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Materialise a spec chain into a real, seeded language model.</span>\n\n<span class=\"sd\">    What: the bridge from the blueprint to the ``nn_model`` slot. Validates the</span>\n<span class=\"sd\">          chain (embedding first, consistent width, heads divide the width),</span>\n<span class=\"sd\">          builds the module and initialises it deterministically from ``seed``</span>\n<span class=\"sd\">          - Xavier-uniform linear weights, zero biases, N(0, 0.01) embeddings -</span>\n<span class=\"sd\">          inside a save-and-restore RNG block, so the same chain and seed</span>\n<span class=\"sd\">          always produce the same weights and the process RNG stays untouched.</span>\n<span class=\"sd\">    In:   spec (MODELSPEC) - the finished chain (embedding link + any number</span>\n<span class=\"sd\">          of transformer blocks; zero blocks make a bag-of-contexts linear</span>\n<span class=\"sd\">          model, which is itself an instructive baseline).</span>\n<span class=\"sd\">          seed (INT) - the initialisation seed.</span>\n<span class=\"sd\">    Out:  model (nn_model) - the untrained model, ready for Language Model</span>\n<span class=\"sd\">          Train / Forward / Generate.</span>\n<span class=\"sd\">          params (INT) - the total trainable parameter count.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"LanguageModelBuild\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Language Model Build\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Materialises a spec chain into a seeded nn.Module language model and reports its parameter count.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"build\"</span><span class=\"p\">,</span> <span class=\"s2\">\"materialise\"</span><span class=\"p\">,</span> <span class=\"s2\">\"language model\"</span><span class=\"p\">,</span> <span class=\"s2\">\"spec\"</span><span class=\"p\">,</span> <span class=\"s2\">\"xavier\"</span><span class=\"p\">,</span> <span class=\"s2\">\"init\"</span><span class=\"p\">,</span> <span class=\"s2\">\"lm\"</span><span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ModelSpec</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"spec\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"The spec chain to materialise; link from Language Model Embedding / Transformer Block.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"seed\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"n\">_FF</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">control_after_generate</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Initialisation seed; the same chain and seed always build the same weights.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NNModel</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"model\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"params\"</span><span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">spec</span><span class=\"p\">,</span> <span class=\"n\">seed</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">0</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">model</span> <span class=\"o\">=</span> <span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">build_model</span><span class=\"p\">(</span><span class=\"n\">_as_chain</span><span class=\"p\">(</span><span class=\"n\">spec</span><span class=\"p\">),</span> <span class=\"n\">seed</span><span class=\"o\">=</span><span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">seed</span><span class=\"p\">))</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">model</span><span class=\"p\">,</span> <span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">parameter_count</span><span class=\"p\">(</span><span class=\"n\">model</span><span class=\"p\">))</span>\n"}, "LanguageModelTrain": {"id": "LanguageModelTrain", "name": "Language Model Train", "cat": "Training", "desc": "Trains a language model on (context, next-token) samples inside the node: forward + backward + optimizer.step per step, returning a new trained model and the loss history.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">LanguageModelTrain</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Train a language model on next-token samples, inside the node.</span>\n\n<span class=\"sd\">    What: the training closure. ComfyUI executes every node under</span>\n<span class=\"sd\">          ``torch.inference_mode()`` and caches the result, so a gradient</span>\n<span class=\"sd\">          cannot survive a node boundary: this node therefore runs forward,</span>\n<span class=\"sd\">          backward and ``optimizer.step()`` itself, for ``steps`` iterations,</span>\n<span class=\"sd\">          on a *deep copy* of the input model - the cached input stays</span>\n<span class=\"sd\">          untouched and the node returns a new trained model.           The loss is</span>\n<span class=\"sd\">          token-level cross entropy computed at every position: each context</span>\n<span class=\"sd\">          token predicts its successor and the last position predicts the</span>\n<span class=\"sd\">          wired ``y``, so one sample trains ``window`` predictions at once.</span>\n<span class=\"sd\">          Three optional per-iteration pieces: a wired ``SCHEDULER`` is stepped</span>\n<span class=\"sd\">          after every ``optimizer.step()`` (``ReduceLROnPlateau`` with the</span>\n<span class=\"sd\">          smoothed step loss, the others without arguments), gradient clipping</span>\n<span class=\"sd\">          travels in the ``OPTIMIZER`` config (``grad_clip_norm`` /</span>\n<span class=\"sd\">          ``grad_clip_value``, 0 = off) and runs right before the step, and</span>\n<span class=\"sd\">          early stopping watches the moving average of the step loss (window 8):</span>\n<span class=\"sd\">          once ``early_stop_patience`` steps pass without an improvement of</span>\n<span class=\"sd\">          ``early_stop_min_delta``, the copy's parameters are rolled back to the</span>\n<span class=\"sd\">          best point and the run ends there.</span>\n<span class=\"sd\">          While training, the node also drives ComfyUI's live preview channel:</span>\n<span class=\"sd\">          the cross-entropy curve recorded so far is rendered (rate-limited to</span>\n<span class=\"sd\">          one frame per ~0.5 s, always a final frame at the end) and shown</span>\n<span class=\"sd\">          under the node - the same side channel the KSampler latent preview</span>\n<span class=\"sd\">          uses.</span>\n<span class=\"sd\">    In:   model (nn_model) - link from Language Model Build (or another Train</span>\n<span class=\"sd\">          node, to continue training).</span>\n<span class=\"sd\">          x (TENSOR) - ``(samples, window)`` long contexts; link from Sliding</span>\n<span class=\"sd\">          Window's ``x``.</span>\n<span class=\"sd\">          y (TENSOR) - ``(samples,)`` long next tokens; link from Sliding</span>\n<span class=\"sd\">          Window's ``y``. An ``(N, L)`` tensor aligned with ``x`` is also</span>\n<span class=\"sd\">          accepted.</span>\n<span class=\"sd\">          optimizer (OPTIMIZER) - settings published by an Optimizer node,</span>\n<span class=\"sd\">          including the gradient clipping widgets.</span>\n<span class=\"sd\">          scheduler (SCHEDULER, optional) - settings published by an</span>\n<span class=\"sd\">          ``LR Scheduler`` node. Unconnected means a constant learning rate,</span>\n<span class=\"sd\">          exactly like before this slot existed.</span>\n<span class=\"sd\">          steps (INT) - optimizer steps (default 300; each step is one</span>\n<span class=\"sd\">          forward + backward + update on the chosen batch).</span>\n<span class=\"sd\">          batch_size (INT) - samples per step; ``0`` (default) uses the whole</span>\n<span class=\"sd\">          dataset every step, the most stable choice for small teaching data.</span>\n<span class=\"sd\">          seed (INT) - seeds the dropout draws and the batch shuffling, so the</span>\n<span class=\"sd\">          same inputs always produce the same run.</span>\n<span class=\"sd\">          early_stop_patience (INT) - stop after this many steps without an</span>\n<span class=\"sd\">          improvement of the smoothed loss; 0 (the default) disables early</span>\n<span class=\"sd\">          stopping.</span>\n<span class=\"sd\">          early_stop_min_delta (FLOAT) - the smallest improvement of the</span>\n<span class=\"sd\">          smoothed loss that resets the patience counter.</span>\n<span class=\"sd\">    Out:  model (nn_model) - the trained copy, in eval mode (dropout off); with</span>\n<span class=\"sd\">          early stopping it holds the parameters of the *best* step, not the</span>\n<span class=\"sd\">          last one.</span>\n<span class=\"sd\">          loss (FLOAT) - the last entry of the (possibly truncated) loss</span>\n<span class=\"sd\">          history.</span>\n<span class=\"sd\">          loss_history (TENSOR) - 1-D, one entry per executed step; with early</span>\n<span class=\"sd\">          stopping it is truncated to the best step. The convergence curve,</span>\n<span class=\"sd\">          ready for any of the visualisation nodes.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"LanguageModelTrain\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Language Model Train\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Trains a language model on (context, next-token) samples inside the node: forward + backward + optimizer.step per step, returning a new trained model and the loss history.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"train\"</span><span class=\"p\">,</span> <span class=\"s2\">\"language model\"</span><span class=\"p\">,</span> <span class=\"s2\">\"fit\"</span><span class=\"p\">,</span> <span class=\"s2\">\"gradient descent\"</span><span class=\"p\">,</span> <span class=\"s2\">\"backward\"</span><span class=\"p\">,</span> <span class=\"s2\">\"cross entropy\"</span><span class=\"p\">,</span> <span class=\"s2\">\"lm\"</span><span class=\"p\">,</span> <span class=\"s2\">\"loss\"</span><span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NNModel</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"model\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"The model to train; link from Language Model Build (or a previous Train).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"x\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"(samples, window) long contexts; link from Sliding Window's x.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"y\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"(samples,) long next tokens; link from Sliding Window's y.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Optimizer</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"optimizer\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optimizer settings, linked from an Optimizer node.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Scheduler</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"scheduler\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional LR scheduler settings from an LR Scheduler node; unconnected = constant learning rate.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"steps\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">300</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">100000</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Number of optimizer steps (one forward + backward + update each).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"batch_size\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">65536</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Samples per step; 0 uses the whole dataset every step.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"seed\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"n\">_FF</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">control_after_generate</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Seeds the dropout draws and the batch shuffling; the same seed reproduces the same run.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"early_stop_patience\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">100000</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Stop after this many steps without an improvement of the smoothed loss; 0 disables early stopping.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"early_stop_min_delta\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">1e-4</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">1.0</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">1e-4</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Smallest improvement of the smoothed loss that resets the patience counter.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NNModel</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"model\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"loss\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"loss_history\"</span><span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">model</span><span class=\"p\">,</span>\n        <span class=\"n\">x</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">y</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">optimizer</span><span class=\"p\">,</span>\n        <span class=\"n\">scheduler</span><span class=\"o\">=</span><span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">steps</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">300</span><span class=\"p\">,</span>\n        <span class=\"n\">batch_size</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">0</span><span class=\"p\">,</span>\n        <span class=\"n\">seed</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">0</span><span class=\"p\">,</span>\n        <span class=\"n\">early_stop_patience</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">0</span><span class=\"p\">,</span>\n        <span class=\"n\">early_stop_min_delta</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">1e-4</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">source</span> <span class=\"o\">=</span> <span class=\"n\">_as_language_model</span><span class=\"p\">(</span><span class=\"n\">model</span><span class=\"p\">)</span>\n        <span class=\"n\">config</span> <span class=\"o\">=</span> <span class=\"n\">_as_optimizer</span><span class=\"p\">(</span><span class=\"n\">optimizer</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">scheduler</span> <span class=\"ow\">is</span> <span class=\"ow\">not</span> <span class=\"kc\">None</span> <span class=\"ow\">and</span> <span class=\"ow\">not</span> <span class=\"nb\">isinstance</span><span class=\"p\">(</span><span class=\"n\">scheduler</span><span class=\"p\">,</span> <span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">SchedulerConfig</span><span class=\"p\">):</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span>\n                <span class=\"s2\">\"the 'scheduler' slot did not receive an LR Scheduler node; \"</span>\n                <span class=\"s2\">\"keeping the learning rate constant.\"</span>\n            <span class=\"p\">)</span>\n            <span class=\"n\">scheduler</span> <span class=\"o\">=</span> <span class=\"kc\">None</span>\n\n        <span class=\"k\">if</span> <span class=\"n\">x</span><span class=\"o\">.</span><span class=\"n\">dim</span><span class=\"p\">()</span> <span class=\"o\">!=</span> <span class=\"mi\">2</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"'x' must be a 2-D (samples, window) tensor; got shape </span><span class=\"si\">{</span><span class=\"nb\">tuple</span><span class=\"p\">(</span><span class=\"n\">x</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\">.\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"n\">contexts</span> <span class=\"o\">=</span> <span class=\"n\">_as_index_tensor</span><span class=\"p\">(</span><span class=\"n\">x</span><span class=\"p\">,</span> <span class=\"s2\">\"x\"</span><span class=\"p\">)</span><span class=\"o\">.</span><span class=\"n\">reshape</span><span class=\"p\">(</span><span class=\"n\">x</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">)</span>\n        <span class=\"n\">samples</span> <span class=\"o\">=</span> <span class=\"n\">contexts</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">[</span><span class=\"mi\">0</span><span class=\"p\">]</span>\n        <span class=\"n\">targets_flat</span> <span class=\"o\">=</span> <span class=\"n\">_as_index_tensor</span><span class=\"p\">(</span><span class=\"n\">y</span><span class=\"p\">,</span> <span class=\"s2\">\"y\"</span><span class=\"p\">)</span>\n\n        <span class=\"c1\"># Vocab guard: indices outside the model's head are a wiring error.</span>\n        <span class=\"n\">head</span> <span class=\"o\">=</span> <span class=\"n\">source</span><span class=\"o\">.</span><span class=\"n\">vocab_size</span>\n        <span class=\"k\">if</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">contexts</span><span class=\"o\">.</span><span class=\"n\">max</span><span class=\"p\">()</span><span class=\"o\">.</span><span class=\"n\">item</span><span class=\"p\">())</span> <span class=\"o\">&gt;=</span> <span class=\"n\">head</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"'x' holds a token index &gt;= the model's vocabulary size \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"(</span><span class=\"si\">{</span><span class=\"n\">head</span><span class=\"si\">}</span><span class=\"s2\">); the vocab and the model's embedding link do not \"</span>\n                <span class=\"s2\">\"match.\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"n\">targets</span> <span class=\"o\">=</span> <span class=\"n\">_targets_for</span><span class=\"p\">(</span><span class=\"n\">contexts</span><span class=\"p\">,</span> <span class=\"n\">targets_flat</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">targets</span><span class=\"o\">.</span><span class=\"n\">max</span><span class=\"

   <span class=\"n\">batch</span> <span class=\"o\">=</span> <span class=\"n\">_as_index_tensor</span><span class=\"p\">(</span><span class=\"n\">ids</span><span class=\"p\">,</span> <span class=\"s2\">\"ids\"</span><span class=\"p\">)</span><span class=\"o\">.</span><span class=\"n\">unsqueeze</span><span class=\"p\">(</span><span class=\"mi\">0</span><span class=\"p\">)</span>\n        <span class=\"k\">else</span><span class=\"p\">:</span>\n            <span class=\"n\">batch</span> <span class=\"o\">=</span> <span class=\"n\">_as_index_tensor</span><span class=\"p\">(</span><span class=\"n\">ids</span><span class=\"p\">,</span> <span class=\"s2\">\"ids\"</span><span class=\"p\">)</span><span class=\"o\">.</span><span class=\"n\">reshape</span><span class=\"p\">(</span><span class=\"o\">-</span><span class=\"mi\">1</span><span class=\"p\">,</span> <span class=\"n\">ids</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">[</span><span class=\"o\">-</span><span class=\"mi\">1</span><span class=\"p\">])</span>\n        <span class=\"n\">was_training</span> <span class=\"o\">=</span> <span class=\"n\">trainee</span><span class=\"o\">.</span><span class=\"n\">training</span>\n        <span class=\"n\">trainee</span><span class=\"o\">.</span><span class=\"n\">eval</span><span class=\"p\">()</span>\n        <span class=\"k\">try</span><span class=\"p\">:</span>\n            <span class=\"k\">with</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">no_grad</span><span class=\"p\">():</span>\n                <span class=\"n\">logits</span> <span class=\"o\">=</span> <span class=\"n\">trainee</span><span class=\"p\">(</span><span class=\"n\">batch</span><span class=\"p\">)</span>\n        <span class=\"k\">finally</span><span class=\"p\">:</span>\n            <span class=\"n\">trainee</span><span class=\"o\">.</span><span class=\"n\">train</span><span class=\"p\">(</span><span class=\"n\">was_training</span><span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">logits</span><span class=\"p\">)</span>\n"}, "LanguageModelGenerate": {"id": "LanguageModelGenerate", "name": "Language Model Generate", "cat": "Training", "desc": "Autoregressive continuation of a prefix: greedy or temperature-sampled next tokens, seeded locally, with optional text decode through a vocabulary.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">LanguageModelGenerate</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Autoregressive continuation: the \"talk to your model\" node.</span>\n\n<span class=\"sd\">    What: repeatedly takes the model's next-token distribution and appends the</span>\n<span class=\"sd\">          chosen token - ``num_tokens`` times - starting from a prefix. The</span>\n<span class=\"sd\">          prefix comes from ``prefix_ids`` when wired, otherwise from the</span>\n<span class=\"sd\">          ``prefix`` text through ``vocab`` (encode). ``temperature`` controls</span>\n<span class=\"sd\">          the sampler: 0 (or any value &lt;= 0) is deterministic greedy argmax,</span>\n<span class=\"sd\">          1.0 samples the plain softmax, below 1 sharpens toward the argmax,</span>\n<span class=\"sd\">          above 1 flattens toward uniform. The sampling runs on a local</span>\n<span class=\"sd\">          ``torch.Generator`` seeded by ``seed`` - the same inputs always</span>\n<span class=\"sd\">          reproduce the same continuation.</span>\n<span class=\"sd\">          While generating, the node also drives ComfyUI's live preview</span>\n<span class=\"sd\">          channel: the text generated so far is rendered onto a small card</span>\n<span class=\"sd\">          (rate-limited to one frame per ~0.5 s, always a final frame at the</span>\n<span class=\"sd\">          end) and shown under the node - the same side channel the KSampler</span>\n<span class=\"sd\">          latent preview uses. Needs a wired ``vocab`` to decode; without one</span>\n<span class=\"sd\">          the preview shows the raw token indices instead.</span>\n<span class=\"sd\">    In:   model (nn_model) - link from Language Model Train (a trained model</span>\n<span class=\"sd\">          generates text; an untrained one generates noise).</span>\n<span class=\"sd\">          vocab (VOCAB, optional) - link from Vocab Build to read the ``prefix``</span>\n<span class=\"sd\">          text and decode the ``text`` output. Without it the node still</span>\n<span class=\"sd\">          generates - indices in, indices out.</span>\n<span class=\"sd\">          prefix (STRING) - the prompt text, encoded through ``vocab``; used</span>\n<span class=\"sd\">          when ``prefix_ids`` is unconnected.</span>\n<span class=\"sd\">          prefix_ids (TENSOR, optional) - token indices to start from;</span>\n<span class=\"sd\">          overrides ``prefix`` when wired.</span>\n<span class=\"sd\">          num_tokens (INT) - how many tokens to generate (default 16).</span>\n<span class=\"sd\">          temperature (FLOAT) - sampling temperature; 0 = greedy (default</span>\n<span class=\"sd\">          1.0).</span>\n<span class=\"sd\">          seed (INT) - seed of the sampling generator.</span>\n<span class=\"sd\">    Out:  ids (TENSOR) - 1-D long: the prefix followed by the generated</span>\n<span class=\"sd\">          tokens.</span>\n<span class=\"sd\">          text (STRING) - the decoded continuation (prefix included); empty</span>\n<span class=\"sd\">          when ``vocab`` is unconnected.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"LanguageModelGenerate\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Language Model Generate\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Autoregressive continuation of a prefix: greedy or temperature-sampled next tokens, seeded locally, with optional text decode through a vocabulary.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"generate\"</span><span class=\"p\">,</span> <span class=\"s2\">\"autoregressive\"</span><span class=\"p\">,</span> <span class=\"s2\">\"sample\"</span><span class=\"p\">,</span> <span class=\"s2\">\"language model\"</span><span class=\"p\">,</span> <span class=\"s2\">\"text\"</span><span class=\"p\">,</span> <span class=\"s2\">\"chat\"</span><span class=\"p\">,</span> <span class=\"s2\">\"continue\"</span><span class=\"p\">,</span> <span class=\"s2\">\"lm\"</span><span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NNModel</span><span class=\"o\">.</span><span class=\"n\">Input</span><span clas .0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">10.0</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">0.05</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Sampling temperature: 0 = greedy argmax, 1.0 = plain softmax, &lt;1 sharper, &gt;1 flatter.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"seed\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"n\">_FF</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">control_after_generate</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Seed of the sampling generator; the same seed and prefix reproduce the same continuation.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"ids\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"text\"</span><span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">model</span><span class=\"p\">,</span>\n        <span class=\"n\">vocab</span><span class=\"o\">=</span><span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">prefix</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"s2\">\"the \"</span><span class=\"p\">,</span>\n        <span class=\"n\">prefix_ids</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">num_tokens</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">16</span><span class=\"p\">,</span>\n        <span class=\"n\">temperature</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">1.0</span><span class=\"p\">,</span>\n        <span class=\"n\">seed</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">0</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">trainee</span> <span class=\"o\">=</span> <span class=\"n\">_as_language_model</span><span class=\"p\">(</span><span class=\"n\">model</span><span class=\"p\">)</span>\n\n        <span class=\"k\">if</span> <span class=\"n\">prefix_ids</span> <span class=\"ow\">is</span> <span class=\"ow\">not</span> <span class=\"kc\">None</span><span class=\"p\">:</span>\n            <span class=\"n\">table</span> <span class=\"o\">=</span> <span class=\"n\">_as_vocab</span><span class=\"p\">(</span><span class=\"n\">vocab</span><span class=\"p\">)</span> <span class=\"k\">if</span> <span class=\"n\">vocab</span> <span class=\"ow\">is</span> <span class=\"ow\">not</span> <span class=\"kc\">None</span> <span class=\"k\">else</span> <span class=\"kc\">None</span>\n            <span class=\"n\">start</span> <span class=\"o\">=</span> <span class=\"n\">_as_index_tensor</span><span class=\"p\">(</span><span class=\"n\">prefix_ids</span><span class=\"p\">,</span> <span class=\"s2\">\"prefix_ids\"</span><span class=\"p\">)</span><span class=\"o\">.</span><span class=\"n\">tolist</span><span class=\"p\">()</span>\n        <span class=\"k\">elif</span> <span class=\"n\">vocab</span> <span class=\"ow\">is</span> <span class=\"ow\">not</span> <span class=\"kc\">None</span><span class=\"p\">:</span>\n            <span class=\"n\">table</span> <span class=\"o\">=</span> <span class=\"n\">_as_vocab</span><span class=\"p\">(</span><span class=\"n\">vocab</span><span class=\"p\">)</span>\n            <span class=\"n\">start</span> <span class=\"o\">=</span> <span class=\"n\">table</span><span class=\"o\">.</span><span class=\"n\">encode</span><span class=\"p\">(</span><span class=\"s2\">\"\"</span> <span class=\"k\">if</span> <span class=\"n\">prefix</span> <span class=\"ow\">is</span> <span class=\"kc\">None</span> <span class=\"k\">else</span> <span class=\"nb\">str</span><span class=\"p\">(</span><span class=\"n\">prefix</span><span class=\"p\">))</span>\n        <span class=\"k\">else</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"s2\">\"the node needs either a wired 'prefix_ids' tensor or a linked \"</span>\n                <span class=\"s2\">\"'vocab' to encode the 'prefix' text; neither was found.\"</span>\n            <span class=\"p\">)</span>\n\n        <span class=\"n\">head</span> <span class=\"o\">=</span> <span class=\"n\">trainee</span><span class=\"o\">.</span><span class=\"n\">vocab_size</span>\n        <span class=\"k\">if</span> <span class=\"n\">start</span> <span class=\"ow\">and</span> <span class=\"nb\">max</span><span class=\"p\">(</span><span class=\"n\">start</span><span class=\"p\">)</span> <span class=\"o\">&gt;=</span> <span class=\"n\">head</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"the prefix holds a token index &gt;= the model's vocabulary size \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"(</span><span class=\"si\">{</span><span class=\"n\">head</span><span class=\"si\">}</span><span class=\"s2\">); the vocab and the model's embedding link do not match.\"</span>\n            <span class=\"p\">)</span>\n\n        <span class=\"n\">count</span> <span class=\"o\">=</span> <span class=\"nb\">max</span><span class=\"p\">(</span><span class=\"mi\">1</span><span class=\"p\">,</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">num_tokens</span><span class=\"p\">))</span>\n        <span class=\"c1\"># Live progress: one update per generated token.  The ProgressBar hook</span>\n        <span class=\"c1\"># binds itself to the executing node and doubles as the interrupt check</span>\n        <span class=\"c1\"># (model_management.throw_exception_if_processing_interrupted), so a</span>\n        <span class=\"c1\"># long generation stays cancellable from the UI.  The preview triple</span>\n        <span class=\"c1\"># attaches the live text card: the tokens generated so far, decoded</span>\n        <span class=\"c1\"># and rendered (rate-limited; the last token always renders, so the</span>\n        <span class=\"c1\"># final frame is the complete text).</span>\n        <span class=\"n\">pbar</span> <span class=\"o\">=</span> <span class=\"n\">comfy</span><span class=\"o\">.</span><span class=\"n\">utils</span><span class=\"o\">.</span><span class=\"n\">ProgressBar</span><span class=\"p\">(</span><span class=\"n\">count</span><span class=\"p\">)</span>\n        <span class=\"n\">prefix_text</span> <span class=\"o\">=</span> <span class=\"n\">table</span><span class=\"o\">.</span><span class=\"n\">decode</span><span class=\"p\">(</span><span class=\"n\">start</span><span class=\"p\">)</span> <span class=\"k\">if</span> <span class=\"n\">table</span> <span class=\"ow\">is</span> <span class=\"ow\">not</span> <span class=\"kc\">None</span> <span class=\"k\">else</span> <span class=\"s2\">\"\"</span>\n        <span class=\"n\">generated</span><span class=\"p\">:</span> <span class=\"nb\">list</span><span class=\"p\">[</span><span class=\"nb\">int</span><span class=\"p\">]</span> <span class=\"o\">=</span> <span class=\"p\">[]</span>\n        <span class=\"n\">last_render</span> <span class=\"o\">=</span> <span class=\"mf\">0.0</span>\n\n        <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">_snapshot</span><span class=\"p\">(</span><span class=\"n\">done</span><span class=\"p\">:</span> <span class=\"nb\">int</span><span class=\"p\">,</span> <span class=\"n\">force</span><span class=\"p\">:</span> <span class=\"nb\">bool</span> <span class=\"o\">=</span> <span class=\"kc\">False</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"nb\">tuple</span> <span class=\"o\">|</span> <span class=\"kc\">None</span><span class=\"p\">:</span>\n            <span class=\"k\">nonlocal</span> <span class=\"n\">last_render</span>\n            <span class=\"n\">now</span> <span class=\"o\">=</span> <span class=\"n\">time</span><span class=\"o\">.</span><span class=\"n\">perf_counter</span><span class=\"p\">()</span>\n            <span class=\"k\">if</span> <span class=\"ow\">not</span> <span class=\"n\">force</span> <span class=\"ow\">and</span> <span class=\"n\">now</span> <span class=\"o\">-</span> <span class=\"n\">last_render</span> <span class=\"o\">&lt;</span> <span class=\"n\">loss_preview</span><span class=\"o\">.</span><span class=\"n\">MIN_RENDER_INTERVAL</span><span class=\"p\">:</span>\n                <span class=\"k\">return</span> <span class=\"kc\">None</span>\n            <span class=\"n\">last_render</span> <span class=\"o\">=</span> <span class=\"n\">now</span>\n            <span class=\"k\">if</span> <span class=\"n\">table</span> <span class=\"ow\">is</span> <span class=\"ow\">not</span> <span class=\"kc\">None</span><span class=\"p\">:</span>\n                <span class=\"n\">body</span> <span class=\"o\">=</span> <span class=\"n\">prefix_text</span> <span class=\"o\">+</span> <span class=\"n\">table</span><span class=\"o\">.</span><span class=\"n\">decode</span><span class=\"p\">(</span><span class=\"n\">generated</span><span class=\"p\">)</span>\n            <span class=\"k\">else</span><span class=\"p\">:</span>\n                <span class=\"n\">body</span> <span class=\"o\">=</span> <span class=\"s2\">\" \"</span><span class=\"o\">.</span><span class=\"n\">join</span><span class=\"p\">(</span><span class=\"nb\">str</span><span class=\"p\">(</span><span class=\"n\">index</span><span class=\"p\">)</span> <span class=\"k\">for</span> <span class=\"n\">index</span> <span class=\"ow\">in</span> <span class=\"n\">generated</span><span class=\"p\">)</span>\n            <span class=\"k\">return</span> <span class=\"n\">loss_preview</span><span class=\"o\">.</span><span class=\"n\">render_text_snapshot</span><span class=\"p\">(</span>\n                <span class=\"n\">body</span><span class=\"p\">,</span> <span class=\"n\">title</span><span class=\"o\">=</span><span class=\"sa\">f</span><span class=\"s2\">\"generated </span><span class=\"si\">{</span><span class=\"n\">done</span><span class=\"si\">}</span><span class=\"s2\">/</span><span class=\"si\">{</span><span class=\"n\">count</span><span class=\"si\">}</span><span class=\"s2\">\"</span>\n            <span class=\"p\">)</span>\n\n        <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">_on_token</span><span class=\"p\">(</span><span class=\"n\">token_id</span><span class=\"p\">:</span> <span class=\"nb\">int</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"kc\">None</span><span class=\"p\">:</span>\n            <span class=\"n\">generated</span><span class=\"o\">.</span><span class=\"n\">append</span><span class=\"p\">(</span><span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">token_id</span><span class=\"p\">))</span>\n            <span class=\"n\">done</span> <span class=\"o\">=</span> <span class=\"nb\">len</span><span class=\"p\">(</span><span class=\"n\">generated</span><span class=\"p\">)</span>\n            <span class=\"n\">frame</span> <span class=\"o\">=</span> <span class=\"n\">_snapshot</span><span class=\"p\">(</span><span class=\"n\">done</span><span class=\"p\">,</span> <span class=\"n\">force</span><span class=\"o\">=</span><span class=\"p\">(</span><span class=\"n\">done</span> <span class=\"o\">==</span> <span class=\"n\">count</span><span class=\"p\">))</span>\n            <span class=\"k\">if</span> <span class=\"n\">frame</span> <span class=\"ow\">is</span> <span class=\"ow\">not</span> <span class=\"kc\">None</span><span class=\"p\">:</span>\n                <span class=\"n\">pbar</span><span class=\"o\">.</span><span class=\"n\">update_absolute</span><span class=\"p\">(</span><span class=\"n\">done</span><span class=\"p\">,</span> <span class=\"n\">count</span><span class=\"p\">,</span> <span class=\"n\">frame</span><span class=\"p\">)</span>\n            <span class=\"k\">else</span><span class=\"p\">:</span>\n                <span class=\"n\">pbar</span><span class=\"o\">.</span><span class=\"n\">update_absolute</span><span class=\"p\">(</span><span class=\"n\">done</span><span class=\"p\">,</span> <span class=\"n\">count</span><span class=\"p\">)</span>\n\n        <span class=\"n\">ids</span> <span class=\"o\">=</span> <span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">generate_tokens</span><span class=\"p\">(</span>\n            <span class=\"n\">trainee</span><span class=\"p\">,</span>\n            <span class=\"n\">start</span><span class=\"p\">,</span>\n            <span class=\"n\">num_tokens</span><span class=\"o\">=</span><span class=\"n\">count</span><span class=\"p\">,</span>\n            <span class=\"n\">temperature</span><span class=\"o\">=</span><span class=\"nb\">float</span><span class=\"p\">(</span><span class=\"n\">temperature</span><span class=\"p\">),</span>\n            <span class=\"n\">seed</span><span class=\"o\">=</span><span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">seed</span><span class=\"p\">),</span>\n            <span class=\"n\">on_token</span><span class=\"o\">=</span><span class=\"n\">_on_token</span><span class=\"p\">,</span>\n        <span class=\"p\">)</span>\n        <span class=\"n\">text</span> <span class=\"o\">=</span> <span class=\"n\">table</span><span class=\"o\">.</span><span class=\"n\">decode</span><span class=\"p\">(</span><span class=\"n\">ids</span><span class=\"o\">.</span><span class=\"n\">tolist</span><span class=\"p\">())</span> <span class=\"k\">if</span> <span class=\"n\">table</span> <span class=\"ow\">is</span> <span class=\"ow\">not</span> <span class=\"kc\">None</span> <span class=\"k\">else</span> <span class=\"s2\">\"\"</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">ids</span><span class=\"p\">,</span> <span class=\"n\">text</span><span class=\"p\">)</span>\n"}, "LanguageModelSave": {"id": "LanguageModelSave", "name": "Save Language Model", "cat": "Training", "desc": "Saves a language model as a .safetensors file in the output folder (spec chain and vocabulary in the metadata), and passes the model through.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">LanguageModelSave</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Persist a language model to a ``.safetensors`` file, vocabulary and all.</span>\n\n<span class=\"sd\">    What: the file half of the language-model persistence story - the trained</span>\n<span class=\"sd\">          weights are written as an ordinary checkpoint that survives</span>\n<span class=\"sd\">          restarts and can be copied between machines, and the model's</span>\n<span class=\"sd\">          blueprint (spec chain) plus its vocabulary travel in the same</span>\n<span class=\"sd\">          file's metadata. ``Load Language Model`` can therefore rebuild the</span>\n<span class=\"sd\">          exact model and talk text again without re-running Vocab Build or</span>\n<span class=\"sd\">          re-wiring the spec chain. The node passes the model through, so</span>\n<span class=\"sd\">          saving does not end the graph.</span>\n<span class=\"sd\">    In:   model (nn_model) - the model to write; link from Language Model Train</span>\n<span class=\"sd\">          (an untrained Build output saves too - it is just a checkpoint of</span>\n<span class=\"sd\">          the initial weights).</span>\n<span class=\"sd\">          vocab (VOCAB) - the vocabulary the model was trained with; it is</span>\n<span class=\"sd\">          stored in the file and read back by Load, so generation in a later</span>\n<span class=\"sd\">          session works from text prompt to text reply.</span>\n<span class=\"sd\">          filename_prefix (STRING) - output subfolder and file stem, e.g.</span>\n<span class=\"sd\">          ``\"comfydl/language_models\"``; a counter is appended</span>\n<span class=\"sd\">          (``language_models_00001_.safetensors``) so an earlier save is</span>\n<span class=\"sd\">          never overwritten.</span>\n<span class=\"sd\">    Out:  model (nn_model) - the same model, passed through unchanged so the</span>\n<span class=\"sd\">          graph can continue (e.g. straight into Language Model Generate).</span>\n<span class=\"sd\">          path (STRING) - absolute path of the file that was written; paste it</span>\n<span class=\"sd\">          into the ``path`` widget of ``Load Language Model`` to read the</span>\n<span class=\"sd\">          model back later.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"LanguageModelSave\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Save Language Model\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Saves a language model as a .safetensors file in the output folder (spec chain and vocabulary in the metadata), and passes the model through.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">is_output_node</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"s2\">\"save\"</span><span class=\"p\">,</span> <span class=\"s2\">\"write\"</span><span class=\"p\">,</span> <span class=\"s2\">\"checkpoint\"</span><span class=\"p\">,</span> <span class=\"s2\">\"safetensors\"</span><span class=\"p\">,</span> <span class=\"s2\">\"export\"</span><span class=\"p\">,</span>\n                <span class=\"s2\">\"language model\"</span><span class=\"p\">,</span> <span class=\"s2\">\"lm\"</span><span class=\"p\">,</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NNModel</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"model\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"The model to write; link from Language Model Train / Build.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Vocab</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"vocab\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"The vocabulary to store alongside the weights; Load reads it back so a saved model talks text again.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"filename_prefix\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"n\">DEFAULT_LM_PREFIX</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Output subfolder and file stem; a counter is appended to keep earlier saves.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NNModel</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"model\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"path\"</span><span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">model</span><span class=\"p\">,</span> <span class=\"n\">vocab</span><span class=\"p\">,</span> <span class=\"n\">filename_prefix</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"n\">DEFAULT_LM_PREFIX</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">trainee</span> <span class=\"o\">=</span> <span class=\"n\">_as_language_model</span><span class=\"p\">(</span><span class=\"n\">model</span><span class=\"p\">)</span>\n        <span class=\"n\">table</span> <span class=\"o\">=</span> <span class=\"n\">_as_vocab</span><span class=\"p\">(</span><span class=\"n\">vocab</span><span class=\"p\">)</span>\n        <span class=\"n\">prefix</span> <span class=\"o\">=</span> <span class=\"s2\">\"\"</span> <span class=\"k\">if</span> <span class=\"n\">filename_prefix</span> <span class=\"ow\">is</span> <span class=\"kc\">None</span> <span class=\"k\">else</span> <span class=\"nb\">str</span><span class=\"p\">(</span><span class=\"n\">filename_prefix</span><span class=\"p\">)</span><span class=\"o\">.</span><span class=\"n\">strip</span><span class=\"p\">()</span>\n        <span class=\"n\">output_path</span> <span class=\"o\">=</span> <span class=\"n\">_save_lm_file</span><span class=\"p\">(</span><span class=\"n\">trainee</span><span class=\"p\">,</span> <span class=\"n\">table</span><span class=\"p\">,</span> <span class=\"n\">prefix</span> <span class=\"ow\">or</span> <span class=\"n\">DEFAULT_LM_PREFIX</span><span class=\"p\">)</span>\n        <span class=\"nb\">print</span><span class=\"p\">(</span>\n            <span class=\"sa\">f</span><span class=\"s2\">\"[Network &amp; Layers] Save Language Model: wrote \"</span>\n            <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">parameter_count</span><span class=\"p\">(</span><span class=\"n\">trainee</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\"> parameter value(s) / \"</span>\n            <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"n\">table</span><span class=\"o\">.</span><span class=\"n\">size</span><span class=\"si\">}</span><span class=\"s2\"> vocab token(s) to </span><span class=\"si\">{</span><span class=\"n\">output_path</span><span class=\"si\">}</span><span class=\"s2\">\"</span>\n        <span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">trainee</span><span class=\"p\">,</span> <span class=\"n\">output_path</span><span class=\"p\">)</span>\n"}, "LanguageModelLoad": {"id": "LanguageModelLoad", "name": "Load Language Model", "cat": "Training", "desc": "Reads a language model from a .safetensors file written by Save Language Model (relative to the output folder, or absolute), returning model + vocabulary.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">LanguageModelLoad</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Read a language model back from a ``.safetensors`` file.</span>\n\n<span class=\"sd\">    What: the other half of the persistence story, and the way a trained model</span>\n<span class=\"sd\">          is reused in a later session: the file's metadata states the</span>\n<span class=\"sd\">          blueprint (spec chain) and the vocabulary, the node rebuilds the</span>\n<span class=\"sd\">          model from them and restores the weights with a strict</span>\n<span class=\"sd\">          ``load_state_dict`` - any mismatch between the file and its own</span>\n<span class=\"sd\">          blueprint is a hard error, so what comes out is bit-for-bit the</span>\n<span class=\"sd\">          model that was saved. The returned model is in eval mode (dropout</span>\n<span class=\"sd\">          off), ready for Language Model Forward / Generate or further</span>\n<span class=\"sd\">          Language Model Train (warm start).</span>\n<span class=\"sd\">    In:   path (STRING) - the file to read. A relative path is resolved</span>\n<span class=\"sd\">          against ComfyUI's *output* folder (which is where Save Language</span>\n<span class=\"sd\">          Model writes), an absolute path is used as it is. The default</span>\n<span class=\"sd\">          points at the first file Save writes, so \"save, then load\" works</span>\n<span class=\"sd\">          without typing.</span>\n<span class=\"sd\">    Out:  model (nn_model) - the restored model, in eval mode.</span>\n<span class=\"sd\">          vocab (VOCAB) - the vocabulary stored with the model; wire it into</span>\n<span class=\"sd\">          Language Model Generate to prompt and decode with text.</span>\n<span class=\"sd\">          params (INT) - the total trainable parameter count.</span>\n<span class=\"sd\">    Raises:</span>\n<span class=\"sd\">        ValueError: when the file does not exist, was not written by Save</span>\n<span class=\"sd\">            Language Model (missing or unknown format tag), or its metadata</span>\n<span class=\"sd\">            does not describe a valid spec chain / vocabulary.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"LanguageModelLoad\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Load Language Model\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Reads a language model from a .safetensors file written by Save Language Model (relative to the output folder, or absolute), returning model + vocabulary.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"s2\">\"load\"</span><span class=\"p\">,</span> <span class=\"s2\">\"read\"</span><span class=\"p\">,</span> <span class=\"s2\">\"checkpoint\"</span><span class=\"p\">,</span> <span class=\"s2\">\"safetensors\"</span><span class=\"p\">,</span> <span class=\"s2\">\"import\"</span><span class=\"p\">,</span>\n                <span class=\"s2\">\"language model\"</span><span class=\"p\">,</span> <span class=\"s2\">\"lm\"</span><span class=\"p\">,</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\" pan><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span> <span class=\"n\">return_metadata</span><span class=\"o\">=</span><span class=\"kc\">True</span>\n        <span class=\"p\">)</span>\n        <span class=\"n\">metadata</span> <span class=\"o\">=</span> <span class=\"n\">metadata</span> <span class=\"ow\">or</span> <span class=\"p\">{}</span>\n        <span class=\"k\">if</span> <span class=\"n\">metadata</span><span class=\"o\">.</span><span class=\"n\">get</span><span class=\"p\">(</span><span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">LM_META_FORMAT</span><span class=\"p\">)</span> <span class=\"o\">!=</span> <span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">LM_FILE_FORMAT</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"[Network &amp; Layers] </span><span class=\"si\">{</span><span class=\"n\">resolved</span><span class=\"si\">}</span><span class=\"s2\"> was not written by 'Save \"</span>\n                <span class=\"s2\">\"Language Model' (missing or unknown format tag \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">LM_FILE_FORMAT</span><span class=\"si\">!r}</span><span class=\"s2\">); the node cannot rebuild the model.\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"k\">try</span><span class=\"p\">:</span>\n            <span class=\"n\">chain</span> <span class=\"o\">=</span> <span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">spec_chain_from_json</span><span class=\"p\">(</span><span class=\"n\">metadata</span><span class=\"p\">[</span><span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">LM_META_SPEC</span><span class=\"p\">])</span>\n            <span class=\"n\">table</span> <span class=\"o\">=</span> <span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">vocab_from_json</span><span class=\"p\">(</span><span class=\"n\">metadata</span><span class=\"p\">[</span><span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">LM_META_VOCAB</span><span class=\"p\">])</span>\n        <span class=\"k\">except</span> <span class=\"ne\">KeyError</span> <span class=\"k\">as</span> <span class=\"n\">missing</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"[Network &amp; Layers] </span><span class=\"si\">{</span><span class=\"n\">resolved</span><span class=\"si\">}</span><span class=\"s2\"> is missing the </span><span class=\"si\">{</span><span class=\"n\">missing</span><span class=\"si\">}</span><span class=\"s2\"> \"</span>\n                <span class=\"s2\">\"metadata entry; it was not written by 'Save Language Model'.\"</span>\n            <span class=\"p\">)</span> <span class=\"kn\">from</span><span class=\"w\"> </span><span class=\"nn\">missing</span>\n        <span class=\"k\">if</span> <span class=\"n\">chain</span><span class=\"p\">[</span><span class=\"mi\">0</span><span class=\"p\">]</span><span class=\"o\">.</span><span class=\"n\">vocab_size</span> <span class=\"o\">!=</span> <span class=\"n\">table</span><span class=\"o\">.</span><span class=\"n\">size</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"[Network &amp; Layers] </span><span class=\"si\">{</span><span class=\"n\">resolved</span><span class=\"si\">}</span><span class=\"s2\"> is inconsistent: its blueprint \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"declares </span><span class=\"si\">{</span><span class=\"n\">chain</span><span class=\"p\">[</span><span class=\"mi\">0</span><span class=\"p\">]</span><span class=\"o\">.</span><span class=\"n\">vocab_size</span><span class=\"si\">}</span><span class=\"s2\"> vocabulary entries but its \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"vocabulary holds </span><span class=\"si\">{</span><span class=\"n\">table</span><span class=\"o\">.</span><span class=\"n\">size</span><span class=\"si\">}</span><span class=\"s2\">; the file is corrupt.\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"k\">with</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">inference_mode</span><span class=\"p\">(</span><span class=\"kc\">False</span><span class=\"p\">):</span>\n            <span class=\"n\">model</span> <span class=\"o\">=</span> <span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">build_model</span><span class=\"p\">(</span><span class=\"n\">chain</span><span class=\"p\">)</span>\n            <span class=\"n\">model</span><span class=\"o\">.</span><span class=\"n\">load_state_dict</span><span class=\"p\">(</span><span class=\"n\">state</span><span class=\"p\">,</span> <span class=\"n\">strict</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">)</span>\n            <span class=\"n\">model</span><span class=\"o\">.</span><span class=\"n\">eval</span><span class=\"p\">()</span>\n        <span class=\"nb\">print</span><span class=\"p\">(</span>\n            <span class=\"sa\">f</span><span class=\"s2\">\"[Network &amp; Layers] Load Language Model: restored \"</span>\n            <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">parameter_count</span><span class=\"p\">(</span><span class=\"n\">model</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\"> parameter value(s) / </span><span class=\"si\">{</span><span class=\"n\">table</span><span class=\"o\">.</span><span class=\"n\">size</span><span class=\"si\">}</span><span class=\"s2\"> \"</span>\n            <span class=\"sa\">f</span><span class=\"s2\">\"vocab token(s) from </span><span class=\"si\">{</span><span class=\"n\">resolved</span><span class=\"si\">}</span><span class=\"s2\">\"</span>\n        <span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">model</span><span class=\"p\">,</span> <span class=\"n\">table</span><span class=\"p\">,</span> <span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">parameter_count</span><span class=\"p\">(</span><span class=\"n\">model</span><span class=\"p\">))</span>\n"}, "TrainingParameters": {"id": "TrainingParameters", "name": "Learnable Parameters", "cat": "Training", "desc": "Creates a named trainable parameter: from a wired tensor, or from the shape/init widgets.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TrainingParameters</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Creates a trainable parameter set (``PARAMS``), from a tensor or from scratch.</span>\n\n<span class=\"sd\">    What: the entry point of every manual training graph. It turns one tensor into</span>\n<span class=\"sd\">          a ``nn.Parameter`` wrapped in a ``{name: parameter}`` payload, which is</span>\n<span class=\"sd\">          what the trainer accepts for warm starting and what ``Parameters to</span>\n<span class=\"sd\">          Tensor``, ``Save Parameters`` and ``Parameters to Text`` consume.</span>\n<span class=\"sd\">          Without a wired tensor the value is created here from the ``shape``</span>\n<span class=\"sd\">          widget, seeded by ``seed``: the same seed always produces the same</span>\n<span class=\"sd\">          numbers and the process RNG is left untouched, so ComfyUI may cache the</span>\n<span class=\"sd\">          output.</span>\n<span class=\"sd\">    In:   tensor (TENSOR, optional) - when connected, this tensor *is* the</span>\n<span class=\"sd\">          parameter (link wins over the shape widget, exactly like</span>\n<span class=\"sd\">          ``Training Run Stats``); non floating point tensors are cast to float32</span>\n<span class=\"sd\">          with a warning, because only floating point tensors can carry a</span>\n<span class=\"sd\">          gradient.</span>\n<span class=\"sd\">          name (STRING) - the key of the parameter, e.g. ``\"layer0.weight\"``;</span>\n<span class=\"sd\">          the name is what every other node in this family addresses it by.</span>\n<span class=\"sd\">          shape (STRING) - dimensions to create, e.g. ``\"2,3\"``; ignored while a</span>\n<span class=\"sd\">          tensor is wired in. Unreadable text falls back to ``\"2,3\"`` with a</span>\n<span class=\"sd\">          warning.</span>\n<span class=\"sd\">          init (COMBO) - ``normal`` (N(0, 1)), ``zeros``, ``ones``,</span>\n<span class=\"sd\">          ``xavier_uniform`` or ``kaiming_uniform``; ignored while a tensor is</span>\n<span class=\"sd\">          wired in.</span>\n<span class=\"sd\">          seed (INT) - seed of the initialiser, for a reproducible value.</span>\n<span class=\"sd\">    Out:  params (PARAMS) - a one entry parameter set holding ``name``.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"TrainingParameters\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Learnable Parameters\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Creates a named trainable parameter: from a wired tensor, or from the shape/init widgets.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"s2\">\"parameter\"</span><span class=\"p\">,</span> <span class=\"s2\">\"learnable\"</span><span class=\"p\">,</span> <span class=\"s2\">\"weights\"</span><span class=\"p\">,</span> <span class=\"s2\">\"variable\"</span><span class=\"p\">,</span> <span class=\"s2\">\"requires_grad\"</span><span class=\"p\">,</span>\n                <span class=\"s2\">\"trainable\"</span><span class=\"p\">,</span> <span class=\"s2\">\"init\"</span><span class=\"p\">,</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional tensor to use as the parameter; overrides shape/init.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"name\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"weight\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">placeholder</span><span class=\"o\">=</span><span class=\"s2\">\"e.g. layer0.weight\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Key of the parameter, e.g. layer0.weight; other nodes address it by this name.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"shape\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"n\">DEFAULT_SHAPE</span><span class=\"p\">,</span>\n                    <span class=\"n\">placeholder</span><span class=\"o\">=</span><span class=\"s2\">\"e.g. 2,3\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Dimensions to create when no tensor is wired in, e.g. 2,3.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Combo</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"init\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">options</span><span class=\"o\">=</span><span class=\"nb\">list</span><span class=\"p\">(</span><span class=\"n\">INIT_OPTIONS</span><span class=\"p\">),</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"normal\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Initialiser used when no tensor is wired in.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"seed\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">4294967295</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Seed of the initialiser; the same seed always yields the same parameter.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Params</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"params\"</span><span class=\"p\">)],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">name</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"s2\">\"weight\"</span><span class=\"p\">,</span>\n        <span class=\"n\">shape</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"n\">DEFAULT_SHAPE</span><span class=\"p\">,</span>\n        <span class=\"n\">init</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"s2\">\"normal\"</span><span class=\"p\">,</span>\n        <span class=\"n\">seed</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">0</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">key</span> <span class=\"o\">=</span> <span class=\"n\">_text</span><span class=\"p\">(</span><span class=\"n\">name</span><span class=\"p\">,</span> <span class=\"s2\">\"weight\"</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">tensor</span> <span class=\"ow\">is</span> <span class=\"ow\">not</span> <span class=\"kc\">None</span><span class=\"p\">:</span>\n            <span class=\"n\">value</span> <span class=\"o\">=</span> <span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">detach</span><span class=\"p\">()</span><span class=\"o\">.</span><span class=\"n\">clone</span><span class=\"p\">()</span>\n            <span class=\"k\">if</span> <span class=\"ow\">not</span> <span class=\"n\">value</span><span class=\"o\">.</span><span class=\"n\">is_floating_point</span><span class=\"p\">():</span>\n                <span class=\"n\">_warn</span><span class=\"p\">(</span>\n                    <span class=\"sa\">f</span><span class=\"s2\">\"parameter '</span><span class=\"si\">{</span><span class=\"n\">key</span><span class=\"si\">}</span><span class=\"s2\">' was given a </span><span class=\"si\">{</span><span class=\"n\">value</span><span class=\"o\">.</span><span class=\"n\">dtype</span><span class=\"si\">}</span><span class=\"s2\"> tensor; casting to \"</span>\n                    <span class=\"s2\">\"float32 because only floating point tensors can be trained.\"</span>\n                <span class=\"p\">)</span>\n                <span class=\"n\">value</span> <span class=\"o\">=</span> <span class=\"n\">value</span><span class=\"o\">.</span><span class=\"n\">float</span><span class=\"p\">()</span>\n            <span class=\"k\">elif</span> <span class=\"n\">value</span><span class=\"o\">.</span><span class=\"n\">dtype</span> <span class=\"o\">!=</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">float32</span><span class=\"p\">:</span>\n                <span class=\"n\">value</span> <span class=\"o\">=</span> <span class=\"n\">value</span><span class=\"o\">.</span><span class=\"n\">float</span><span class=\"p\">()</span>\n        <span class=\"k\">else</span><span class=\"p\">:</span>\n            <span class=\"n\">sizes</span> <span class=\"o\">=</span> <span class=\"n\">_parse_sizes</span><span class=\"p\">(</span><span class=\"n\">shape</span><span class=\"p\">)</span>\n            <span class=\"k\">if</span> <span class=\"n\">sizes</span> <span class=\"ow\">is</span> <span class=\"kc\">None</span> <span class=\"ow\">or</span> <span class=\"ow\">not</span> <span class=\"n\">sizes</span><span class=\"p\">:</span>\n                <span class=\"n\">_warn</span><span class=\"p\">(</span>\n                    <span class=\"sa\">f</span><span class=\"s2\">\"shape '</span><span class=\"si\">{</span><span class=\"n\">shape</span><span class=\"si\">}</span><span class=\"s2\">' could not be read as dimensions; using \"</span>\n                    <span class=\"sa\">f</span><span class=\"s2\">\"'</span><span class=\"si\">{</span><span class=\"n\">DEFAULT_SHAPE</span><span class=\"si\">}</span><span class=\"s2\">' instead.\"</span>\n                <span class=\"p\">)</span>\n                <span class=\"n\">sizes</span> <span class=\"o\">=</span> <span class=\"n\">_parse_sizes</span><span class=\"p\">(</span><span class=\"n\">DEFAULT_SHAPE</span><span class=\"p\">)</span> <span class=\"ow\">or</span> <span class=\"p\">(</span><span class=\"mi\">2</span><span class=\"p\">,</span> <span class=\"mi\">3</span><span class=\"p\">)</span>\n            <span class=\"n\">mode</span> <span class=\"o\">=</span> <span class=\"n\">_text</span><span class=\"p\">(</span><span class=\"n\">init</span><span class=\"p\">,</span> <span class=\"s2\">\"normal\"</span><span class=\"p\">)</span><span class=\"o\">.</span><span class=\"n\">lower</span><span class=\"p\">()</span>\n            <span class=\"k\">if</span> <span class=\"n\">mode</span> <span class=\"ow\">not</span> <span class=\"ow\">in</span> <span class=\"n\">INIT_OPTIONS</span><span class=\"p\">:</span>\n                <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"sa\">f</span><span class=\"s2\">\"init '</span><span class=\"si\">{</span><span class=\"n\">init</span><span class=\"si\">}</span><span class=\"s2\">' is unknown; using 'normal' instead.\"</span><span class=\"p\">)</span>\n                <span class=\"n\">mode</span> <span class=\"o\">=</span> <span class=\"s2\">\"normal\"</span>\n            <span class=\"k\">with</span> <span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">seeded_rng</span><span class=\"p\">(</span><span class=\"n\">seed</span><span class=\"p\">):</span>\n                <span class=\"n\">value</span> <span class=\"o\">=</span> <span class=\"n\">_init_tensor</span><span class=\"p\">(</span><span class=\"nb\">tuple</span><span class=\"p\">(</span><span class=\"n\">sizes</span><span class=\"p\">),</span> <span class=\"n\">mode</span><span class=\"p\">)</span>\n        <span class=\"c1\"># ``nn.Parameter`` must not be built on an inference tensor, which is what</span>\n        <span class=\"c1\"># every tensor produced inside ComfyUI's own inference_mode block is.</span>\n        <span class=\"k\">with</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">inference_mode</span><span class=\"p\">(</span><span class=\"kc\">False</span><span class=\"p\">):</span>\n            <span class=\"n\">parameter</span> <span class=\"o\">=</span> <span class=\"n\">nn</span><span class=\"o\">.</span><span class=\"n\">Parameter</span><span class=\"p\">(</span><span class=\"n\">value</span><span class=\"o\">.</span><span class=\"n\">detach</span><span class=\"p\">()</span><span class=\"o\">.</span><span class=\"n\">clone</span><span class=\"p\">(),</span> <span class=\"n\">requires_grad</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">({</span><span class=\"n\">key</span><span class=\"p\">:</span> <span class=\"n\">parameter</span><span class=\"p\">})</span>\n"}, "TrainingParametersMerge": {"id": "TrainingParametersMerge", "name": "Merge Parameters", "cat": "Training", "desc": "Concatenates two parameter sets; colliding names are renamed with a warning.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TrainingParametersMerge</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Merges two parameter sets into one.</span>\n\n<span class=\"sd\">    What: builds a larger parameter set out of two, e.g. the ``weight`` of one</span>\n<span class=\"sd\">          ``Learnable Parameters`` node and the ``bias`` of another, or two halves</span>\n<span class=\"sd\">          of a checkpoint. Keys are kept as they are; a key that appears in both</span>\n<span class=\"sd\">          inputs is *renamed* (``bias`` -&gt; ``bias_2``) with a warning instead of</span>\n<span class=\"sd\">          overwriting, so no weight is ever lost silently.</span>\n<span class=\"sd\">    In:   params_a (PARAMS) - first parameter set; its entries keep their names.</span>\n<span class=\"sd\">          params_b (PARAMS) - second parameter set, merged after the first one.</span>\n<span class=\"sd\">    Out:  params (PARAMS) - both sets, in order; chain two nodes to merge three or</span>\n<span class=\"sd\">          more sets.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"TrainingParametersMerge\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Merge Parameters\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Concatenates two parameter sets; colliding names are renamed with a warning.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"concat\"</span><span class=\"p\">,</span> <span class=\"s2\">\"combine\"</span><span class=\"p\">,</span> <span class=\"s2\">\"join\"</span><span class=\"p\">,</span> <span class=\"s2\">\"parameter set\"</span><span class=\"p\">,</span> <span class=\"s2\">\"merge\"</span><span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Params</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"params_a\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"params a\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"First parameter set; its names are kept as they are.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Params</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"params_b\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"params b\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Second parameter set; a name already present in 'params a' is renamed.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Params</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"params\"</span><span class=\"p\">)],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">params_a</span><span class=\"p\">,</span> <span class=\"n\">params_b</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">merged</span> <span class=\"o\">=</span> <span class=\"nb\">dict</span><span class=\"p\">(</span><span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">as_parameter_dict</span><span class=\"p\">(</span><span class=\"n\">params_a</span><span class=\"p\">))</span>\n        <span class=\"k\">for</span> <span class=\"n\">key</span><span class=\"p\">,</span> <span class=\"n\">value</span> <span class=\"ow\">in</span> <span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">as_parameter_dict</span><span class=\"p\">(</span><span class=\"n\">params_b</span><span class=\"p\">)</span><span class=\"o\">.</span><span class=\"n\">items</span><span class=\"p\">():</span>\n            <span class=\"k\">if</span> <span class=\"n\">key</span> <span class=\"ow\">in</span> <span class=\"n\">merged</span><span class=\"p\">:</span>\n                <span class=\"n\">renamed</span> <span class=\"o\">=</span> <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"n\">key</span><span class=\"si\">}</span><span class=\"s2\">_2\"</span>\n                <span class=\"n\">index</span> <span class=\"o\">=</span> <span class=\"mi\">2</span>\n                <span class=\"k\">while</span> <span class=\"n\">renamed</span> <span class=\"ow\">in</span> <span class=\"n\">merged</span><span class=\"p\">:</span>\n                    <span class=\"n\">index</span> <span class=\"o\">+=</span> <span class=\"mi\">1</span>\n                    <span class=\"n\">renamed</span> <span class=\"o\">=</span> <span class=\"sa\">f</span><span class=\"s2\">\"</span><span class=\"si\">{</span><span class=\"n\">key</span><span class=\"si\">}</span><span class=\"s2\">_</span><span class=\"si\">{</span><span class=\"n\">index</span><span class=\"si\">}</span><span class=\"s2\">\"</span>\n                <span class=\"n\">_warn</span><span class=\"p\">(</span>\n                    <span class=\"sa\">f</span><span class=\"s2\">\"parameter '</span><span class=\"si\">{</span><span class=\"n\">key</span><span class=\"si\">}</span><span class=\"s2\">' exists in both inputs; the second one was \"</span>\n                    <span class=\"sa\">f</span><span class=\"s2\">\"renamed to '</span><span class=\"si\">{</span><span class=\"n\">renamed</span><span class=\"si\">}</span><span class=\"s2\">'.\"</span>\n                <span class=\"p\">)</span>\n                <span class=\"n\">key</span> <span class=\"o\">=</span> <span class=\"n\">renamed</span>\n            <span class=\"n\">merged</span><span class=\"p\">[</span><span class=\"n\">key</span><span class=\"p\">]</span> <span class=\"o\">=</span> <span class=\"n\">value</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">merged</span><span class=\"p\">)</span>\n"}, "TrainingParametersExtract": {"id": "TrainingParametersExtract", "name": "Parameters to Tensor", "cat": "Training", "desc": "Pulls one named entry out of a parameter set as a tensor, e.g. layer0.weight for a Linear node.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TrainingParametersExtract</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Takes one entry of a parameter set back out, as a plain tensor.</span>\n\n<span class=\"sd\">    What: the bridge from training back to inference. A trained parameter set is</span>\n<span class=\"sd\">          only useful once a single weight matrix can be handed to the stateless</span>\n<span class=\"sd\">          layer nodes (``Linear`` takes its ``weight`` as a tensor), so this node</span>\n<span class=\"sd\">          looks an entry up by name and detaches it.</span>\n<span class=\"sd\">    In:   params (PARAMS) - the parameter set to read.</span>\n<span class=\"sd\">          name (STRING) - the key to look up, e.g. ``\"layer0.weight\"``. The</span>\n<span class=\"sd\">          trainer names its layers ``layer0``, ``layer1``, ... with ``weight`` /</span>\n<span class=\"sd\">          ``bias`` per layer.</span>\n<span class=\"sd\">    Out:  output (TENSOR) - the requested tensor, detached (it carries no</span>\n<span class=\"sd\">          autograd state), on the device it lives on.</span>\n<span class=\"sd\">    Raises:</span>\n<span class=\"sd\">        ValueError: when the name is not part of the set; the message lists the</span>\n<span class=\"sd\">            names that are available.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"TrainingParametersExtract\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Parameters to Tensor\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Pulls one named entry out of a parameter set as a tensor, e.g. layer0.weight for a Linear node.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"get parameter\"</span><span class=\"p\">,</span> <span class=\"s2\">\"weight\"</span><span class=\"p\">,</span> <span class=\"s2\">\"bias\"</span><span class=\"p\">,</span> <span class=\"s2\">\"extract\"</span><span class=\"p\">,</span> <span class=\"s2\">\"tensor\"</span><span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Params</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"params\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Parameter set to read.\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"name\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"weight\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">placeholder</span><span class=\"o\">=</span><span class=\"s2\">\"e.g. layer0.weight\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Key to look up, e.g. layer0.weight.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"output\"</span><span class=\"p\">)],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">params</span><span class=\"p\">,</span> <span class=\"n\">name</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"s2\">\"weight\"</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">payload</span> <span class=\"o\">=</span> <span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">as_parameter_dict</span><span class=\"p\">(</span><span class=\"n\">params</span><span class=\"p\">)</span>\n        <span class=\"n\">key</span> <span class=\"o\">=</span> <span class=\"n\">_text</span><span class=\"p\">(</span><span class=\"n\">name</span><span class=\"p\">,</span> <span class=\"s2\">\"weight\"</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">key</span> <span class=\"ow\">not</span> <span class=\"ow\">in</span> <span class=\"n\">payload</span><span class=\"p\">:</span>\n            <span class=\"k\">raise</span> <span class=\"ne\">ValueError</span><span class=\"p\">(</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"[Network &amp; Layers] no parameter named '</span><span class=\"si\">{</span><span class=\"n\">key</span><span class=\"si\">}</span><span class=\"s2\">' in this parameter \"</span>\n                <span class=\"sa\">f</span><span class=\"s2\">\"set; available: </span><span class=\"si\">{</span><span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">parameter_names</span><span class=\"p\">(</span><span class=\"n\">payload</span><span class=\"p\">,</span><span class=\"w\"> </span><span class=\"n\">NAME_PREVIEW</span><span class=\"p\">)</span><span class=\"si\">}</span><span class=\"s2\">.\"</span>\n            <span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">payload</span><span class=\"p\">[</span><span class=\"n\">key</span><span class=\"p\">]</span><span class=\"o\">.</span><span class=\"n\">detach</span><span class=\"p\">())</span>\n"}, "TrainingOptimizer": {"id": "TrainingOptimizer", "name": "Optimizer", "cat": "Training",

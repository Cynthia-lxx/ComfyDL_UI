\"n\">dil</span><span class=\"p\">,</span> <span class=\"n\">ceil_mode</span><span class=\"p\">)</span>\n            <span class=\"k\">elif</span> <span class=\"n\">rank</span> <span class=\"o\">==</span> <span class=\"mi\">2</span><span class=\"p\">:</span>\n                <span class=\"n\">operation</span><span class=\"p\">,</span> <span class=\"n\">args</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">max_pool2d</span><span class=\"p\">,</span> <span class=\"p\">(</span><span class=\"n\">kernel</span><span class=\"p\">,</span> <span class=\"n\">step</span><span class=\"p\">,</span> <span class=\"n\">pad</span><span class=\"p\">,</span> <span class=\"n\">dil</span><span class=\"p\">,</span> <span class=\"n\">ceil_mode</span><span class=\"p\">)</span>\n            <span class=\"k\">else</span><span class=\"p\">:</span>\n                <span class=\"n\">operation</span><span class=\"p\">,</span> <span class=\"n\">args</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">max_pool3d</span><span class=\"p\">,</span> <span class=\"p\">(</span><span class=\"n\">kernel</span><span class=\"p\">,</span> <span class=\"n\">step</span><span class=\"p\">,</span> <span class=\"n\">pad</span><span class=\"p\">,</span> <span class=\"n\">dil</span><span class=\"p\">,</span> <span class=\"n\">ceil_mode</span><span class=\"p\">)</span>\n        <span class=\"k\">else</span><span class=\"p\">:</span>\n            <span class=\"k\">if</span> <span class=\"n\">rank</span> <span class=\"o\">==</span> <span class=\"mi\">1</span><span class=\"p\">:</span>\n                <span class=\"n\">operation</span><span class=\"p\">,</span> <span class=\"n\">args</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">avg_pool1d</span><span class=\"p\">,</span> <span class=\"p\">(</span><span class=\"n\">kernel</span><span class=\"p\">,</span> <span class=\"n\">step</span><span class=\"p\">,</span> <span class=\"n\">pad</span><span class=\"p\">,</span> <span class=\"n\">ceil_mode</span><span class=\"p\">,</span> <span class=\"n\">count_include_pad</span><span class=\"p\">)</span>\n            <span class=\"k\">elif</span> <span class=\"n\">rank</span> <span class=\"o\">==</span> <span class=\"mi\">2</span><span class=\"p\">:</span>\n                <span class=\"n\">operation</span><span class=\"p\">,</span> <span class=\"n\">args</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">avg_pool2d</span><span class=\"p\">,</span> <span class=\"p\">(</span><span class=\"n\">kernel</span><span class=\"p\">,</span> <span class=\"n\">step</span><span class=\"p\">,</span> <span class=\"n\">pad</span><span class=\"p\">,</span> <span class=\"n\">ceil_mode</span><span class=\"p\">,</span> <span class=\"n\">count_include_pad</span><span class=\"p\">)</span>\n            <span class=\"k\">else</span><span class=\"p\">:</span>\n                <span class=\"n\">operation</span><span class=\"p\">,</span> <span class=\"n\">args</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">avg_pool3d</span><span class=\"p\">,</span> <span class=\"p\">(</span><span class=\"n\">kernel</span><span class=\"p\">,</span> <span class=\"n\">step</span><span class=\"p\">,</span> <span class=\"n\">pad</span><span class=\"p\">,</span> <span class=\"n\">ceil_mode</span><span class=\"p\">,</span> <span class=\"n\">count_include_pad</span><span class=\"p\">)</span>\n\n        <span class=\"n\">pooled</span> <span class=\"o\">=</span> <span class=\"n\">_apply_pooling</span><span class=\"p\">(</span>\n            <span class=\"n\">operation</span><span class=\"p\">,</span> <span class=\"n\">prepared</span><span class=\"p\">,</span> <span class=\"n\">args</span><span class=\"p\">,</span> <span class=\"s2\">\"Pool\"</span><span class=\"p\">,</span> <span class=\"n\">rank</span><span class=\"p\">,</span> <span class=\"nb\">tuple</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">)</span>\n        <span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">_drop_added_rank</span><span class=\"p\">(</span><span class=\"n\">pooled</span><span class=\"p\">,</span> <span class=\"n\">added</span><span class=\"p\">))</span>\n"}, "PoolingAdaptive": {"id": "PoolingAdaptive", "name": "Adaptive Pool", "cat": "Pooling", "desc": "Adaptive pooling (avg/max) to an exact output_size over 1/2/3 spatial dims; output_size=1 is global pooling.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">PoolingAdaptive</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Adaptive pooling (max or average) that resizes to an exact output size.</span>\n\n<span class=\"sd\">    What: the functional form of ``torch.nn.AdaptiveAvgPool{1,2,3}d`` and</span>\n<span class=\"sd\">          ``AdaptiveMaxPool{1,2,3}d``. Instead of sliding a fixed window, each</span>\n<span class=\"sd\">          output cell covers the input range it needs, so the spatial size</span>\n<span class=\"sd\">          becomes whatever ``output_size`` asks for - independent of the input</span>\n<span class=\"sd\">          size. Setting ``output_size=1`` is the special case that collapses</span>\n<span class=\"sd\">          every spatial dimension at once, i.e. **global** average (or max)</span>\n<span class=\"sd\">          pooling, which is why no separate ``GlobalAvgPool`` node exists.</span>\n<span class=\"sd\">    In:   tensor (TENSOR) - feature map, usually ``(N, C, H, W)``. A bare</span>\n<span class=\"sd\">          ``(C, H, W)`` or ``(H, W)`` tensor is accepted: missing leading</span>\n<span class=\"sd\">          dimensions are added internally and removed again from the result.</span>\n<span class=\"sd\">          dims (COMBO) - 1, 2 or 3 (default 2): selects AdaptivePool1d/2d/3d.</span>\n<span class=\"sd\">          mode (COMBO) - ``avg`` (default) or ``max``.</span>\n<span class=\"sd\">          output_size (INT) - target size of every spatial dimension, default 1</span>\n<span class=\"sd\">          (global pooling).</span>\n<span class=\"sd\">    Out:  output (TENSOR) - same rank as the input, with each spatial dimension</span>\n<span class=\"sd\">          equal to ``output_size``. ``dims=2, output_size=1`` reproduces</span>\n<span class=\"sd\">          ``nn.AdaptiveAvgPool2d(1)`` and the textbook \"Global Average Pooling\".</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_pooling_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"PoolingAdaptive\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Adaptive Pool\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"Adaptive pooling (avg/max) to an exact output_size over 1/2/3 spatial dims; output_size=1 is global pooling.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"tensor\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Feature map, e.g. (N, C, H, W); unbatched (C, H, W) also works.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">_dims_widget</span><span class=\"p\">(),</span>\n                <span class=\"n\">_mode_widget</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"avg\"</span><span class=\"p\">,</span>\n                    <span class=\"s2\">\"Reduction: 'avg' is the usual Global Average Pooling, 'max' keeps the strongest value.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"output_size\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">512</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Target size of every spatial dimension; 1 = global pooling (GlobalAvgPool / GAP).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"s2\">\"adaptiveavgpool\"</span><span class=\"p\">,</span> <span class=\"s2\">\"adaptivemaxpool\"</span><span class=\"p\">,</span> <span class=\"s2\">\"adaptiveavgpool1d\"</span><span class=\"p\">,</span>\n                <span class=\"s2\">\"adaptiveavgpool2d\"</span><span class=\"p\">,</span> <span class=\"s2\">\"adaptiveavgpool3d\"</span><span class=\"p\">,</span> <span class=\"s2\">\"adaptive pooling\"</span><span class=\"p\">,</span>\n                <span class=\"s2\">\"global average pooling\"</span><span class=\"p\">,</span> <span class=\"s2\">\"global max pooling\"</span><span class=\"p\">,</span> <span class=\"s2\">\"gap\"</span><span class=\"p\">,</span>\n                <span class=\"s2\">\"global pooling\"</span><span class=\"p\">,</span>\n            <span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">tensor</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">dims</span><span class=\"p\">:</span> <span class=\"nb\">int</span><span class=\"p\">,</span>\n        <span class=\"n\">mode</span><span class=\"p\">:</span> <span class=\"nb\">str</span><span class=\"p\">,</span>\n        <span class=\"n\">output_size</span><span class=\"p\">:</span> <span class=\"nb\">int</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">rank</span> <span class=\"o\">=</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">dims</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">rank</span> <span class=\"ow\">not</span> <span class=\"ow\">in</span> <span class=\"p\">(</span><span class=\"mi\">1</span><span class=\"p\">,</span> <span class=\"mi\">2</span><span class=\"p\">,</span> <span class=\"mi\">3</span><span class=\"p\">):</span>\n            <span class=\"n\">_warn</span><span class=\"p\">(</span><span class=\"sa\">f</span><span class=\"s2\">\"Adaptive Pool: dims=</span><span class=\"si\">{</span><span class=\"n\">rank</span><span class=\"si\">}</span><span class=\"s2\"> is not 1/2/3; using 2.\"</span><span class=\"p\">)</span>\n            <span class=\"n\">rank</span> <span class=\"o\">=</span> <span class=\"mi\">2</span>\n        <span class=\"n\">size</span> <span class=\"o\">=</span> <span class=\"nb\">max</span><span class=\"p\">(</span><span class=\"mi\">1</span><span class=\"p\">,</span> <span class=\"nb\">int</span><span class=\"p\">(</span><span class=\"n\">output_size</span><span class=\"p\">))</span>\n\n        <span class=\"n\">prepared</span><span class=\"p\">,</span> <span class=\"n\">added</span> <span class=\"o\">=</span> <span class=\"n\">_ensure_min_rank</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"p\">,</span> <span class=\"n\">rank</span> <span class=\"o\">+</span> <span class=\"mi\">1</span><span class=\"p\">)</span>\n        <span class=\"k\">if</span> <span class=\"n\">mode</span> <span class=\"o\">==</span> <span class=\"s2\">\"max\"</span><span class=\"p\">:</span>\n            <span class=\"k\">if</span> <span class=\"n\">rank</span> <span class=\"o\">==</span> <span class=\"mi\">1</span><span class=\"p\">:</span>\n                <span class=\"n\">operation</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">adaptive_max_pool1d</span>\n            <span class=\"k\">elif</span> <span class=\"n\">rank</span> <span class=\"o\">==</span> <span class=\"mi\">2</span><span class=\"p\">:</span>\n                <span class=\"n\">operation</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">adaptive_max_pool2d</span>\n            <span class=\"k\">else</span><span class=\"p\">:</span>\n                <span class=\"n\">operation</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">adaptive_max_pool3d</span>\n        <span class=\"k\">else</span><span class=\"p\">:</span>\n            <span class=\"k\">if</span> <span class=\"n\">rank</span> <span class=\"o\">==</span> <span class=\"mi\">1</span><span class=\"p\">:</span>\n                <span class=\"n\">operation</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">adaptive_avg_pool1d</span>\n            <span class=\"k\">elif</span> <span class=\"n\">rank</span> <span class=\"o\">==</span> <span class=\"mi\">2</span><span class=\"p\">:</span>\n                <span class=\"n\">operation</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">adaptive_avg_pool2d</span>\n            <span class=\"k\">else</span><span class=\"p\">:</span>\n                <span class=\"n\">operation</span> <span class=\"o\">=</span> <span class=\"n\">F</span><span class=\"o\">.</span><span class=\"n\">adaptive_avg_pool3d</span>\n\n        <span class=\"n\">pooled</span> <span class=\"o\">=</span> <span class=\"n\">_apply_pooling</span><span class=\"p\">(</span>\n            <span class=\"n\">operation</span><span class=\"p\">,</span> <span class=\"n\">prepared</span><span class=\"p\">,</span> <span class=\"p\">(</span><span class=\"n\">size</span><span class=\"p\">,),</span> <span class=\"s2\">\"Adaptive Pool\"</span><span class=\"p\">,</span> <span class=\"n\">rank</span><span class=\"p\">,</span> <span class=\"nb\">tuple</span><span class=\"p\">(</span><span class=\"n\">tensor</span><span class=\"o\">.</span><span class=\"n\">shape</span><span class=\"p\">)</span>\n        <span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">_drop_added_rank</span><span class=\"p\">(</span><span class=\"n\">pooled</span><span class=\"p\">,</span> <span class=\"n\">added</span><span class=\"p\">))</span>\n"}, "RecurrentRNN": {"id": "RecurrentRNN", "name": "RNN", "cat": "Recurrent", "desc": "The vanilla tanh recurrent cell, single layer and batch-first: weights, biases and the initial state are wired in as tensors.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">RecurrentRNN</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"The vanilla recurrent cell: one tanh update per time step.</span>\n\n<span class=\"sd\">    What: ``h_t = tanh(W_ih x_t + b_ih + W_hh h_{t-1} + b_hh)`` written out</span>\n<span class=\"sd\">          explicitly - the 1986-era recurrence every later gated cell builds</span>\n<span class=\"sd\">          on. Single layer, batch-first, weights and the initial state wired in</span>\n<span class=\"sd\">          through slots: the node is stateless, so one node runs any checkpoint</span>\n<span class=\"sd\">          and stacking is done by feeding this node's ``y`` into the next</span>\n<span class=\"sd\">          node's ``x``. An unconnected weight or ``h0`` means zeros, so a</span>\n<span class=\"sd\">          freshly placed node with only ``x`` wired already runs.</span>\n<span class=\"sd\">    In:   x (TENSOR) - ``(batch, seq_len, in_features)``; a bare</span>\n<span class=\"sd\">          ``(seq_len, in_features)`` runs as a batch of one, and extra leading</span>\n<span class=\"sd\">          dimensions are flattened into the batch and restored on ``y``.</span>\n<span class=\"sd\">          weight_ih (TENSOR, optional) - ``(hidden, in_features)``.</span>\n<span class=\"sd\">          weight_hh (TENSOR, optional) - ``(hidden, hidden)``.</span>\n<span class=\"sd\">          bias_ih, bias_hh (TENSOR, optional) - ``(hidden,)`` each; they add,</span>\n<span class=\"sd\">          exactly like ``nn.RNN``.</span>\n<span class=\"sd\">          h0 (TENSOR, optional) - ``(batch, hidden)`` or</span>\n<span class=\"sd\">          ``(1, batch, hidden)``; unconnected means zeros.</span>\n<span class=\"sd\">          hidden_size (INT) - hidden units ``H`` (default 16).</span>\n<span class=\"sd\">    Out:  y (TENSOR) - ``(batch, seq_len, hidden)``, the per-step hidden state.</span>\n<span class=\"sd\">          hn (TENSOR) - ``(batch, hidden)``, the state after the last step;</span>\n<span class=\"sd\">          feed it into the next execution's ``h0`` to continue a sequence.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_recurrent_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"RecurrentRNN\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"RNN\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"The vanilla tanh recurrent cell, single layer and batch-first: weights, biases and the initial state are wired in as tensors.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">_x_input</span><span class=\"p\">(),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"weight_ih\"</span><span class=\"p\">,</span> <span class=\"s2\">\"(hidden, in_features)\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"weight_hh\"</span><span class=\"p\">,</span> <span class=\"s2\">\"(hidden, hidden)\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"bias_ih\"</span><span class=\"p\">,</span> <span class=\"mi\">1</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"bias_hh\"</span><span class=\"p\">,</span> <span class=\"mi\">1</span><span class=\"p\">),</span>\n                <span class=\"n\">_state_input</span><span class=\"p\">(</span><span class=\"s2\">\"h0\"</span><span class=\"p\">,</span> <span class=\"s2\">\"hidden state\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_hidden_size_widget</span><span class=\"p\">(),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"y\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"hn\"</span><span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"rnn\"</span><span class=\"p\">,</span> <span class=\"s2\">\"recurrent\"</span><span class=\"p\">,</span> <span class=\"s2\">\"vanilla rnn\"</span><span class=\"p\">,</span> <span class=\"s2\">\"tanh cell\"</span><span class=\"p\">,</span> <span class=\"s2\">\"sequence\"</span><span class=\"p\">,</span> <span class=\"s2\">\"elman\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">x</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">weight_ih</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">weight_hh</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">bias_ih</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">bias_hh</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">h0</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">hidden_size</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">16</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">y</span><span class=\"p\">,</span> <span class=\"n\">hn</span><span class=\"p\">,</span> <span class=\"n\">_</span> <span class=\"o\">=</span> <span class=\"n\">_run_node</span><span class=\"p\">(</span><span class=\"n\">x</span><span class=\"p\">,</span> <span class=\"n\">weight_ih</span><span class=\"p\">,</span> <span class=\"n\">weight_hh</span><span class=\"p\">,</span> <span class=\"n\">bias_ih</span><span class=\"p\">,</span> <span class=\"n\">bias_hh</span><span class=\"p\">,</span> <span class=\"n\">h0</span><span class=\"p\">,</span> <span class=\"kc\">None</span><span class=\"p\">,</span> <span class=\"n\">hidden_size</span><span class=\"p\">,</span> <span class=\"s2\">\"rnn\"</span><span class=\"p\">,</span> <span class=\"s2\">\"RNN\"</span><span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">y</span><span class=\"p\">,</span> <span class=\"n\">hn</span><span class=\"p\">)</span>\n"}, "RecurrentLSTM": {"id": "RecurrentLSTM", "name": "LSTM", "cat": "Recurrent", "desc": "The LSTM cell with its input / forget / candidate / output gates, single layer and batch-first; weights and both initial states are wired in as tensors.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">RecurrentLSTM</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"The LSTM cell: input, forget, candidate and output gates, two states.</span>\n\n<span class=\"sd\">    What: the long short-term memory update, written out explicitly per step -</span>\n<span class=\"sd\">          ``i, f, g, o = gates(W_ih x_t + b_ih + W_hh h_{t-1} + b_hh)`` in</span>\n<span class=\"sd\">          torch's ``[i, f, g, o]`` row order, ``c_t = f * c_{t-1} + i * g``</span>\n<span class=\"sd\">          and ``h_t = o * tanh(c_t)``. The forget gate is what lets a</span>\n<span class=\"sd\">          gradient survive across hundreds of steps; the cell state ``c``</span>\n<span class=\"sd\">          travels on its own slot pair (``c0`` in, ``cn`` out) beside the</span>\n<span class=\"sd\">          hidden state. Single layer, batch-first, weights and states wired</span>\n<span class=\"sd\">          in; unconnected slots mean zeros.</span>\n<span class=\"sd\">    In:   x (TENSOR) - ``(batch, seq_len, in_features)``; a bare</span>\n<span class=\"sd\">          ``(seq_len, in_features)`` runs as a batch of one, and extra leading</span>\n<span class=\"sd\">          dimensions are flattened into the batch and restored on ``y``.</span>\n<span class=\"sd\">          weight_ih (TENSOR, optional) - ``(4 * hidden, in_features)``.</span>\n<span class=\"sd\">          weight_hh (TENSOR, optional) - ``(4 * hidden, hidden)``.</span>\n<span class=\"sd\">          bias_ih, bias_hh (TENSOR, optional) - ``(4 * hidden,)`` each; they</span>\n<span class=\"sd\">          add, exactly like ``nn.LSTM``.</span>\n<span class=\"sd\">          h0, c0 (TENSOR, optional) - initial hidden / cell state,</span>\n<span class=\"sd\">          ``(batch, hidden)`` or ``(1, batch, hidden)`` each; unconnected</span>\n<span class=\"sd\">          means zeros.</span>\n<span class=\"sd\">          hidden_size (INT) - hidden units ``H`` (default 16).</span>\n<span class=\"sd\">    Out:  y (TENSOR) - ``(batch, seq_len, hidden)``, ``h_t`` per step.</span>\n<span class=\"sd\">          hn (TENSOR) - ``(batch, hidden)``, the final hidden state.</span>\n<span class=\"sd\">          cn (TENSOR) - ``(batch, hidden)``, the final cell state; feed</span>\n<span class=\"sd\">          ``hn`` / ``cn`` into the next execution's ``h0`` / ``c0`` to</span>\n<span class=\"sd\">          continue a sequence.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_recurrent_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"RecurrentLSTM\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"LSTM\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"The LSTM cell with its input / forget / candidate / output gates, single layer and batch-first; weights and both initial states are wired in as tensors.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">_x_input</span><span class=\"p\">(),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"weight_ih\"</span><span class=\"p\">,</span> <span class=\"s2\">\"(4 * hidden, in_features)\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"weight_hh\"</span><span class=\"p\">,</span> <span class=\"s2\">\"(4 * hidden, hidden)\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"bias_ih\"</span><span class=\"p\">,</span> <span class=\"mi\">4</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"bias_hh\"</span><span class=\"p\">,</span> <span class=\"mi\">4</span><span class=\"p\">),</span>\n                <span class=\"n\">_state_input</span><span class=\"p\">(</span><span class=\"s2\">\"h0\"</span><span class=\"p\">,</span> <span class=\"s2\">\"hidden state\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_state_input</span><span class=\"p\">(</span><span class=\"s2\">\"c0\"</span><span class=\"p\">,</span> <span class=\"s2\">\"cell state\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_hidden_size_widget</span><span class=\"p\">(),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"y\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"hn\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"cn\"</span><span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"lstm\"</span><span class=\"p\">,</span> <span class=\"s2\">\"long short term memory\"</span><span class=\"p\">,</span> <span class=\"s2\">\"recurrent\"</span><span class=\"p\">,</span> <span class=\"s2\">\"gates\"</span><span class=\"p\">,</span> <span class=\"s2\">\"cell state\"</span><span class=\"p\">,</span> <span class=\"s2\">\"sequence\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">x</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">weight_ih</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">weight_hh</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">bias_ih</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">bias_hh</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">h0</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">c0</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">hidden_size</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">16</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">y</span><span class=\"p\">,</span> <span class=\"n\">hn</span><span class=\"p\">,</span> <span class=\"n\">cn</span> <span class=\"o\">=</span> <span class=\"n\">_run_node</span><span class=\"p\">(</span><span class=\"n\">x</span><span class=\"p\">,</span> <span class=\"n\">weight_ih</span><span class=\"p\">,</span> <span class=\"n\">weight_hh</span><span class=\"p\">,</span> <span class=\"n\">bias_ih</span><span class=\"p\">,</span> <span class=\"n\">bias_hh</span><span class=\"p\">,</span> <span class=\"n\">h0</span><span class=\"p\">,</span> <span class=\"n\">c0</span><span class=\"p\">,</span> <span class=\"n\">hidden_size</span><span class=\"p\">,</span> <span class=\"s2\">\"lstm\"</span><span class=\"p\">,</span> <span class=\"s2\">\"LSTM\"</span><span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">y</span><span class=\"p\">,</span> <span class=\"n\">hn</span><span class=\"p\">,</span> <span class=\"n\">cn</span><span class=\"p\">)</span>\n"}, "RecurrentGRU": {"id": "RecurrentGRU", "name": "GRU", "cat": "Recurrent", "desc": "The gated recurrent unit with its reset / update gates, single layer and batch-first; weights and the initial state are wired in as tensors.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">RecurrentGRU</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"The GRU cell: reset and update gates, one state, no cell memory.</span>\n\n<span class=\"sd\">    What: the gated recurrent unit, written out explicitly per step in torch's</span>\n<span class=\"sd\">          ``[r, z, n]`` row order - ``r = sigmoid(...)`` decides how much of</span>\n<span class=\"sd\">          the previous state the **candidate** ``n = tanh(W_in x + b_in +</span>\n<span class=\"sd\">          r * (W_hn h + b_hn))`` may look at (the reset gate scales the hidden</span>\n<span class=\"sd\">          side only, which is why the node computes the input and hidden sides</span>\n<span class=\"sd\">          separately), and ``z`` interpolates between the candidate and the</span>\n<span class=\"sd\">          old state: ``h_t = (1 - z) * n + z * h_{t-1}``. The LSTM's separate</span>\n<span class=\"sd\">          cell state is gone - one state, two gates, a third cheaper cell.</span>\n<span class=\"sd\">          Single layer, batch-first, weights and the initial state wired in;</span>\n<span class=\"sd\">          unconnected slots mean zeros.</span>\n<span class=\"sd\">    In:   x (TENSOR) - ``(batch, seq_len, in_features)``; a bare</span>\n<span class=\"sd\">          ``(seq_len, in_features)`` runs as a batch of one, and extra leading</span>\n<span class=\"sd\">          dimensions are flattened into the batch and restored on ``y``.</span>\n<span class=\"sd\">          weight_ih (TENSOR, optional) - ``(3 * hidden, in_features)``.</span>\n<span class=\"sd\">          weight_hh (TENSOR, optional) - ``(3 * hidden, hidden)``.</span>\n<span class=\"sd\">          bias_ih, bias_hh (TENSOR, optional) - ``(3 * hidden,)`` each; they</span>\n<span class=\"sd\">          add, exactly like ``nn.GRU``.</span>\n<span class=\"sd\">          h0 (TENSOR, optional) - ``(batch, hidden)`` or</span>\n<span class=\"sd\">          ``(1, batch, hidden)``; unconnected means zeros.</span>\n<span class=\"sd\">          hidden_size (INT) - hidden units ``H`` (default 16).</span>\n<span class=\"sd\">    Out:  y (TENSOR) - ``(batch, seq_len, hidden)``, the per-step hidden state.</span>\n<span class=\"sd\">          hn (TENSOR) - ``(batch, hidden)``, the state after the last step;</span>\n<span class=\"sd\">          feed it into the next execution's ``h0`` to continue a sequence.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">_recurrent_schema</span><span class=\"p\">(</span>\n            <span class=\"s2\">\"RecurrentGRU\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"GRU\"</span><span class=\"p\">,</span>\n            <span class=\"s2\">\"The gated recurrent unit with its reset / update gates, single layer and batch-first; weights and the initial state are wired in as tensors.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">_x_input</span><span class=\"p\">(),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"weight_ih\"</span><span class=\"p\">,</span> <span class=\"s2\">\"(3 * hidden, in_features)\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_weight_input</span><span class=\"p\">(</span><span class=\"s2\">\"weight_hh\"</span><span class=\"p\">,</span> <span class=\"s2\">\"(3 * hidden, hidden)\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"bias_ih\"</span><span class=\"p\">,</span> <span class=\"mi\">3</span><span class=\"p\">),</span>\n                <span class=\"n\">_bias_input</span><span class=\"p\">(</span><span class=\"s2\">\"bias_hh\"</span><span class=\"p\">,</span> <span class=\"mi\">3</span><span class=\"p\">),</span>\n                <span class=\"n\">_state_input</span><span class=\"p\">(</span><span class=\"s2\">\"h0\"</span><span class=\"p\">,</span> <span class=\"s2\">\"hidden state\"</span><span class=\"p\">),</span>\n                <span class=\"n\">_hidden_size_widget</span><span class=\"p\">(),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"y\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"hn\"</span><span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"gru\"</span><span class=\"p\">,</span> <span class=\"s2\">\"gated recurrent unit\"</span><span class=\"p\">,</span> <span class=\"s2\">\"recurrent\"</span><span class=\"p\">,</span> <span class=\"s2\">\"reset gate\"</span><span class=\"p\">,</span> <span class=\"s2\">\"update gate\"</span><span class=\"p\">,</span> <span class=\"s2\">\"sequence\"</span><span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">x</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"p\">,</span>\n        <span class=\"n\">weight_ih</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">weight_hh</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">bias_ih</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">bias_hh</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">h0</span><span class=\"p\">:</span> <span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">Tensor</span> <span class=\"o\">|</span> <span class=\"kc\">None</span> <span class=\"o\">=</span> <span class=\"kc\">None</span><span class=\"p\">,</span>\n        <span class=\"n\">hidden_size</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">16</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">y</span><span class=\"p\">,</span> <span class=\"n\">hn</span><span class=\"p\">,</span> <span class=\"n\">_</span> <span class=\"o\">=</span> <span class=\"n\">_run_node</span><span class=\"p\">(</span><span class=\"n\">x</span><span class=\"p\">,</span> <span class=\"n\">weight_ih</span><span class=\"p\">,</span> <span class=\"n\">weight_hh</span><span class=\"p\">,</span> <span class=\"n\">bias_ih</span><span class=\"p\">,</span> <span class=\"n\">bias_hh</span><span class=\"p\">,</span> <span class=\"n\">h0</span><span class=\"p\">,</span> <span class=\"kc\">None</span><span class=\"p\">,</span> <span class=\"n\">hidden_size</span><span class=\"p\">,</span> <span class=\"s2\">\"gru\"</span><span class=\"p\">,</span> <span class=\"s2\">\"GRU\"</span><span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">y</span><span class=\"p\">,</span> <span class=\"n\">hn</span><span class=\"p\">)</span>\n"}, "TextVocabBuild": {"id": "TextVocabBuild", "name": "Vocab Build", "cat": "Text", "desc": "Builds a deterministic token vocabulary (with <unk> at index 0) from a corpus string, at char or word level.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TextVocabBuild</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Build a token vocabulary from a corpus string.</span>\n\n<span class=\"sd\">    What: tokenise ``corpus`` at the chosen level, count the tokens and keep</span>\n<span class=\"sd\">          the ones seen at least ``min_freq`` times, ordered by frequency</span>\n<span class=\"sd\">          (descending) then alphabetically - fully deterministic, so the same</span>\n<span class=\"sd\">          corpus always builds the same vocabulary. ``&lt;unk&gt;`` is reserved at</span>\n<span class=\"sd\">          index 0: encoding an unseen token maps to it instead of raising.</span>\n<span class=\"sd\">          Character level (default) keeps punctuation and spelling, the d2l</span>\n<span class=\"sd\">          time-machine recipe; word level gives fewer, larger tokens.</span>\n<span class=\"sd\">    In:   corpus (STRING) - the training text; any length, any language.</span>\n<span class=\"sd\">          level (COMBO) - ``char`` (default) or ``word`` tokenisation.</span>\n<span class=\"sd\">          min_freq (INT) - tokens rarer than this are dropped from the</span>\n<span class=\"sd\">          vocabulary (they still encode, as ``&lt;unk&gt;``).</span>\n<span class=\"sd\">    Out:  vocab (VOCAB) - the frozen mapping; feed it to Text Encode / Text</span>\n<span class=\"sd\">          Decode and to the Generate node's vocabulary slot.</span>\n<span class=\"sd\">          vocab_size (INT) - number of tokens including ``&lt;unk&gt;``; wire it</span>\n<span class=\"sd\">          into Language Model Embedding's ``vocab`` link.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"TextVocabBuild\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Vocab Build\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Builds a deterministic token vocabulary (with &lt;unk&gt; at index 0) from a corpus string, at char or word level.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"vocab\"</span><span class=\"p\">,</span> <span class=\"s2\">\"vocabulary\"</span><span class=\"p\">,</span> <span class=\"s2\">\"tokenize\"</span><span class=\"p\">,</span> <span class=\"s2\">\"tokenizer\"</span><span class=\"p\">,</span> <span class=\"s2\">\"corpus\"</span><span class=\"p\">,</span> <span class=\"s2\">\"text\"</span><span class=\"p\">,</span> <span class=\"s2\">\"nlp\"</span><span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"corpus\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"n\">DEFAULT_CORPUS</span><span class=\"p\">,</span>\n                    <span class=\"n\">multiline</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">placeholder</span><span class=\"o\">=</span><span class=\"s2\">\"the training text\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"The corpus the vocabulary is counted from; the same corpus always builds the same vocabulary.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Combo</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"level\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">options</span><span class=\"o\">=</span><span class=\"nb\">list</span><span class=\"p\">(</span><span class=\"n\">mp</span><span class=\"o\">.</span><span class=\"n\">LEVEL_OPTIONS</span><span class=\"p\">),</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"char\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Tokenisation level: char keeps every character, word splits on whitespace.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"min_freq\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">1000000</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Tokens rarer than this many occurrences are dropped (they encode as &lt;unk&gt;).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Vocab</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"vocab\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"vocab_size\"</span><span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span>< class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">vocab</span><span class=\"p\">,</span> <span class=\"n\">vocab</span><span class=\"o\">.</span><span class=\"n\">size</span><span class=\"p\">)</span>\n"}, "TextEncode": {"id": "TextEncode", "name": "Text Encode", "cat": "Text", "desc": "Encodes text into a 1-D long tensor of token indices through a vocabulary; unknown tokens become <unk>.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TextEncode</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Turn text into a 1-D tensor of token indices.</span>\n\n<span class=\"sd\">    What: split ``text`` exactly the way the vocabulary's level prescribes and</span>\n<span class=\"sd\">          map every token to its index; tokens the vocabulary has never seen</span>\n<span class=\"sd\">          become the ``&lt;unk&gt;`` index (0) instead of raising - the encoding of</span>\n<span class=\"sd\">          an unknown word is a first-class result, not an error.</span>\n<span class=\"sd\">    In:   vocab (VOCAB) - link from Vocab Build.</span>\n<span class=\"sd\">          text (STRING) - the text to encode; may contain unknown tokens.</span>\n<span class=\"sd\">    Out:  ids (TENSOR) - 1-D ``torch.long``, one entry per token; empty text</span>\n<span class=\"sd\">          encodes to an empty tensor.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"TextEncode\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Text Encode\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Encodes text into a 1-D long tensor of token indices through a vocabulary; unknown tokens become &lt;unk&gt;.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"s2\">\"encode\"</span><span class=\"p\">,</span> <span class=\"s2\">\"tokenize\"</span><span class=\"p\">,</span> <span class=\"s2\">\"ids\"</span><span class=\"p\">,</span> <span class=\"s2\">\"indices\"</span><span class=\"p\">,</span> <span class=\"s2\">\"text\"</span><span class=\"p\">,</span> <span class=\"s2\">\"vocab\"</span><span class=\"p\">,</span> <span class=\"s2\">\"nlp\"</span><span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Vocab</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span><span class=\"s2\">\"vocab\"</span><span class=\"p\">,</span> <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"The vocabulary to encode with; link from Vocab Build.\"</span><span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"text\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"n\">DEFAULT_TEXT</span><span class=\"p\">,</span>\n                    <span class=\"n\">multiline</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">placeholder</span><span class=\"o\">=</span><span class=\"s2\">\"the text to encode\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"The text to encode; tokens missing from the vocabulary become &lt;unk&gt;.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"ids\"</span><span class=\"p\">)],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">,</span> <span class=\"n\">vocab</span><span class=\"p\">,</span> <span class=\"n\">text</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"n\">DEFAULT_TEXT</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">table</span> <span class=\"o\">=</span> <span class=\"n\">_as_vocab</span><span class=\"p\">(</span><span class=\"n\">vocab</span><span class=\"p\">)</span>\n        <span class=\"n\">indices</span> <span class=\"o\">=</span> <span class=\"n\">table</span><span class=\"o\">.</span><span class=\"n\">encode</span><span class=\"p\">(</span><span class=\"s2\">\"\"</span> <span class=\"k\">if</span> <span class=\"n\">text</span> <span class=\"ow\">is</span> <span class=\"kc\">None</span> <span class=\"k\">else</span> <span class=\"nb\">str</span><span class=\"p\">(</span><span class=\"n\">text</span><span class=\"p\">))</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">tensor</span><span class=\"p\">(</span><span class=\"n\">indices</span><span class=\"p\">,</span> <span class=\"n\">dtype</span><span class=\"o\">=</span><span class=\"n\">torch</span><span class=\"o\">.</span><span class=\"n\">long</span><span class=\"p\">))</span>\n"}, "TextDecode": {"id": "TextDecode", "name": "Text Decode", "cat": "Text", "desc": "Decodes token indices (1-D stream or 2-D batch) back into text through a vocabulary.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TextDecode</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Turn a tensor of token indices back into text.</span>\n\n<span class=\"sd\">    What: the inverse of Text Encode - map every index to its token and join</span>\n<span class=\"sd\">          them the way the vocabulary's level prescribes (characters are</span>\n<span class=\"sd\">          concatenated directly, words joined with spaces). A 2-D tensor is</span>\n<span class=\"sd\">          decoded row by row and the rows are joined wi

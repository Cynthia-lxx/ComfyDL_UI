 "desc": "Publishes the optimizer settings (type, lr, betas, eps, weight decay) for a Training Loop node.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TrainingOptimizer</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Publishes the settings of a ``torch.optim`` optimizer as an ``OPTIMIZER`` value.</span>\n\n<span class=\"sd\">    What: the hyper-parameter half of the training loop, kept on widgets while the</span>\n<span class=\"sd\">          value travels on a link. That split is deliberate: the link is part of</span>\n<span class=\"sd\">          ComfyUI's cache signature, so changing the learning rate re-runs every</span>\n<span class=\"sd\">          trainer that consumes it, and one optimizer node can drive several</span>\n<span class=\"sd\">          trainers at once. The value is a *configuration*, not a live optimizer -</span>\n<span class=\"sd\">          the trainer builds the real optimizer, so no device state is cached and</span>\n<span class=\"sd\">          nothing leaks between prompts.</span>\n<span class=\"sd\">    In:   optimizer (COMBO) - ``AdamW``, ``Adam``, ``SGD`` or ``RMSprop``.</span>\n<span class=\"sd\">          lr (FLOAT) - learning rate, 0..1 (0.01 by default; AdamW's own default</span>\n<span class=\"sd\">          of 1e-3 needs more steps than the trainer defaults to).</span>\n<span class=\"sd\">          momentum (FLOAT) - SGD / RMSprop momentum.</span>\n<span class=\"sd\">          beta1 / beta2 (FLOAT) - Adam / AdamW decay rates. RMSprop reads</span>\n<span class=\"sd\">          ``beta2`` as its ``alpha`` (the decay of the running average), so one</span>\n<span class=\"sd\">          widget covers both.</span>\n<span class=\"sd\">          eps (FLOAT) - numerical floor of Adam / AdamW / RMSprop.</span>\n<span class=\"sd\">          weight_decay (FLOAT) - L2 penalty (AdamW applies it decoupled).</span>\n<span class=\"sd\">          amsgrad (BOOLEAN) - AMSGrad variant of Adam / AdamW.</span>\n<span class=\"sd\">          grad_clip_norm (FLOAT) - clip gradients to this global L2 norm before</span>\n<span class=\"sd\">          every ``optimizer.step()``; 0 (the default) disables norm clipping.</span>\n<span class=\"sd\">          grad_clip_value (FLOAT) - clip every gradient element to</span>\n<span class=\"sd\">          ``[-value, +value]``; 0 (the default) disables value clipping. When</span>\n<span class=\"sd\">          both are set the norm clip runs first, then the value clip.</span>\n<span class=\"sd\">    Out:  optimizer (OPTIMIZER) - link this into the ``optimizer`` slot of a</span>\n<span class=\"sd\">          ``Training Loop`` node; the clipping rides along in the same value,</span>\n<span class=\"sd\">          so the trainer always sees one consistent hyper-parameter set.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"TrainingOptimizer\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Optimizer\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Publishes the optimizer settings (type, lr, betas, eps, weight decay) for a Training Loop node.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"s2\">\"sgd\"</span><span class=\"p\">,</span> <span class=\"s2\">\"adam\"</span><span class=\"p\">,</span> <span class=\"s2\">\"adamw\"</span><span class=\"p\">,</span> <span class=\"s2\">\"rmsprop\"</span><span class=\"p\">,</span> <span class=\"s2\">\"learning rate\"</span><span class=\"p\">,</span> <span class=\"s2\">\"lr\"</span><span class=\"p\">,</span>\n                <span class=\"s2\">\"momentum\"</span><span class=\"p\">,</span> <span class=\"s2\">\"weight decay\"</span><span class=\"p\">,</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Combo</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"optimizer\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">options</span><span class=\"o\">=</span><span class=\"nb\">list</span><span class=\"p\">(</span><span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">OPTIMIZER_OPTIONS</span><span class=\"p\">),</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"AdamW\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optimizer to use. AdamW is the safest default for small networks.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"lr\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">DEFAULT_LR</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">1.0</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">0.0001</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Learning rate (0.01 by default).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"momentum\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">0.9</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">0.999</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">0.001</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Momentum of SGD and RMSprop; ignored by Adam and AdamW.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"beta1\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">0.9</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">0.999</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">0.001</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Decay rate of the first moment (Adam / AdamW).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"beta2\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">0.999</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">0.9999</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">0.0001</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Decay rate of the second moment (Adam / AdamW); RMSprop uses it as alpha.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"eps\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">1e-8</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">0.001</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">1e-8</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Numerical floor of the denominator (Adam / AdamW / RMSprop).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"weight_decay\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">DEFAULT_WEIGHT_DECAY</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">1.0</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">0.0001</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"L2 penalty; AdamW applies it decoupled from the gradient.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Boolean</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"amsgrad\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"kc\">False</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Use the AMSGrad variant (Adam / AdamW).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"grad_clip_norm\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">1000.0</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">0.1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Clip gradients to this global L2 norm before each step; 0 disables norm clipping.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"grad_clip_value\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">1000.0</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">0.1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Clip every gradient element to [-value, +value]; 0 disables value clipping.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Optimizer</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"optimizer\"</span><span class=\"p\">)],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">optimizer</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"s2\">\"AdamW\"</span><span class=\"p\">,</span>\n        <span class=\"n\">lr</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">DEFAULT_LR</span><span class=\"p\">,</span>\n        <span class=\"n\">momentum</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">0.9</span><span class=\"p\">,</span>\n        <span class=\"n\">beta1</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">0.9</span><span class=\"p\">,</span>\n        <span class=\"n\">beta2</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">0.999</span><span class=\"p\">,</span>\n        <span class=\"n\">eps</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">1e-8</span><span class=\"p\">,</span>\n        <span class=\"n\">weight_decay</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">DEFAULT_WEIGHT_DECAY</span><span class=\"p\">,</span>\n        <span class=\"n\">amsgrad</span><span class=\"p\">:</span> <span class=\"nb\">bool</span> <span class=\"o\">=</span> <span class=\"kc\">False</span><span class=\"p\">,</span>\n        <span class=\"n\">grad_clip_norm</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">0.0</span><span class=\"p\">,</span>\n        <span class=\"n\">grad_clip_value</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">0.0</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">config</span> <span class=\"o\">=</span> <span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">optimizer_config</span><span class=\"p\">(</span>\n            <span class=\"n\">optimizer</span><span class=\"p\">,</span>\n            <span class=\"n\">lr</span><span class=\"o\">=</span><span class=\"n\">lr</span><span class=\"p\">,</span>\n            <span class=\"n\">momentum</span><span class=\"o\">=</span><span class=\"n\">momentum</span><span class=\"p\">,</span>\n            <span class=\"n\">beta1</span><span class=\"o\">=</span><span class=\"n\">beta1</span><span class=\"p\">,</span>\n            <span class=\"n\">beta2</span><span class=\"o\">=</span><span class=\"n\">beta2</span><span class=\"p\">,</span>\n            <span class=\"n\">eps</span><span class=\"o\">=</span><span class=\"n\">eps</span><span class=\"p\">,</span>\n            <span class=\"n\">weight_decay</span><span class=\"o\">=</span><span class=\"n\">weight_decay</span><span class=\"p\">,</span>\n            <span class=\"n\">amsgrad</span><span class=\"o\">=</span><span class=\"n\">amsgrad</span><span class=\"p\">,</span>\n            <span class=\"n\">grad_clip_norm</span><span class=\"o\">=</span><span class=\"n\">grad_clip_norm</span><span class=\"p\">,</span>\n            <span class=\"n\">grad_clip_value</span><span class=\"o\">=</span><span class=\"n\">grad_clip_value</span><span class=\"p\">,</span>\n        <span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">config</span><span class=\"p\">)</span>\n"}, "TrainingLRScheduler": {"id": "TrainingLRScheduler", "name": "LR Scheduler", "cat": "Training", "desc": "Publishes the LR scheduler settings (StepLR / cosine / exponential / one-cycle / plateau) for a trainer node.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TrainingLRScheduler</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Publishes the settings of a ``torch.optim.lr_scheduler`` as a ``SCHEDULER`` value.</span>\n\n<span class=\"sd\">    What: the learning-rate schedule half of the training loop, kept on widgets</span>\n<span class=\"sd\">          while the value travels on a link - the same deliberate split as the</span>\n<span class=\"sd\">          ``Optimizer`` node: the link is part of ComfyUI's cache signature, so</span>\n<span class=\"sd\">          changing the schedule re-runs every trainer that consumes it, and one</span>\n<span class=\"sd\">          scheduler node can drive several trainers at once. The value is a</span>\n<span class=\"sd\">          *configuration*, not a live scheduler; the trainer builds the real one</span>\n<span class=\"sd\">          against its own step count, so no optimizer or device state is cached</span>\n<span class=\"sd\">          and nothing leaks between prompts.</span>\n<span class=\"sd\">    In:   scheduler (COMBO) - ``CosineAnnealingLR``, ``StepLR``, ``ExponentialLR``,</span>\n<span class=\"sd\">          ``OneCycleLR`` or ``ReduceLROnPlateau``.</span>\n<span class=\"sd\">          step_size (INT) - ``StepLR`` only: decay the lr every this many steps.</span>\n<span class=\"sd\">          gamma (FLOAT) - ``StepLR`` / ``ExponentialLR``: multiply the lr by this</span>\n<span class=\"sd\">          on each decay.</span>\n<span class=\"sd\">          t_max (INT) - ``CosineAnnealingLR`` only: the horizon of the cosine;</span>\n<span class=\"sd\">          ``0`` (the default) means \"the consuming trainer's step count\", which</span>\n<span class=\"sd\">          is exact and needs no bookkeeping from the user.</span>\n<span class=\"sd\">          eta_min (FLOAT) - ``CosineAnnealingLR`` / ``ReduceLROnPlateau``: the</span>\n<span class=\"sd\">          lower bound of the lr.</span>\n<span class=\"sd\">          pct_start (FLOAT) - ``OneCycleLR`` only: the fraction of the steps</span>\n<span class=\"sd\">          spent warming the lr up (``max_lr`` is the wired optimizer's ``lr``).</span>\n<span class=\"sd\">          patience (INT) - ``ReduceLROnPlateau`` only: steps without improvement</span>\n<span class=\"sd\">          of the (smoothed) loss before the lr is reduced.</span>\n<span class=\"sd\">          factor (FLOAT) - ``ReduceLROnPlateau`` only: multiply the lr by this</span>\n<span class=\"sd\">          on each reduction.</span>\n<span class=\"sd\">    Out:  scheduler (SCHEDULER) - link this into the ``scheduler`` slot of a</span>\n<span class=\"sd\">          ``Training Loop`` or ``Language Model Train`` node. Unused fields of</span>\n<span class=\"sd\">          the chosen scheduler are ignored, so one node serves all five.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"TrainingLRScheduler\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"LR Scheduler\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Publishes the LR scheduler settings (StepLR / cosine / exponential / one-cycle / plateau) for a trainer node.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"s2\">\"lr\"</span><span class=\"p\">,</span> <span class=\"s2\">\"learning rate\"</span><span class=\"p\">,</span> <span class=\"s2\">\"schedule\"</span><span class=\"p\">,</span> <span class=\"s2\">\"scheduler\"</span><span class=\"p\">,</span> <span class=\"s2\">\"decay\"</span><span class=\"p\">,</span> <span class=\"s2\">\"cosine\"</span><span class=\"p\">,</span>\n                <span class=\"s2\">\"step\"</span><span class=\"p\">,</span> <span class=\"s2\">\"one cycle\"</span><span class=\"p\">,</span> <span class=\"s2\">\"plateau\"</span><span class=\"p\">,</span> <span class=\"s2\">\"annealing\"</span><span class=\"p\">,</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Combo</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"scheduler\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">options</span><span class=\"o\">=</span><span class=\"nb\">list</span><span class=\"p\">(</span><span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">SCHEDULER_OPTIONS</span><span class=\"p\">),</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"CosineAnnealingLR\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Scheduler to use; only its fields are read.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"step_size\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">30</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">100000</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"StepLR: decay the lr every this many steps.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"gamma\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">0.1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0001</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">0.999</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">0.01</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"StepLR / ExponentialLR: multiplier applied on each decay.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"t_max\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">1000000</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"CosineAnnealingLR: horizon of the cosine; 0 = the trainer's step count.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"eta_min\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">1.0</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">0.0001</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"CosineAnnealingLR / ReduceLROnPlateau: lower bound of the lr.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"pct_start\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">0.3</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.01</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">1.0</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">0.01</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"OneCycleLR: fraction of the steps spent warming up.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"patience\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">10</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">100000</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"ReduceLROnPlateau: steps without improvement before the lr is reduced.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Float</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"factor\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mf\">0.1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mf\">0.01</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mf\">0.99</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mf\">0.01</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"ReduceLROnPlateau: multiplier applied on each reduction.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">outputs</span><span class=\"o\">=</span><span class=\"p\">[</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Scheduler</span><span class=\"o\">.</span><span class=\"n\">Output</span><span class=\"p\">(</span><span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"scheduler\"</span><span class=\"p\">)],</span>\n        <span class=\"p\">)</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">execute</span><span class=\"p\">(</span>\n        <span class=\"bp\">cls</span><span class=\"p\">,</span>\n        <span class=\"n\">scheduler</span><span class=\"p\">:</span> <span class=\"nb\">str</span> <span class=\"o\">=</span> <span class=\"s2\">\"CosineAnnealingLR\"</span><span class=\"p\">,</span>\n        <span class=\"n\">step_size</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">30</span><span class=\"p\">,</span>\n        <span class=\"n\">gamma</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">0.1</span><span class=\"p\">,</span>\n        <span class=\"n\">t_max</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">0</span><span class=\"p\">,</span>\n        <span class=\"n\">eta_min</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">0.0</span><span class=\"p\">,</span>\n        <span class=\"n\">pct_start</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">0.3</span><span class=\"p\">,</span>\n        <span class=\"n\">patience</span><span class=\"p\">:</span> <span class=\"nb\">int</span> <span class=\"o\">=</span> <span class=\"mi\">10</span><span class=\"p\">,</span>\n        <span class=\"n\">factor</span><span class=\"p\">:</span> <span class=\"nb\">float</span> <span class=\"o\">=</span> <span class=\"mf\">0.1</span><span class=\"p\">,</span>\n    <span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">:</span>\n        <span class=\"n\">config</span> <span class=\"o\">=</span> <span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">scheduler_config</span><span class=\"p\">(</span>\n            <span class=\"n\">scheduler</span><span class=\"p\">,</span>\n            <span class=\"n\">step_size</span><span class=\"o\">=</span><span class=\"n\">step_size</span><span class=\"p\">,</span>\n            <span class=\"n\">gamma</span><span class=\"o\">=</span><span class=\"n\">gamma</span><span class=\"p\">,</span>\n            <span class=\"n\">t_max</span><span class=\"o\">=</span><span class=\"n\">t_max</span><span class=\"p\">,</span>\n            <span class=\"n\">eta_min</span><span class=\"o\">=</span><span class=\"n\">eta_min</span><span class=\"p\">,</span>\n            <span class=\"n\">pct_start</span><span class=\"o\">=</span><span class=\"n\">pct_start</span><span class=\"p\">,</span>\n            <span class=\"n\">patience</span><span class=\"o\">=</span><span class=\"n\">patience</span><span class=\"p\">,</span>\n            <span class=\"n\">factor</span><span class=\"o\">=</span><span class=\"n\">factor</span><span class=\"p\">,</span>\n        <span class=\"p\">)</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">NodeOutput</span><span class=\"p\">(</span><span class=\"n\">config</span><span class=\"p\">)</span>\n"}, "TrainingLoop": {"id": "TrainingLoop", "name": "Training Loop", "cat": "Training", "desc": "Trains a small MLP on x/y inside the node (forward + backward + optimizer.step) and returns the trained parameters, loss history and predictions.", "code": "<span class=\"k\">class</span><span class=\"w\"> </span><span class=\"nc\">TrainingLoop</span><span class=\"p\">(</span><span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">ComfyNode</span><span class=\"p\">):</span>\n<span class=\"w\">    </span><span class=\"sd\">\"\"\"Trains a small fully connected network on ``x`` / ``y``, inside the node.</span>\n\n<span class=\"sd\">    What: the training closure. ComfyUI executes every node under</span>\n<span class=\"sd\">          ``torch.inference_mode()`` and caches the result, so a gradient cannot</span>\n<span class=\"sd\">          survive a node boundary: this node therefore runs forward, backward and</span>\n<span class=\"sd\">          ``optimizer.step()`` itself, for ``steps`` iterations, inside a</span>\n<span class=\"sd\">          ``torch.inference_mode(False)`` block (the same technique upstream's</span>\n<span class=\"sd\">          ``TrainLoraNode`` uses). It builds an MLP from ``hidden`` / ``activation``</span>\n<span class=\"sd\">          exactly like ``nn.Linear`` stacking does - ``in_features`` from ``x``,</span>\n<span class=\"sd\">          ``out_features`` from ``y``, activation between the hidden layers only -</span>\n<span class=\"sd\">          and returns the trained parameters, so the graph can be split anywhere</span>\n<span class=\"sd\">          between \"train\" and \"use\".</span>\n<span class=\"sd\">          Three optional per-iteration pieces: a wired ``SCHEDULER`` is stepped</span>\n<span class=\"sd\">          after every ``optimizer.step()`` (``ReduceLROnPlateau`` with the</span>\n<span class=\"sd\">          smoothed step loss, the others without arguments), gradient clipping</span>\n<span class=\"sd\">          travels in the ``OPTIMIZER`` config (``grad_clip_norm`` /</span>\n<span class=\"sd\">          ``grad_clip_value``, 0 = off) and runs right before the step, and</span>\n<span class=\"sd\">          early stopping watches the moving average of the step loss (window 8):</span>\n<span class=\"sd\">          once ``early_stop_patience`` steps pass without an improvement of</span>\n<span class=\"sd\">          ``early_stop_min_delta``, the parameters are rolled back to the best</span>\n<span class=\"sd\">          point and the run ends there.</span>\n<span class=\"sd\">          Every output is detached: no autograd graph is left in ComfyUI's cache.</span>\n<span class=\"sd\">          While training, the node also drives ComfyUI's live preview channel:</span>\n<span class=\"sd\">          the loss curve recorded so far is rendered (rate-limited to one</span>\n<span class=\"sd\">          frame per ~0.5 s, always a final frame at the end) and shown under</span>\n<span class=\"sd\">          the node - the same side channel the KSampler latent preview uses.</span>\n<span class=\"sd\">    In:   x (TENSOR) - inputs, ``(N, in_features)`` or any shape whose *last*</span>\n<span class=\"sd\">          dimension is the feature dimension (a 1-D tensor is read as a single</span>\n<span class=\"sd\">          feature column). Cast to float32.</span>\n<span class=\"sd\">          y (TENSOR) - targets. For ``mse`` / ``l1`` / ``smooth_l1`` /</span>\n<span class=\"sd\">          ``bce_with_logits`` / ``kl_div``: ``(N, out_features)``. For</span>\n<span class=\"sd\">          ``cross_entropy``: class indices, or a 2-D one-hot / probability</span>\n<span class=\"sd\">          tensor, whose last dimension is the class count.</span>\n<span class=\"sd\">          optimizer (OPTIMIZER) - settings published by an ``Optimizer`` node,</span>\n<span class=\"sd\">          including the gradient clipping widgets.</span>\n<span class=\"sd\">          params (PARAMS, optional) - warm start: entries whose name *and* shape</span>\n<span class=\"sd\">          match the freshly built network are loaded, every other entry is</span>\n<span class=\"sd\">          reported and ignored. Unconnected means a fresh initialisation.</span>\n<span class=\"sd\">          scheduler (SCHEDULER, optional) - settings published by an</span>\n<span class=\"sd\">          ``LR Scheduler`` node. Unconnected means a constant learning rate,</span>\n<span class=\"sd\">          exactly like before this slot existed.</span>\n<span class=\"sd\">          hidden (STRING) - widths of the hidden layers, e.g. ``\"8\"`` or</span>\n<span class=\"sd\">          ``\"16,8\"``; empty means no hidden layer, i.e. plain linear regression.</span>\n<span class=\"sd\">          Unreadable text falls back to ``\"8\"`` with a warning.</span>\n<span class=\"sd\">          activation (COMBO) - applied between the hidden layers; ``none`` makes</span>\n<span class=\"sd\">          the whole network linear.</span>\n<span class=\"sd\">          loss (COMBO) - ``mse``, ``l1``, ``smooth_l1``, ``cross_entropy``,</span>\n<span class=\"sd\">          ``bce_with_logits`` or ``kl_div``.</span>\n<span class=\"sd\">          steps (INT) - number of optimizer steps (200 by default); each step is</span>\n<span class=\"sd\">          one forward + backward + update.</span>\n<span class=\"sd\">          batch_size (INT) - samples per step; ``0`` (default) uses the whole</span>\n<span class=\"sd\">          dataset every step, the most stable choice for small teaching data.</span>\n<span class=\"sd\">          seed (INT) - seeds the initialisation and the batch shuffling, so the</span>\n<span class=\"sd\">          same inputs always produce the same run.</span>\n<span class=\"sd\">          early_stop_patience (INT) - stop after this many steps without an</span>\n<span class=\"sd\">          improvement of the smoothed loss; 0 (the default) disables early</span>\n<span class=\"sd\">          stopping.</span>\n<span class=\"sd\">          early_stop_min_delta (FLOAT) - the smallest improvement of the</span>\n<span class=\"sd\">          smoothed loss that resets the patience counter.</span>\n<span class=\"sd\">    Out:  params (PARAMS) - the trained parameters, named ``layer0.weight``,</span>\n<span class=\"sd\">          ``layer0.bias``, ``layer1.weight``, ... in layer order. Feed them to</span>\n<span class=\"sd\">          ``Parameters to Tensor`` to run inference with the ``Basic`` layer</span>\n<span class=\"sd\">          nodes, to ``Save Parameters``, or back into another ``Training Loop``</span>\n<span class=\"sd\">          to continue training. With early stopping they are the parameters of</span>\n<span class=\"sd\">          the *best* step, not the last one.</span>\n<span class=\"sd\">          loss (TENSOR) - scalar, the last entry of the (possibly truncated)</span>\n<span class=\"sd\">          loss history.</span>\n<span class=\"sd\">          loss_history (TENSOR) - 1-D, one entry per executed step; with early</span>\n<span class=\"sd\">          stopping it is truncated to the best step, the convergence curve,</span>\n<span class=\"sd\">          ready for any of the visualisation nodes.</span>\n<span class=\"sd\">          prediction (TENSOR) - ``model(x)`` of the trained network, detached.</span>\n<span class=\"sd\">    \"\"\"</span>\n\n    <span class=\"nd\">@classmethod</span>\n    <span class=\"k\">def</span><span class=\"w\"> </span><span class=\"nf\">define_schema</span><span class=\"p\">(</span><span class=\"bp\">cls</span><span class=\"p\">)</span> <span class=\"o\">-&gt;</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">:</span>\n        <span class=\"k\">return</span> <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Schema</span><span class=\"p\">(</span>\n            <span class=\"n\">node_id</span><span class=\"o\">=</span><span class=\"s2\">\"TrainingLoop\"</span><span class=\"p\">,</span>\n            <span class=\"n\">display_name</span><span class=\"o\">=</span><span class=\"s2\">\"Training Loop\"</span><span class=\"p\">,</span>\n            <span class=\"n\">category</span><span class=\"o\">=</span><span class=\"n\">CATEGORY</span><span class=\"p\">,</span>\n            <span class=\"n\">description</span><span class=\"o\">=</span><span class=\"s2\">\"Trains a small MLP on x/y inside the node (forward + backward + optimizer.step) and returns the trained parameters, loss history and predictions.\"</span><span class=\"p\">,</span>\n            <span class=\"n\">search_aliases</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"s2\">\"train\"</span><span class=\"p\">,</span> <span class=\"s2\">\"fit\"</span><span class=\"p\">,</span> <span class=\"s2\">\"gradient descent\"</span><span class=\"p\">,</span> <span class=\"s2\">\"backward\"</span><span class=\"p\">,</span> <span class=\"s2\">\"optimizer\"</span><span class=\"p\">,</span>\n                <span class=\"s2\">\"regression\"</span><span class=\"p\">,</span> <span class=\"s2\">\"classifier\"</span><span class=\"p\">,</span> <span class=\"s2\">\"mlp\"</span><span class=\"p\">,</span> <span class=\"s2\">\"epoch\"</span><span class=\"p\">,</span> <span class=\"s2\">\"loss\"</span><span class=\"p\">,</span>\n            <span class=\"p\">],</span>\n            <span class=\"n\">inputs</span><span class=\"o\">=</span><span class=\"p\">[</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"x\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Inputs, shape (N, in_features); the last dimension is the feature dimension.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Tensor</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"y\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Targets: (N, out_features) for mse/l1, or class indices / one-hot for cross_entropy.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Optimizer</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"optimizer\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optimizer settings, linked from an Optimizer node.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Params</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"params\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional starting parameters (warm start); entries with a matching name and shape are loaded.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Scheduler</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"scheduler\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">optional</span><span class=\"o\">=</span><span class=\"kc\">True</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Optional LR scheduler settings from an LR Scheduler node; unconnected = constant learning rate.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">String</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"hidden\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"n\">DEFAULT_HIDDEN</span><span class=\"p\">,</span>\n                    <span class=\"n\">placeholder</span><span class=\"o\">=</span><span class=\"s2\">\"e.g. 8 or 16,8 (empty = no hidden layer)\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Widths of the hidden layers, e.g. 8 or 16,8; empty for plain linear regression.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Combo</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"activation\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">options</span><span class=\"o\">=</span><span class=\"nb\">list</span><span class=\"p\">(</span><span class=\"n\">tp</span><span class=\"o\">.</span><span class=\"n\">ACTIVATION_OPTIONS</span><span class=\"p\">),</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"relu\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Activation applied between the hidden layers; the output layer stays linear.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Combo</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"loss\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">options</span><span class=\"o\">=</span><span class=\"nb\">list</span><span class=\"p\">(</span><span class=\"n\">LOSS_OPTIONS</span><span class=\"p\">),</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"s2\">\"mse\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Loss: mse / l1 / smooth_l1 / bce_with_logits / kl_div for regression targets, cross_entropy for class targets.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"steps\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">200</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">100000</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Number of optimizer steps (one forward + backward + update each).\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"batch_size\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">65536</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Samples per step; 0 uses the whole dataset every step.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"seed\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">4294967295</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Seeds the initialisation and the batch shuffling.\"</span><span class=\"p\">,</span>\n                <span class=\"p\">),</span>\n                <span class=\"n\">io</span><span class=\"o\">.</span><span class=\"n\">Int</span><span class=\"o\">.</span><span class=\"n\">Input</span><span class=\"p\">(</span>\n                    <span class=\"s2\">\"early_stop_patience\"</span><span class=\"p\">,</span>\n                    <span class=\"n\">default</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">min</span><span class=\"o\">=</span><span class=\"mi\">0</span><span class=\"p\">,</span>\n                    <span class=\"nb\">max</span><span class=\"o\">=</span><span class=\"mi\">100000</span><span class=\"p\">,</span>\n                    <span class=\"n\">step</span><span class=\"o\">=</span><span class=\"mi\">1</span><span class=\"p\">,</span>\n                    <span class=\"n\">tooltip</span><span class=\"o\">=</span><span class=\"s2\">\"Stop after this many steps without

<!-- U stick 1 [0.88] real-machine spike page (not part of the kit; served
     from /comfydl/ui-assets/spike.html while the kit itself is served from
     /comfydl/ui/).  Exercises the full chain a stick-2 panel will rely on:
     token layer -> hue theme switch -> bridge mapping -> Custom Element
     (Shadow DOM) -> i18n change -> reduced-motion gate.  Every assertion
     writes a data-* verdict onto <body> so a CDP driver can machine-check
     the page without a human reading it. -->
<html lang="en" data-theme="blue">
<head>
  <meta charset="utf-8"/>
  <title>ComfyDL UI kit spike</title>
  <link rel="stylesheet" href="/comfydl/ui/tokens.css"/>
  <link rel="stylesheet" href="/comfydl/ui/themes.css"/>
  <link rel="stylesheet" href="/comfydl/ui-assets/bridge.css"/>
  <link rel="stylesheet" href="/comfydl/ui/components/ui-button/ui-button.css"/>
</head>
<body style="padding:24px;font-family:var(--font-family)">
  <div style="display:flex;gap:8px;margin-bottom:16px">
    <button data-spike-theme="blue">blue</button>
    <button data-spike-theme="purple">purple</button>
    <button data-spike-theme="red">red</button>
    <button data-spike-motion="off">motion-off</button>
    <button data-spike-motion="on">motion-on</button>
    <button data-spike-lang="zh-CN">zh-CN</button>
    <button data-spike-lang="en">en</button>
  </div>
  <div style="display:flex;gap:12px;align-items:center">
    <ui-button id="spike-btn" variant="primary">Spike</ui-button>
    <span id="spike-readout"></span>
  </div>
  <script type="module">
    const verdict = {};
    const readout = document.getElementById("spike-readout");
    const stamp = () => { readout.textContent = JSON.stringify(verdict); };

    // 1) the kit component registers itself (Custom Elements + open Shadow DOM)
    //    (dist layout: components/<id>/<file> - the assembler flattens the
    //    source-tree 04-components/ prefix away)
    await import("/comfydl/ui/components/ui-button/ui-button.js");
    const btn = document.getElementById("spike-btn");
    await customElements.whenDefined("ui-button");
    verdict.defined = customElements.get("ui-button")?.name === "UIButton";
    verdict.shadow = !!btn.shadowRoot;

    // 2) the accent actually changes when the hue theme switches (CSS custom
    //    properties pierce the shadow boundary - this is the whole bet)
    const accent = () => getComputedStyle(btn).getPropertyValue("--ui-accent").trim();
    const before = accent();
    document.documentElement.dataset.theme = "purple";
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    const after = accent();
    verdict.themeSwitch = before !== "" && after !== "" && before !== after;
    verdict.accentBlue = before; verdict.accentPurple = after;
    document.documentElement.dataset.theme = "blue";

    // 3) the bridge layer wins the alias layer: --ui-surface tracks the
    //    official variable (absent on this page -> falls back to the kit)
    verdict.bridgeSurface = getComputedStyle(btn)
      .getPropertyValue("--ui-surface").trim() !== "";

    // 4) our motion gates drive the kit's reduced-motion scale
    verdict.motionOn = getComputedStyle(document.documentElement)
      .getPropertyValue("--motion-scale").trim() === "1";
    document.documentElement.classList.add("cdl-motion-off");
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    verdict.motionOff = getComputedStyle(document.documentElement)
      .getPropertyValue("--motion-scale").trim() === "0";
    document.documentElement.classList.remove("cdl-motion-off");

    // 5) pressing the button dispatches a composed event (panel consumers)
    btn.addEventListener("ui-press", () => { verdict.pressEvent = true; stamp(); });
    btn.dispatchEvent(new CustomEvent("ui-press", { bubbles: true, composed: true }));

    for (const [k, v] of Object.entries(verdict)) {
      document.body.dataset[k] = String(v);
    }
    stamp();
  </script>
</body>
</html>

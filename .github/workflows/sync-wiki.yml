name: Sync Docs to Wiki

on:
  push:
    branches: [ master ] 
    paths:
      - 'comfydl/FUNCTIONS.md'
      - 'QUANTIZATION.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Checkout Wiki repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-checkout
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Prepare and Sync files
        run: |
          mkdir -p temp-wiki
          
          # 1. High Priority Files
          if [ -f "comfydl/FUNCTIONS.md" ]; then
            cp "comfydl/FUNCTIONS.md" temp-wiki/01-FUNCTIONS.md
          fi
          
          if [ -f "QUANTIZATION.md" ]; then
            cp "QUANTIZATION.md" temp-wiki/02-QUANTIZATION.md
          fi
          
          if [ -f "docs/network-and-layers.html" ]; then
            pandoc "docs/network-and-layers.html" -o "temp-wiki/03-Node-Reference.md"
          fi

          # 2. Process docs/
          if ls docs/*.md 1> /dev/null 2>&1; then
            for f in docs/*.md; do
              filename=$(basename "$f")
              cp "$f" "temp-wiki/Docs-$filename"
            done
          fi

          # 3. Generate English Sidebar
          cat << 'EOF' > temp-wiki/_Sidebar.md
          ### 🚀 Core Documentation
          * [Function Overview](01-FUNCTIONS)
          * [Quantization Guide](02-QUANTIZATION)
          * [Node Reference](03-Node-Reference)
          
          ### 📚 Detailed Docs
          EOF

          if ls docs/*.md 1> /dev/null 2>&1; then
            for f in docs/*.md; do
              filename=$(basename "$f" .md)
              title=$(echo "$filename" | sed -e 's/[-_]/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)}1')
              echo "* [$title](Docs-$filename)" >> temp-wiki/_Sidebar.md
            done
          fi

          # 4. Sync to Wiki repo
          rsync -av --delete --exclude='.git' temp-wiki/ wiki-checkout/

      - name: Commit and Push
        working-directory: wiki-checkout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          
          git add -A
          git commit -m "Auto-sync docs to Wiki (English layout)"
          git push
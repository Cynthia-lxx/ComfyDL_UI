name: Sync Docs to Wiki

on:
  push:
    branches: [ master ] # 如果你本地的主分支叫 master，请把这里改成 master
    paths:
      - 'comfydl/FUNCTIONS.md'
      - 'QUANTIZATION.md'
      - 'docs/**'
  workflow_dispatch: # 允许你在网页上手动点击触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Checkout Wiki repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-checkout
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Prepare and Sync files
        run: |
          mkdir -p temp-wiki
          
          # 1. 核心高优先级文件（加数字前缀置顶）
          if [ -f "comfydl/FUNCTIONS.md" ]; then
            cp "comfydl/FUNCTIONS.md" temp-wiki/01-FUNCTIONS.md
          fi
          
          if [ -f "QUANTIZATION.md" ]; then
            cp "QUANTIZATION.md" temp-wiki/02-QUANTIZATION.md
          fi
          
          if [ -f "docs/network-and-layers.html" ]; then
            pandoc "docs/network-and-layers.html" -o "temp-wiki/03-Network-and-Layers.md"
          fi

          # 2. 遍历 docs/ 目录
          if ls docs/*.md 1> /dev/null 2>&1; then
            for f in docs/*.md; do
              filename=$(basename "$f")
              cp "$f" "temp-wiki/Docs-$filename"
            done
          fi

          # 3. 自动生成 _Sidebar.md 侧边栏
          echo "### 🚀 核心文档" > temp-wiki/_Sidebar.md
          echo "* [Features (FUNCTIONS)](01-FUNCTIONS)" >> temp-wiki/_Sidebar.md
          echo "* [Quantization Guide (QUANTIZATION)](02-QUANTIZATION)" >> temp-wiki/_Sidebar.md
          echo "* [Nodes Reference (Network & Layers)](03-Network-and-Layers)" >> temp-wiki/_Sidebar.md
          echo "" >> temp-wiki/_Sidebar.md
          echo "### 📚 详细文档" >> temp-wiki/_Sidebar.md
          
          # 把 docs 里的文件也塞进侧边栏
          if ls docs/*.md 1> /dev/null 2>&1; then
            for f in docs/*.md; do
              filename=$(basename "$f" .md) # 去掉 .md 后缀
              # 利用 awk 把首字母大写
              title=$(echo "$filename" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
              echo "* [$title](Docs-$filename)" >> temp-wiki/_Sidebar.md
            done
          fi

          # 4. 同步到 Wiki 仓库
          rsync -av --delete --exclude='.git' temp-wiki/ wiki-checkout/

      - name: Commit and Push
        working-directory: wiki-checkout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          
          git add -A
          git commit -m "Auto-sync docs to Wiki (Prioritized layout)"
          git push